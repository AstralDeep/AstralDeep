# Gitleaks configuration — feature 029 (T028, FR-037).
#
# Extends the FULL default ruleset (nothing disabled). The allowlist below
# excuses ONLY verified intentional placeholders and test fixtures:
#   - backend test fixtures: pytest HMAC secrets ("pytest-audit-secret",
#     "alternate-secret-for-test"), fake agent keys ("secret123",
#     "test-secret-key"), and the hardcoded UNSIGNED mock JWT used by
#     mock-auth tests (backend/tests, backend/*/tests)
#   - .env.example shipped placeholders (the exit-78 boot gate refuses them
#     in production: session_store.assert_production_posture)
#   - mock-auth dev literals ("dev-token") and the documented placeholder
#     secrets ("change-me", "dev-audit-hmac-secret-change-me-in-prod")
#   - throwaway CI-only values used by .github/workflows/ci.yml
#     (ci-test-agent-key, ci-test-hmac-secret, DB password astral_ci) and the
#     local-dev compose default DB password (astral_dev)
#
# Feature 089 adds two named TypeSafe rules below the [extend] block and one
# allowlisted synthetic canary. Tests must use that canary, which matches the
# rule's shape on purpose and is not a credential.

[extend]
useDefault = true

# Feature 089: TypeSafe System One keys. The default ruleset's generic
# high-entropy detectors catch most key shapes, but a named rule fails with a
# message that says which credential leaked, and it fires on the lowercase
# prefixed form the generic rule scores too low to flag. The pattern was
# derived from a real key's observed format under T003a; only the pattern lives
# here, never a key and never a prefix sample.
[[rules]]
id = "typesafe-system-one-key"
description = "TypeSafe System One API key"
regex = '''\b[a-z]{2,10}_(?=[a-z0-9_]{0,240}[0-9])[a-z0-9_]{40,}\b|\b(?i:ts|tsk|tsai)[-_](?i:live[-_])?[A-Za-z0-9_\-]{20,}\b'''
keywords = ["ts_", "tsk_", "tsai_", "ts-", "tsk-"]
tags = ["key", "typesafe", "feature-089"]

[[rules]]
id = "typesafe-api-key-assignment"
description = "TypeSafe API key assigned to a variable or field"
regex = '''(?i)typesafe[_\-.]?api[_\-.]?key["'\s]*[:=]["'\s]*([A-Za-z0-9_\-]{16,})'''
secretGroup = 1
keywords = ["typesafe_api_key", "typesafe-api-key", "TYPESAFE_API_KEY"]
tags = ["key", "typesafe", "feature-089"]

[allowlist]
description = "Verified intentional dev/test placeholders — not credentials"
paths = [
  # Backend test fixtures (mock JWTs, pytest-only secrets, fake keys)
  '''backend/tests/.*''',
  '''backend/.*/tests/.*''',
  # Windows-client test fixtures — e.g. the throwaway PEM the 063
  # remote-machines surface test round-trips through the form
  '''components/AstralProjection/windows-client/tests/.*''',
  # Shipped example env file — placeholder values only; production boot
  # refuses them (exit 78)
  '''\.env\.example$''',
]
regexes = [
  # Mock-auth literal token (development mode only; removed from client.js by 028)
  '''dev-token''',
  # Shipped audit-HMAC placeholder + its generic form; both are refused by the
  # production boot gate (orchestrator/session_store._DEV_PLACEHOLDER_SECRETS)
  '''dev-audit-hmac-secret-change-me-in-prod''',
  '''change-me''',
  # CI-only throwaway values defined in .github/workflows/ci.yml
  '''ci-test-[A-Za-z0-9_-]+''',
  '''astral_ci''',
  # Local-dev default DB password (docker-compose / start-docker.sh fallback)
  '''astral_dev''',
  # Exact generic-api-key false positives. The first is the public package /
  # renderer name in generated technology summaries; the second is a Python
  # keyword-argument binding in the release-evidence collector. Anchoring the
  # complete detected value keeps nearby or extended credential-like values
  # subject to the default rule set.
  '''^astralprims/ROTE$''',
  '''^producer_key=slot$''',
  # Public immutable LETS v1.0.11 OpenAPI contract digest. It is repeated in
  # the composition, release anchor, and exact-value contract test.
  '''^a5d99771f32f58ce5fd6d18c380bea1f310248a900bb6ddc672638ed6a0ce5fd$''',
  # The repo's hardcoded UNSIGNED mock JWT (alg HS256 header + a payload that
  # starts with {"realm_access":..., empty signature segment). Lives in
  # backend tests today and in deleted frontend/ files in git history.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJyZWFsbV9hY2Nlc3M''',
  # Feature 089 synthetic TypeSafe canary. It matches the TypeSafe rule
  # shape on purpose so the T059 scan can prove the scrubbers work, and it
  # is not a key.
  '''ts_live_CANARY0000NOTAREALKEY000000''',
]
