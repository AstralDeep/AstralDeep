<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AstralDeep</title>
  <link rel="icon" type="image/png" href="/static/img/astra-fav.png?v=%%ASTRAL_V:img/astra-fav.png%%">
  <link rel="apple-touch-icon" href="/static/img/astra-fav.png?v=%%ASTRAL_V:img/astra-fav.png%%">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/inter-latin.woff2?v=%%ASTRAL_V:fonts/inter-latin.woff2%%">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/jetbrains-mono-latin.woff2?v=%%ASTRAL_V:fonts/jetbrains-mono-latin.woff2%%">
  <link rel="stylesheet" href="/static/astral.css?v=%%ASTRAL_V:astral.css%%">
  <script nonce="%%ASTRAL_NONCE%%">
    window.__ASTRAL_TOKEN__ = "%%ASTRAL_TOKEN%%"; window.__ASTRAL_RESUMED__ = %%ASTRAL_RESUMED%%;
    window.__ASTRAL_PLOTLY_URL__ = "/static/vendor/plotly.min.js?v=%%ASTRAL_V:vendor/plotly.min.js%%";
    window.__ASTRAL_LIVEKIT_URL__ = "/static/vendor/livekit-client.umd.min.js?v=%%ASTRAL_V:vendor/livekit-client.umd.min.js%%";
  </script>
  <script src="/static/vendor/tailwind.js?v=%%ASTRAL_V:vendor/tailwind.js%%"></script>
  <script nonce="%%ASTRAL_NONCE%%">
    // Map Tailwind `astral-*` color tokens to the runtime CSS variables so
    // every utility (bg-astral-primary, text-astral-muted, astral-primary/20, …)
    // resolves and theme_apply/color_picker can keep mutating them live.
    tailwind.config = {
      theme: { extend: {
        colors: {
          'astral-bg': 'rgb(var(--astral-bg) / <alpha-value>)',
          'astral-surface': 'rgb(var(--astral-surface) / <alpha-value>)',
          'astral-primary': 'rgb(var(--astral-primary) / <alpha-value>)',
          'astral-secondary': 'rgb(var(--astral-secondary) / <alpha-value>)',
          'astral-text': 'rgb(var(--astral-text) / <alpha-value>)',
          'astral-muted': 'rgb(var(--astral-muted) / <alpha-value>)',
          'astral-accent': 'rgb(var(--astral-accent) / <alpha-value>)',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      } },
    };
  </script>
</head>
<body class="bg-astral-bg text-astral-text">
  <div class="flex flex-col h-screen">
    <!-- Server-rendered top bar + static settings menu (role-gated at GET /
         time; see webrender/chrome/topbar.py). Glass/border styling lives in
         astral.css (#astral-topbar). -->
    <header id="astral-topbar" class="flex items-center">%%ASTRAL_TOPBAR%%</header>
    <main class="flex flex-1 min-h-0">
      <!-- Canvas: server-rendered UI (astralprims primitives). The initial
           welcome examples arrive over the normal ui_render path right after
           register_ui (orchestrator/welcome.py) — never as shell HTML. -->
      <section id="astral-canvas" data-tour-target="canvas.workspace" class="astral-canvas-panel flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Shared cross-client empty state (client.js removes it on the first
             render with content and re-shows it when the canvas is cleared) -->
        <div id="astral-canvas-empty" class="astral-canvas-empty">
          <div class="astral-canvas-empty-glyph" aria-hidden="true">✦</div>
          <p class="astral-canvas-empty-title">Your generated interface appears here</p>
          <p class="astral-canvas-empty-sub">Ask something below and AstralDeep will build a live interface for it.</p>
        </div>
      </section>
      <!-- Chat panel: raised glass rail. astral.css owns surface/border AND
           width/placement per layout mode (066): "split" right rail,
           "collapsed" floating composer + overlay drawer, "stacked" bottom
           sheet. No Tailwind width classes here — the mode CSS decides. -->
      <aside class="astral-chat-panel flex flex-col min-h-0">
        <!-- 066: rail header — collapse control (split mode only) -->
        <div class="astral-rail-head">
          <span class="astral-rail-title">Conversation</span>
          <button type="button" id="astral-collapse-btn" class="astral-rail-collapse"
                  title="Hide the chat panel (canvas full width)" aria-label="Hide the chat panel">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
          </button>
        </div>
        <!-- Server-driven chat-history surface (skeleton → list), ROTE-adapted -->
        <div id="astral-history" class="astral-history-region shrink-0 overflow-y-auto max-h-44 border-b border-white/10 px-3 py-2 space-y-1"></div>
        <!-- Stacked layout only: collapsible transcript bar (the web twin of
             the Android StackedShell "Messages (N)" panel). Hidden on split
             layouts by astral.css; client.js keeps the count in sync and
             toggles body.astral-msgs-open. -->
        <button type="button" id="astral-msgs-toggle" class="astral-msgs-toggle" hidden
                aria-expanded="false" aria-controls="astral-chat"><span id="astral-msgs-label">Messages</span></button>
        <div id="astral-chat" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
        <form id="astral-form" class="astral-chat-form p-3 flex flex-col gap-2">
          <!-- 066: connection state pill — visible whenever the socket is not
               healthily registered; sends queue instead of vanishing. -->
          <div id="astral-conn" class="astral-conn" hidden data-conn="connecting">
            <span class="astral-conn-dot" aria-hidden="true"></span>
            <span id="astral-conn-text" role="status" aria-live="polite">Connecting…</span>
          </div>
          <!-- 066: turn status line — phases render here, beside the composer,
               instead of only in the far-away topbar. client.js mirrors the
               topbar #astral-status writes into it. -->
          <div id="astral-turn-status" class="astral-turn-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
          <!-- Attachment chips for files staged on the next turn -->
          <div id="astral-attachments" class="astral-attachments hidden flex flex-wrap gap-1.5"></div>
          <!-- Feature 040 (US5): slash-command typeahead (shown while typing a
               leading "/"). Discovery only — the server expands the command
               into a normal prompt through the usual permission/audit gates. -->
          <div id="astral-slash-menu" class="astral-slash-menu hidden" role="listbox" aria-label="Slash commands"></div>
          <div class="flex gap-2 items-center">
            <!-- Attachment (paperclip) control. The hidden input carries class
                 astral-file-upload so the client.js change-listener handles
                 selection; accept list is injected server-side from the
                 content_type allow-list (single source). -->
            <button type="button" id="astral-attach-btn" class="astral-attach-btn shrink-0" title="Attach files" aria-label="Attach files" data-tour-target="chat.attach">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input id="astral-attach-input" type="file" multiple class="astral-file-upload hidden" accept="%%ASTRAL_ACCEPT%%" aria-hidden="true" tabindex="-1">
            <!-- Background-run toggle (055 cross-device continuity): arms
                 async_mode for the NEXT send only; client.js disarms it after
                 the message goes out. -->
            <button type="button" id="astral-bg-btn" class="astral-attach-btn shrink-0" aria-pressed="false"
                    title="Run in background - keep using other chats; you will be notified when it finishes."
                    aria-label="Run in background">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </button>
            <!-- Feature 065 host + 066 default: the voice affordance is ALWAYS
                 present. This pre-rendered start control is the client-local
                 default (disabled, honest reason) until the authoritative
                 composer_state frame replaces the host's children. -->
            <div id="astral-voice-controls" class="astral-voice-controls shrink-0" role="group"
                 aria-label="Voice conversation controls"><button type="button" class="astral-voice-control" data-voice-key="voice-start" data-voice-action="voice_session_start" data-icon="microphone" data-default="1" disabled aria-pressed="false" aria-busy="false" aria-label="Start voice conversation" title="Checking voice availability…"><span class="astral-sr-only">Start voice conversation</span></button></div>
            <input id="astral-input" type="text" autocomplete="off" placeholder="Message an agent…" data-tour-target="chat.input"
                   class="astral-field flex-1 min-w-0 rounded-lg bg-white/5 border border-white/10 px-3 py-2 text-sm text-astral-text">
            <!-- 066: transcript toggle for the collapsed (floating-composer)
                 mode — unread badge; hidden on split/stacked by astral.css. -->
            <button type="button" id="astral-chat-toggle" class="astral-attach-btn astral-chat-toggle shrink-0"
                    aria-expanded="false" aria-controls="astral-chat" title="Show conversation" aria-label="Show conversation">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span id="astral-chat-unread" class="astral-chat-unread" hidden>0</span>
            </button>
            <button type="submit" class="astral-btn astral-btn-primary shrink-0 px-4 py-2 rounded-lg text-sm font-medium bg-astral-primary text-white">Send</button>
          </div>
          <!-- Local adapter feedback remains textual and live so permission,
               device, autoplay, and server states never rely on color alone.
               Typed chat above remains available under every voice failure. -->
          <div id="astral-voice-feedback" class="astral-voice-feedback" hidden data-state="off" data-reason="ready">
            <div class="astral-voice-state-line">
              <span class="astral-voice-state-label" aria-hidden="true"></span>
              <span id="astral-voice-status" role="status" aria-live="polite" aria-atomic="true"></span>
            </div>
            <div id="astral-voice-transcript" class="astral-voice-transcript" aria-live="polite" aria-atomic="true"></div>
            <button id="astral-voice-audio-resume" class="astral-voice-audio-resume" type="button" hidden>
              Enable voice audio
            </button>
          </div>
          <div id="astral-voice-turn-notice" class="astral-voice-turn-notice" role="alert"
               aria-live="assertive" aria-atomic="true" hidden>
            <span class="astral-voice-turn-notice-icon" aria-hidden="true">!</span>
            <div class="astral-voice-turn-notice-copy">
              <strong id="astral-voice-turn-notice-title" class="astral-voice-turn-notice-title"></strong>
              <span id="astral-voice-turn-notice-message" class="astral-voice-turn-notice-message" hidden></span>
              <span id="astral-voice-turn-notice-guidance" class="astral-voice-turn-notice-fallback">Typed chat remains available.</span>
            </div>
          </div>
          <div id="astral-voice-audio" hidden aria-hidden="true"></div>
        </form>
      </aside>
    </main>
  </div>
  <!-- Chrome modal root (settings surfaces render here via chrome_render) -->
  <div id="astral-modal"></div>
  <!-- The LiveKit SDK is NOT loaded here: client.js injects it on first voice
       need and idle-prefetches it after boot (same pattern as Plotly), so a
       page load that never touches voice never pays for the bundle. Its
       same-origin, hash-pinned URL arrives via __ASTRAL_LIVEKIT_URL__ above. -->
  <script src="/static/client.js?v=%%ASTRAL_V:client.js%%"></script>
</body>
</html>
