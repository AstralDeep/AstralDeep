[capability]
id = "astral.cad-kernel"
version = "1.2.0"
kind = "kernel"
description = "Builds 3D models with build123d and returns STEP, STL and GLB files."

[permissions]
scopes = ["tools:execute"]
output_files = ["step", "stl", "3mf", "glb"]
network = "none"
phi = "none"

[limits]
tool_timeout_seconds = 120

[[tools]]
name = "cad"
script = "tools/cad_run.py"
scope = "tools:execute"

[runtime]
python = "3.11"
wheels = ["build123d==0.13.0"]
