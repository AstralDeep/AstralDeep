port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50099
  use_external_ip: false
  advertise_internal_ip: false
  enable_loopback_candidate: true
  allow_tcp_fallback: true
  data_channel_max_buffered_amount: 1048576

room:
  auto_create: false
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 16
  enabled_codecs:
    - mime: audio/opus

turn:
  # Local Docker Desktop uses the explicit host ICE candidate above. Enabling
  # embedded TURN would require permission to relay to a private host address,
  # which would turn the dev service into an authenticated RFC1918 pivot.
  enabled: false

logging:
  # LiveKit v1.13.5 info records include participant-init SDP and ephemeral
  # ICE credentials. Keep vendor logs above that boundary; AstralDeep owns
  # content-free session/readiness metrics separately.
  level: warn
  pion_level: error
  json: true

enable_data_tracks: true
