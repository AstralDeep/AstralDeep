# The deployment runtime is Python 3.11 (Dockerfile base image). Pinning
# ruff's target rejects 3.12+-only syntax — e.g. backslash escapes inside
# f-string expressions (PEP 701) — that newer local interpreters accept but
# the container cannot import.
target-version = "py311"

# The component directories are independently owned submodules with their own
# verification gates.  AstralDeep's repo-root lint must cover Deep-owned code,
# not re-lint pinned component internals under the parent's policy.
exclude = [
  ".venv",
  "node_modules",
  "backend/tmp",
  "backend/data",
  "components",
]
