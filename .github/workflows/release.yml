# Publishes a release when a version tag (v0.1.0) is pushed: the vessel and egress images to GitHub's container
# registry for amd64 and arm64, then the package to PyPI, whose `astralvessel deploy` pulls those same images.
# PyPI accepts the upload through trusted publishing, so the repository holds no PyPI token. Running it by hand
# (workflow_dispatch) is a dry run: it builds both images for both architectures and the package, and pushes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Plain X.Y.Z only, so the image tag, the PyPI version and what deploy pulls are the same string.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version $version is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  kernel-binding:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
            provider_artifact_id: 14148388081
            provider_artifact_digest: cb63ecb273533802da948cc02bd4fddeab23ed25f0887c4000ffec2f9618a919
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
            provider_artifact_id: 14148318283
            provider_artifact_digest: f86f6ab7c166a1e15bc08cf9e5b56564af599fa4057877025d8fc94969f987ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Restore the exact qualified Kernel provider artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          PROVIDER_ARTIFACT_ID: ${{ matrix.provider_artifact_id }}
          PROVIDER_ARTIFACT_DIGEST: ${{ matrix.provider_artifact_digest }}
        run: |
          python scripts/build_kernel_binding.py fetch \
            --run-id 43680163653 --artifact-id "$PROVIDER_ARTIFACT_ID" \
            --expected-digest "$PROVIDER_ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/kernel-artifacts" --platform "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: kernel-artifacts-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/kernel-artifacts
          if-no-files-found: error
          retention-days: 14

  images:
    needs: [check, kernel-binding]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: astralvessel
            context: .
          - name: astralvessel-egress
            context: egress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kernel-artifacts-linux-amd64
          path: ${{ runner.temp }}/kernel-artifact-inputs/linux-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kernel-artifacts-linux-arm64
          path: ${{ runner.temp }}/kernel-artifact-inputs/linux-arm64
      - name: Assemble the two source-bound payloads as the named build context
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-artifacts"
          for arch in linux-amd64 linux-arm64; do
            find "$RUNNER_TEMP/kernel-artifact-inputs/$arch" -maxdepth 1 -type f \
              \( -name 'astral_kernel-*.whl' -o -name 'astral-mailbox-*' \) -exec cp {} "$RUNNER_TEMP/kernel-artifacts/" \;
            cp "$RUNNER_TEMP/kernel-artifact-inputs/$arch/provider-receipt.json" "$RUNNER_TEMP/kernel-artifacts/$arch-provider-receipt.json"
            cp "$RUNNER_TEMP/kernel-artifact-inputs/$arch/linux-build-manifest.json" "$RUNNER_TEMP/kernel-artifacts/$arch-build-manifest.json"
          done
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-contexts: kernel-artifacts=${{ runner.temp }}/kernel-artifacts
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/astraldeep/${{ matrix.name }}:${{ needs.check.outputs.version }}
            ghcr.io/astraldeep/${{ matrix.name }}:latest

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build==1.3.0 twine==7.0.0 && python -m build && twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: [check, images, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: The released images must be pullable without signing in
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for name in astralvessel astralvessel-egress; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:astraldeep/$name:pull" | jq -r .token)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/astraldeep/$name/manifests/$VERSION" \
              || { echo "ghcr.io/astraldeep/$name is not public; make the package public, then re-run this job"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
