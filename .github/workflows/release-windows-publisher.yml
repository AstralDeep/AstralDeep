          from datetime import datetime, timedelta, timezone

          raw = os.environ["DECISION_VALID_UNTIL"]
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", raw) is None:
              raise SystemExit("trusted decision expiry is malformed")
          seconds = int(os.environ["MINIMUM_DECISION_REMAINING_SECONDS"])
          if seconds != 900:
              raise SystemExit("minimum decision lifetime margin changed")
          valid_until = datetime.strptime(raw, "%Y-%m-%dT%H:%M:%SZ").replace(
              tzinfo=timezone.utc
          )
          if valid_until <= datetime.now(timezone.utc) + timedelta(seconds=seconds):
              raise SystemExit("trusted decision expires too soon to dispatch bridge signing")
