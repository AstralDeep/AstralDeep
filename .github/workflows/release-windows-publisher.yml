            > "$ARTIFACTS_RESPONSE"
          set +o noclobber
          export RUN_RESPONSE ARTIFACTS_RESPONSE BRIDGE_RUN_ID
          read -r BRIDGE_RUN_ATTEMPT BRIDGE_ARTIFACT_ID <<< "$(python3 -I - <<'PY'
          import json, os, pathlib, re

          def document(variable, limit):
              path = pathlib.Path(os.environ[variable])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"{variable} is not one regular file")
              data = path.read_bytes()
              if not 0 < len(data) <= limit:
                  raise SystemExit(f"{variable} exceeds its API response bound")
              return json.loads(data)

          run = document("RUN_RESPONSE", 2 * 1024 * 1024)
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["BRIDGE_RUN_ID"]
          if (
              str(run.get("id")) != run_id
              or run.get("name") != "Release Windows client"
              or run.get("path") != ".github/workflows/release-windows.yml"
              or run.get("event") != "workflow_dispatch"
              or run.get("head_branch") != os.environ["TAG"]
              or run.get("head_sha") != os.environ["CANDIDATE_SHA"]
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("head_repository", {}).get("full_name") != repo
          ):
              raise SystemExit("bridge run is not the exact successful tag workflow")
          attempt = run.get("run_attempt")
          if isinstance(attempt, bool) or not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("bridge workflow run attempt is invalid")
          listing = document("ARTIFACTS_RESPONSE", 4 * 1024 * 1024)
          artifacts = listing.get("artifacts")
          if not isinstance(artifacts, list) or listing.get("total_count") != len(artifacts):
              raise SystemExit("bridge artifact listing is incomplete or malformed")
          expected_name = f"windows-bridge-signing-{run_id}-{attempt}"
          matches = [artifact for artifact in artifacts if artifact.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("bridge run must expose one exact signing artifact")
          artifact = matches[0]
          artifact_id = str(artifact.get("id", ""))
          size = artifact.get("size_in_bytes")
          if (
              re.fullmatch(r"[1-9][0-9]*", artifact_id) is None
              or artifact.get("expired") is not False
              or isinstance(size, bool)
              or not isinstance(size, int)
              or not 0 < size <= 512 * 1024 * 1024
              or str(artifact.get("workflow_run", {}).get("id")) != run_id
          ):
              raise SystemExit("bridge signing artifact metadata is not exact")
          print(attempt, artifact_id)
          PY
          )"
          export BRIDGE_RUN_ATTEMPT BRIDGE_ARTIFACT_ID
