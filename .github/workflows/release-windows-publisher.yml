              "draft_executable": asset("AstralDeep.exe", "windows_exe", "ASSET_ID_ASTRALDEEP_EXE"),
              "draft_checksum_manifest": asset("SHA256SUMS", "checksum_manifest", "ASSET_ID_SHA256SUMS"),
              "draft_signature_bundle": asset("cosign.bundle", "sigstore_bundle", "ASSET_ID_COSIGN_BUNDLE"),
              "draft_release": {
                  "repository": repo,
                  "tag": tag,
                  "release_name": tag,
                  "latest_disposition": "make_latest_on_publish",
                  "draft_state": True,
                  "prerelease": False,
                  "asset_count": 3,
                  "tag_preexisting": False,
                  "release_preexisting": False,
                  "assets_replaced": False,
                  "release_database_id": int(env["RELEASE_DB_ID"]),
                  "executable_asset_database_id": int(env["ASSET_ID_ASTRALDEEP_EXE"]),
                  "executable_asset_name": "AstralDeep.exe",
                  "checksum_asset_database_id": int(env["ASSET_ID_SHA256SUMS"]),
                  "checksum_asset_name": "SHA256SUMS",
                  "signature_bundle_asset_database_id": int(env["ASSET_ID_COSIGN_BUNDLE"]),
                  "signature_bundle_asset_name": "cosign.bundle",
                  "target_commit_sha": env["CANDIDATE_SHA"],
                  "draft_verified_at": now,
              },
              "generated_at": now,
              "signing": {
                  "signature_mode": "detached_sigstore_bundle",
                  "signer_identity": (
                      f"https://github.com/{repo}/.github/workflows/"
                      f"release-windows.yml@refs/tags/{tag}"
                  ),
                  "oidc_issuer": "https://token.actions.githubusercontent.com",
                  "signature_verifier": "astraldeep-v0.3.0-sigstore-identity-policy",
                  "bridge_workflow_sha256": env["BRIDGE_WORKFLOW_SHA256"],
                  "legacy_v0_3_0_verifier_outcome": "passed",
                  "verification_outcome": "passed",
                  "executable_bytes_modified": False,
                  "rebuild_performed": False,
              },
          }
          validator.validate_document(document, schema)
          out = pathlib.Path("build/060/windows-draft-provenance")
          out.mkdir(parents=True, exist_ok=True)
          out.joinpath("windows-draft-verification-provenance.json").write_text(
              json.dumps(document, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          summary = pathlib.Path(env["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## windows_draft_verification_provenance\n")
              handle.write(f"- tag: `{tag}` (draft only; proves draft readiness)\n")
              handle.write(f"- executable sha256: `{env['EXE_SHA256']}`\n")
              handle.write(f"- publication_id: `{document['publication_id']}`\n")
          PY
      - name: Upload the draft provenance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-draft-provenance
          path: build/060/windows-draft-provenance/
          if-no-files-found: error
          retention-days: 90
      # OFFICIAL MODE ONLY: flip draft to published + latest, then confirm the
      # shipped updater would actually select this release from the live
      # /releases/latest shape; a mismatch deletes ONLY the just-created
      # release and tag and fails the job.
      - name: Publish and confirm updater selection (official mode)
        if: ${{ inputs.mode == 'official' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os, re
          from datetime import datetime, timezone

          raw = os.environ["DECISION_VALID_UNTIL"]
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", raw) is None:
              raise SystemExit("trusted decision expiry is malformed")
          valid_until = datetime.strptime(raw, "%Y-%m-%dT%H:%M:%SZ").replace(
              tzinfo=timezone.utc
          )
          if valid_until <= datetime.now(timezone.utc):
              raise SystemExit("trusted decision expired before official publication mutation")
          PY
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_DB_ID" \
            -F draft=false -f make_latest=true > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > build/060/latest.json
          python3 -I - <<'PY'
          import importlib.util, json, os, pathlib, sys

          spec = importlib.util.spec_from_file_location(
              "astral_client_integrity",
              "protected-policy/windows-client/astral_client/integrity.py",
          )
          integrity = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = integrity
          spec.loader.exec_module(integrity)

          latest = json.loads(pathlib.Path("build/060/latest.json").read_text(encoding="utf-8"))
          integrity._api_get = lambda *args, **kwargs: latest
          assets = integrity.latest_release()
          if assets is None or assets.tag != os.environ["TAG"]:
              raise SystemExit(
                  f"shipped updater selected {getattr(assets, 'tag', None)!r}, "
                  f"expected {os.environ['TAG']!r}"
              )
          if assets.release_id != int(os.environ["RELEASE_DB_ID"]):
              raise SystemExit("shipped updater resolved a different release id")
          print(f"shipped v0.3.0 updater parser selects {assets.tag}")
          PY
      # Disposable mode NEVER publishes: the draft and tag are force-cleaned at
      # the end regardless of outcome. Official mode cleans up only when a
      # step failed, deleting ONLY the release and tag this run created.
      - name: Force-clean the just-created draft and tag
        if: ${{ always() && (inputs.mode == 'disposable' || failure() || cancelled()) }}
        shell: bash
        run: |
          set -euo pipefail
          STATE_PATH="build/060/publish-state.json"
          if [[ ! -e "$STATE_PATH" && ! -L "$STATE_PATH" ]]; then
            echo "No state-owned release or tag was recorded; nothing is safe to delete."
            exit 0
          fi
          [[ ! -L "$STATE_PATH" && -f "$STATE_PATH" ]] || {
            echo "::error::publisher cleanup state is not one regular file" >&2
            exit 1
          }
          mapfile -t STATE_FIELDS < <(python3 -I - <<'PY'
          import json, os, pathlib, re

          path = pathlib.Path("build/060/publish-state.json")
          data = path.read_bytes()
          if not 0 < len(data) <= 64 * 1024:
              raise SystemExit("publisher cleanup state exceeds its byte bound")
          state = json.loads(data)
          tag = state.get("tag", "")
          candidate = state.get("candidate_sha", "")
          release_id = state.get("release_db_id", "")
          if (
              state.get("tag_created") is not True
              or re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag) is None
              or re.fullmatch(r"[0-9a-f]{40}", candidate) is None
              or (
                  release_id != ""
                  and (
                      isinstance(release_id, bool)
                      or not isinstance(release_id, int)
                      or release_id < 1
                  )
              )
          ):
              raise SystemExit("publisher cleanup state is malformed")
          if tag != os.environ.get("TAG") or candidate != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("publisher cleanup state is not bound to this job")
          print(tag)
          print(candidate)
          print(release_id)
          PY
          )
          STATE_TAG="${STATE_FIELDS[0]}"
          STATE_CANDIDATE_SHA="${STATE_FIELDS[1]}"
          STATE_RELEASE_DB_ID="${STATE_FIELDS[2]}"
          if [[ -n "${RELEASE_DB_ID:-}" ]]; then
            [[ "$RELEASE_DB_ID" =~ ^[1-9][0-9]*$ ]]
            if [[ -n "$STATE_RELEASE_DB_ID" && "$STATE_RELEASE_DB_ID" != "$RELEASE_DB_ID" ]]; then
              echo "::error::publisher cleanup release id disagrees with protected state" >&2
              exit 1
            fi
            STATE_RELEASE_DB_ID="$RELEASE_DB_ID"
          fi

          CLEANUP_PREFIX="$RUNNER_TEMP/publisher-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          TAG_RESPONSE="$CLEANUP_PREFIX-tag.json"
          RELEASE_RESPONSE="$CLEANUP_PREFIX-release.json"
          for path in "$TAG_RESPONSE" "$RELEASE_RESPONSE"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::refusing pre-existing publisher cleanup response path: $path" >&2
              exit 1
            fi
          done
          api_get_status() {
            local endpoint="$1"
            local output="$2"
            curl --silent --show-error \
              --output "$output" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/$endpoint"
          }

          TAG_STATUS="$(api_get_status \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$STATE_TAG" "$TAG_RESPONSE")"
          case "$TAG_STATUS" in
            200)
              export TAG_RESPONSE STATE_CANDIDATE_SHA
              python3 -I - <<'PY'
          import json, os, pathlib

          response = json.loads(pathlib.Path(os.environ["TAG_RESPONSE"]).read_text())
          obj = response.get("object", {})
          if obj.get("type") != "commit" or obj.get("sha") != os.environ["STATE_CANDIDATE_SHA"]:
              raise SystemExit("state-owned tag moved; cleanup refuses to delete it")
          PY
              ;;
            404) ;;
            *)
              echo "::error::cannot prove the state-owned tag before cleanup (HTTP $TAG_STATUS)" >&2
              exit 1
              ;;
          esac

          if [[ -n "$STATE_RELEASE_DB_ID" ]]; then
            RELEASE_STATUS="$(api_get_status \
              "repos/$GITHUB_REPOSITORY/releases/$STATE_RELEASE_DB_ID" "$RELEASE_RESPONSE")"
            case "$RELEASE_STATUS" in
              200)
                export RELEASE_RESPONSE STATE_RELEASE_DB_ID STATE_TAG
                python3 -I - <<'PY'
          import json, os, pathlib

          release = json.loads(pathlib.Path(os.environ["RELEASE_RESPONSE"]).read_text())
          if (
              str(release.get("id")) != os.environ["STATE_RELEASE_DB_ID"]
              or release.get("tag_name") != os.environ["STATE_TAG"]
          ):
              raise SystemExit("state-owned release identity changed; cleanup refuses deletion")
          PY
                gh api -X DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/$STATE_RELEASE_DB_ID"
                RELEASE_STATUS="$(api_get_status \
                  "repos/$GITHUB_REPOSITORY/releases/$STATE_RELEASE_DB_ID" "$RELEASE_RESPONSE")"
                test "$RELEASE_STATUS" = "404" || {
                  echo "::error::state-owned release still resolves after deletion (HTTP $RELEASE_STATUS)" >&2
                  exit 1
                }
                ;;
              404) ;;
              *)
                echo "::error::cannot prove the state-owned release before cleanup (HTTP $RELEASE_STATUS)" >&2
                exit 1
                ;;
            esac
          fi

          if [[ "$TAG_STATUS" = "200" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$STATE_TAG"
            TAG_STATUS="$(api_get_status \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$STATE_TAG" "$TAG_RESPONSE")"
            test "$TAG_STATUS" = "404" || {
              echo "::error::state-owned tag still resolves after deletion (HTTP $TAG_STATUS)" >&2
              exit 1
            }
          fi
