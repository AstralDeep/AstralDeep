            -f "inputs[tag]=$TAG" \
            -f "inputs[readiness_run_id]=$READINESS_RUN_ID" \
            -f "inputs[decision_artifact_id]=$DECISION_ARTIFACT_ID" \
            > "$DISPATCH_RESPONSE"
          set +o noclobber
          export DISPATCH_RESPONSE
          BRIDGE_RUN_ID="$(python3 -I - <<'PY'
          import json, os, pathlib, re

          path = pathlib.Path(os.environ["DISPATCH_RESPONSE"])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("bridge dispatch response is not one regular file")
          data = path.read_bytes()
          if not 0 < len(data) <= 1024 * 1024:
              raise SystemExit("bridge dispatch response exceeds its byte bound")
