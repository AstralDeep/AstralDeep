          PROTECTED_BRIDGE_WORKFLOW_SHA256="$(sha256sum protected-policy/.github/workflows/release-windows.yml | cut -d ' ' -f 1)"
          [[ "$RELEASE_BRIDGE_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
