# Spec 060 (T119) — the environment-approved protected publisher: the ONLY
# write authority in the Windows release path, using ONLY the built-in
# short-lived GITHUB_TOKEN (no GitHub App, installation token, or custom token
# broker). It trusts no controller state: the trusted decision is re-verified
# in-job, the tag is created create-only at the decision SHA, the detached
# signature comes exclusively from the byte-pinned bridge run artifact, and
# exactly three assets reach a DRAFT release that is published (official mode
# only) after the shipped v0.3.0 updater policy re-validates everything.
name: release-windows-publisher

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Decision-bound candidate commit to publish
        required: true
        type: string
      release_version:
        description: Strict SemVer release version (no leading v)
        required: true
        type: string
      mode:
        description: disposable rehearses draft-only; official publishes
        required: true
        type: string
      readiness_run_id:
        description: Run id whose protected-decision produced the trusted decision
        required: true
        type: string
      decision_artifact_id:
        description: Exact artifact id of the verified trusted decision
        required: true
        type: string
      requester:
        description: Login that requested publication via the controller
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: release-windows-publisher
      cancel-in-progress: false
    environment: release-publisher
    permissions:
      contents: write
      actions: write
      attestations: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      PUBLISH_MODE: ${{ inputs.mode }}
      READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
      DECISION_ARTIFACT_ID: ${{ inputs.decision_artifact_id }}
      REQUESTER_LOGIN: ${{ inputs.requester }}
      RELEASE_BRIDGE_WORKFLOW_SHA256: ${{ vars.RELEASE_BRIDGE_WORKFLOW_SHA256 }}
      RELEASE_TRUSTED_BUILDER_SHA: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
      MINIMUM_DECISION_REMAINING_SECONDS: "900"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the owner-pinned publisher policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
          path: protected-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Create a clean protected publisher output root
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLISH_MODE" == "disposable" || "$PUBLISH_MODE" == "official" ]] || {
            echo "::error::publisher mode must be exactly disposable or official" >&2
            exit 1
          }
          [[ "$REQUESTER_LOGIN" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]] || {
            echo "::error::publisher requester login is malformed" >&2
            exit 1
          }
          test "$(git -C candidate-source rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C protected-policy rev-parse HEAD)" = "$RELEASE_TRUSTED_BUILDER_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$RELEASE_TRUSTED_BUILDER_SHA" || {
            echo "::error::publisher caller is not executing at the installed protected commit" >&2
            exit 1
          }
          CANDIDATE_BRIDGE_SHA256="$(git -C candidate-source show "$CANDIDATE_SHA:.github/workflows/release-windows.yml" | sha256sum | cut -d ' ' -f 1)"
          PROTECTED_BRIDGE_SHA256="$(sha256sum protected-policy/.github/workflows/release-windows.yml | cut -d ' ' -f 1)"
          [[ "$RELEASE_BRIDGE_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CANDIDATE_BRIDGE_SHA256" = "$PROTECTED_BRIDGE_SHA256" || {
            echo "::error::candidate bridge bytes differ from the owner-pinned publisher policy" >&2
            exit 1
          }
          test "$CANDIDATE_BRIDGE_SHA256" = "$RELEASE_BRIDGE_WORKFLOW_SHA256" || {
            echo "::error::bridge bytes differ from the installed protected digest" >&2
            exit 1
          }
          if [[ -e build || -L build ]]; then
            echo "::error::candidate checkout contains the protected publisher output root" >&2
            exit 1
          fi
          install -d -m 0700 build build/060 build/060/bridge build/060/redownload
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # Defense in depth: the publisher re-downloads and re-verifies the exact
      # decision itself; controller conclusions are never trusted.
      - name: Re-download and re-verify the trusted decision by exact id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/060/bridge build/060/redownload
          [[ "$RELEASE_TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$READINESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DECISION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          PREFIX="$RUNNER_TEMP/trusted-decision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          RUN_RESPONSE="$PREFIX-run.json"
          ARTIFACT_RESPONSE="$PREFIX-artifact.json"
          DECISION_EXTRACTOR="$PREFIX-extractor.py"
          DECISION_ARCHIVE="$PREFIX.zip"
          DECISION_TARGET="$PREFIX-output"
          for path in "$RUN_RESPONSE" "$ARTIFACT_RESPONSE" "$DECISION_EXTRACTOR" \
              "$DECISION_ARCHIVE" "$DECISION_TARGET"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::refusing pre-existing or symlinked decision path: $path" >&2
              exit 1
            fi
          done
          umask 077
          set -o noclobber
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID" > "$RUN_RESPONSE"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DECISION_ARTIFACT_ID" \
            > "$ARTIFACT_RESPONSE"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/scripts/extract_release_artifact.py?ref=$RELEASE_TRUSTED_BUILDER_SHA" \
            > "$DECISION_EXTRACTOR"
          set +o noclobber
          export RUN_RESPONSE ARTIFACT_RESPONSE DECISION_EXTRACTOR
          READINESS_RUN_ATTEMPT="$(python3 -I - <<'PY'
          import json, os, pathlib, re

          def document(variable, limit):
              path = pathlib.Path(os.environ[variable])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"{variable} is not a new regular file")
              data = path.read_bytes()
              if not 0 < len(data) <= limit:
                  raise SystemExit(f"{variable} exceeds its API response bound")
              return json.loads(data)

          run = document("RUN_RESPONSE", 2 * 1024 * 1024)
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["READINESS_RUN_ID"]
          if (
              str(run.get("id")) != run_id
              or run.get("name") != "release-readiness-protected"
              or run.get("path") != ".github/workflows/release-readiness-protected.yml"
              or run.get("event") != "workflow_run"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("head_sha") != os.environ["RELEASE_TRUSTED_BUILDER_SHA"]
              or run.get("head_repository", {}).get("full_name") != repo
          ):
              raise SystemExit("readiness run is not the exact successful protected workflow")
          attempt = run.get("run_attempt")
          if isinstance(attempt, bool) or not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("readiness run attempt is invalid")
          artifact = document("ARTIFACT_RESPONSE", 2 * 1024 * 1024)
          artifact_id = str(artifact.get("id", ""))
          size = artifact.get("size_in_bytes")
          if (
              artifact_id != os.environ["DECISION_ARTIFACT_ID"]
              or not re.fullmatch(r"[1-9][0-9]*", artifact_id)
              or artifact.get("name") != "trusted-release-decision"
              or artifact.get("expired") is not False
              or isinstance(size, bool)
              or not isinstance(size, int)
              or not 0 < size <= 4 * 1024 * 1024
              or str(artifact.get("workflow_run", {}).get("id")) != run_id
          ):
              raise SystemExit("trusted decision artifact id is not bound to the readiness run")
          extractor = pathlib.Path(os.environ["DECISION_EXTRACTOR"])
          if extractor.is_symlink() or not extractor.is_file():
              raise SystemExit("protected extractor is not a regular file")
          if not 0 < extractor.stat().st_size <= 256 * 1024:
              raise SystemExit("protected extractor API response exceeds its byte bound")
          print(attempt)
          PY
          )"
          export READINESS_RUN_ATTEMPT
          set -o noclobber
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DECISION_ARTIFACT_ID/zip" \
            > "$DECISION_ARCHIVE"
          set +o noclobber
          [[ ! -L "$DECISION_ARCHIVE" && -f "$DECISION_ARCHIVE" ]]
          ARCHIVE_BYTES="$(wc -c < "$DECISION_ARCHIVE")"
          (( ARCHIVE_BYTES > 0 && ARCHIVE_BYTES <= 4 * 1024 * 1024 ))
          chmod 0500 "$DECISION_EXTRACTOR"
          python3 -I "$DECISION_EXTRACTOR" \
            --archive "$DECISION_ARCHIVE" \
            --target "$DECISION_TARGET" \
            --expected-member trusted-release-decision.json
          DECISION_PATH="$DECISION_TARGET/trusted-release-decision.json"
          [[ ! -L "$DECISION_PATH" && -f "$DECISION_PATH" ]]
          gh attestation verify "$DECISION_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-readiness.yml" \
            --signer-digest "$RELEASE_TRUSTED_BUILDER_SHA"
          export DECISION_PATH
          printf 'DECISION_PATH=%s\nREADINESS_RUN_ATTEMPT=%s\nRELEASE_ARTIFACT_EXTRACTOR=%s\n' \
            "$DECISION_PATH" "$READINESS_RUN_ATTEMPT" "$DECISION_EXTRACTOR" \
            >> "$GITHUB_ENV"
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, re
          from datetime import datetime, timezone

          decision_path = pathlib.Path(os.environ["DECISION_PATH"])
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          if decision["candidate_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("decision candidate SHA differs from the requested candidate")
          workflow = decision.get("workflow", {})
          expected_ref = (
              f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/"
              f"release-readiness.yml@{os.environ['RELEASE_TRUSTED_BUILDER_SHA']}"
          )
          if (
              str(workflow.get("run_id")) != os.environ["READINESS_RUN_ID"]
              or str(workflow.get("run_attempt")) != os.environ["READINESS_RUN_ATTEMPT"]
              or workflow.get("job_id") != "protected-decision"
              or decision.get("workflow_ref") != expected_ref
          ):
              raise SystemExit("decision workflow identity differs from the selected readiness run")
          if decision["decision"] != "passed":
              raise SystemExit("trusted decision did not pass")
          if decision["required_check_name"] != "release-readiness / protected-decision":
              raise SystemExit("decision carries the wrong required check name")
          valid_until = datetime.fromisoformat(decision["valid_until"].replace("Z", "+00:00"))
          if valid_until <= datetime.now(timezone.utc):
              raise SystemExit("trusted decision expired (valid_until elapsed)")
          if not re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              os.environ["RELEASE_VERSION"],
          ):
              raise SystemExit("release_version must be strict SemVer without a leading v")
          member = decision["evidence_set_artifact"]
          lines = [
              f"DECISION_SHA256={hashlib.sha256(decision_path.read_bytes()).hexdigest()}",
              f"EVIDENCE_ARTIFACT_ID={member['artifact_id']}",
              f"EVIDENCE_MEMBER={member['member']}",
              f"DECISION_RUN_ID={decision['workflow']['run_id']}",
              f"DECISION_RUN_ATTEMPT={decision['workflow']['run_attempt']}",
              f"DECISION_VALID_UNTIL={decision['valid_until']}",
              f"RELEASE_ID={decision['release_id']}",
              f"EVIDENCE_SET_ID={decision['readiness_evidence_set_id']}",
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      # The publisher never installs dependency selections from the candidate
      # checkout. The exact owner-pinned lock supplies the shipped verifier.
      - name: Install the owner-pinned hash-locked client verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protected-policy rev-parse HEAD)" = "$RELEASE_TRUSTED_BUILDER_SHA"
          PROTECTED_LOCK="$RUNNER_TEMP/windows-release-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.lock.txt"
          if [[ -e "$PROTECTED_LOCK" || -L "$PROTECTED_LOCK" ]]; then
            echo "::error::refusing a pre-existing protected verifier lock path" >&2
            exit 1
          fi
          umask 077
          set -o noclobber
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/windows-client/requirements-release.lock.txt?ref=$RELEASE_TRUSTED_BUILDER_SHA" \
            > "$PROTECTED_LOCK"
          set +o noclobber
          [[ ! -L "$PROTECTED_LOCK" && -f "$PROTECTED_LOCK" ]]
          PROTECTED_LOCK_BYTES="$(wc -c < "$PROTECTED_LOCK")"
          (( PROTECTED_LOCK_BYTES > 0 && PROTECTED_LOCK_BYTES <= 2 * 1024 * 1024 ))
          cmp -- "$PROTECTED_LOCK" protected-policy/windows-client/requirements-release.lock.txt
          python -I -m pip install --require-hashes -r "$PROTECTED_LOCK"
      - name: Resolve the matrix-tested executable digest from the evidence set
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$READINESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$READINESS_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ ! -L "$RELEASE_ARTIFACT_EXTRACTOR" && -f "$RELEASE_ARTIFACT_EXTRACTOR" ]]
          PREFIX="$RUNNER_TEMP/trusted-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          ARTIFACT_RESPONSE="$PREFIX-artifact.json"
          EVIDENCE_ARCHIVE="$PREFIX.zip"
          EVIDENCE_TARGET="$PREFIX-output"
          for path in "$ARTIFACT_RESPONSE" "$EVIDENCE_ARCHIVE" "$EVIDENCE_TARGET"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::refusing pre-existing or symlinked evidence path: $path" >&2
              exit 1
            fi
          done
          umask 077
          set -o noclobber
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT_ID" \
            > "$ARTIFACT_RESPONSE"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT_ID/zip" \
            > "$EVIDENCE_ARCHIVE"
          set +o noclobber
          [[ ! -L "$EVIDENCE_ARCHIVE" && -f "$EVIDENCE_ARCHIVE" ]]
          ARCHIVE_BYTES="$(wc -c < "$EVIDENCE_ARCHIVE")"
          (( ARCHIVE_BYTES > 0 && ARCHIVE_BYTES <= 512 * 1024 * 1024 ))
          export ARTIFACT_RESPONSE
          EVIDENCE_SHA256="$(python3 -I - <<'PY'
          import json, os, pathlib, re

          def document(path, limit):
              candidate = pathlib.Path(path)
              if candidate.is_symlink() or not candidate.is_file():
                  raise SystemExit("artifact API response is not one regular file")
              data = candidate.read_bytes()
              if not 0 < len(data) <= limit:
                  raise SystemExit("artifact API response exceeds its byte bound")
              return json.loads(data)

          decision_path = pathlib.Path(os.environ["DECISION_PATH"])
          if decision_path.is_symlink() or not decision_path.is_file():
              raise SystemExit("trusted decision path is not one regular file")
          decision = document(decision_path, 4 * 1024 * 1024)
          member = decision.get("evidence_set_artifact")
          if not isinstance(member, dict):
              raise SystemExit("trusted decision lacks its evidence-set artifact member")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["READINESS_RUN_ID"]
          run_attempt = int(os.environ["READINESS_RUN_ATTEMPT"])
          artifact_id = os.environ["EVIDENCE_ARTIFACT_ID"]
          expected_reference = (
              f"gh://{repo}/runs/{run_id}/attempts/{run_attempt}"
              f"/artifacts/{artifact_id}/members/release-evidence-set.json"
          )
          digest = member.get("sha256")
          if (
              member.get("kind") != "github_actions_artifact_member"
              or member.get("repository") != repo
              or str(member.get("run_id")) != run_id
              or member.get("run_attempt") != run_attempt
              or str(member.get("artifact_id")) != artifact_id
              or member.get("artifact_name") != "release-evidence"
              or member.get("member") != "release-evidence-set.json"
              or member.get("immutable_reference") != expected_reference
              or not isinstance(digest, str)
              or re.fullmatch(r"[0-9a-f]{64}", digest) is None
          ):
              raise SystemExit("signed evidence-set artifact member is not exact")

          artifact = document(os.environ["ARTIFACT_RESPONSE"], 2 * 1024 * 1024)
          size = artifact.get("size_in_bytes")
          workflow_run = artifact.get("workflow_run")
          if (
              str(artifact.get("id")) != artifact_id
              or artifact.get("name") != "release-evidence"
              or artifact.get("expired") is not False
              or isinstance(size, bool)
              or not isinstance(size, int)
              or not 0 < size <= 512 * 1024 * 1024
              or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id")) != run_id
              or workflow_run.get("head_sha") != os.environ["RELEASE_TRUSTED_BUILDER_SHA"]
          ):
              raise SystemExit("evidence artifact metadata differs from the signed decision")
          print(digest)
          PY
          )"
          [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python3 -I "$RELEASE_ARTIFACT_EXTRACTOR" \
            --archive "$EVIDENCE_ARCHIVE" \
            --target "$EVIDENCE_TARGET"
          EVIDENCE_PATH="$EVIDENCE_TARGET/release-evidence-set.json"
          [[ ! -L "$EVIDENCE_PATH" && -f "$EVIDENCE_PATH" ]]
          ACTUAL_EVIDENCE_SHA256="$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          test "$ACTUAL_EVIDENCE_SHA256" = "$EVIDENCE_SHA256" || {
            echo "::error::downloaded evidence set differs from the signed member digest" >&2
            exit 1
          }
          export EVIDENCE_PATH
          python3 -I - <<'PY'
          import json, os, pathlib, re

          evidence_set = json.loads(
              pathlib.Path(os.environ["EVIDENCE_PATH"]).read_text(encoding="utf-8")
          )
          if evidence_set.get("evidence_set_id") != os.environ["EVIDENCE_SET_ID"]:
              raise SystemExit("downloaded evidence-set id differs from the trusted decision")
          if evidence_set.get("release_id") != os.environ["RELEASE_ID"]:
              raise SystemExit("downloaded evidence release id differs from the trusted decision")
          windows_items = [
              item
              for item in evidence_set.get("evidence", [])
              if isinstance(item, dict) and item.get("platform") == "windows"
          ]
          if len(windows_items) != 1:
              raise SystemExit("trusted evidence set must contain exactly one Windows report")
          windows = windows_items[0]
          artifact = windows.get("artifact")
          if not isinstance(artifact, dict):
              raise SystemExit("Windows report lacks its tested artifact")
          executable_sha256 = artifact.get("sha256")
          immutable_reference = artifact.get("immutable_reference")
          build_identity = artifact.get("build_identity")
          if (
              not isinstance(executable_sha256, str)
              or re.fullmatch(r"[0-9a-f]{64}", executable_sha256) is None
              or not isinstance(immutable_reference, str)
              or "\n" in immutable_reference
              or "\r" in immutable_reference
              or not isinstance(build_identity, str)
              or not build_identity
              or "\n" in build_identity
              or "\r" in build_identity
          ):
              raise SystemExit("Windows tested-artifact identity is malformed")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"EXE_SHA256={executable_sha256}\n")
              handle.write(f"TESTED_REFERENCE={immutable_reference}\n")
              handle.write(f"TESTED_BUILD_IDENTITY={build_identity}\n")
          PY
      - name: Verify the exact non-self-approved publisher environment gate
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/publisher-approval-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          APPROVALS_RESPONSE="$PREFIX-approvals.json"
          CURRENT_RUN_RESPONSE="$PREFIX-run.json"
          DEPLOYMENTS_RESPONSE="$PREFIX-deployments.json"
          for path in "$APPROVALS_RESPONSE" "$CURRENT_RUN_RESPONSE" "$DEPLOYMENTS_RESPONSE"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::refusing pre-existing publisher approval response path: $path" >&2
              exit 1
            fi
          done
          umask 077
          set -o noclobber
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            > "$APPROVALS_RESPONSE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$CURRENT_RUN_RESPONSE"
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=release-publisher&sha=$GITHUB_WORKFLOW_SHA&ref=$GITHUB_REF_NAME&task=deploy&per_page=100" \
            > "$DEPLOYMENTS_RESPONSE"
          set +o noclobber
          export APPROVALS_RESPONSE CURRENT_RUN_RESPONSE DEPLOYMENTS_RESPONSE
          read -r REVIEWER_LOGIN REVIEWER_DATABASE_ID DEPLOYMENT_ID <<< "$(python3 -I - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone

          def document(variable, limit):
              path = pathlib.Path(os.environ[variable])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"{variable} is not one regular file")
              data = path.read_bytes()
              if not 0 < len(data) <= limit:
                  raise SystemExit(f"{variable} exceeds its API response bound")
              return json.loads(data)

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          run = document("CURRENT_RUN_RESPONSE", 2 * 1024 * 1024)
          path = str(run.get("path", "")).split("@", 1)[0]
          if (
              str(run.get("id")) != run_id
              or run.get("name") != "release-windows-publisher-controller"
              or path != ".github/workflows/release-windows-publisher-controller.yml"
              or run.get("event") != "workflow_dispatch"
              or run.get("head_sha") != os.environ["GITHUB_WORKFLOW_SHA"]
              or run.get("head_repository", {}).get("full_name") != repo
              or run.get("run_attempt") != run_attempt
              or run.get("status") not in {"in_progress", "completed"}
          ):
              raise SystemExit("publisher run API identity is not exact")
          started_at = datetime.fromisoformat(
              str(run.get("run_started_at", "")).replace("Z", "+00:00")
          )
          if started_at.tzinfo is None:
              raise SystemExit("publisher run start time lacks a timezone")
          started_at = started_at.astimezone(timezone.utc)

          reviews = document("APPROVALS_RESPONSE", 2 * 1024 * 1024)
          if not isinstance(reviews, list) or len(reviews) > 100:
              raise SystemExit("publisher approval history is malformed or unbounded")
          approved = []
          for review in reviews:
              environments = review.get("environments")
              if not isinstance(environments, list):
                  continue
              names = [item.get("name") for item in environments if isinstance(item, dict)]
              if review.get("state") == "approved" and names == ["release-publisher"]:
                  approved.append(review)
          if len(approved) != 1:
              raise SystemExit("publisher run must have one exact approved environment review")
          user = approved[0].get("user")
          if not isinstance(user, dict):
              raise SystemExit("publisher approval lacks its reviewer identity")
          reviewer = user.get("login")
          reviewer_id = user.get("id")
