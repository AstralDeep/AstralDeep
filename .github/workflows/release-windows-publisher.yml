               "$BRIDGE_STATUS" == "waiting" || "$BRIDGE_STATUS" == "pending" || \
               "$BRIDGE_STATUS" == "requested" || "$BRIDGE_STATUS" == "completed" ]] || {
              echo "::error::bridge run reported an unexpected status: $BRIDGE_STATUS" >&2
              exit 1
            }
            [[ "$BRIDGE_STATUS" != "completed" ]] || break
            sleep 20
          done
          test "${BRIDGE_STATUS:-}" = "completed" || {
            echo "::error::bridge run did not complete in time" >&2
            exit 1
          }
          PREFIX="$RUNNER_TEMP/trusted-bridge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          RUN_RESPONSE="$PREFIX-run.json"
          ARTIFACTS_RESPONSE="$PREFIX-artifacts.json"
          BRIDGE_ARCHIVE="$PREFIX.zip"
          for path in "$RUN_RESPONSE" "$ARTIFACTS_RESPONSE" "$BRIDGE_ARCHIVE"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::refusing pre-existing or symlinked bridge path: $path" >&2
