          import json, os, pathlib

          pathlib.Path("build/060/publish-state.json").write_text(
              json.dumps(
                  {
                      "candidate_sha": os.environ["CANDIDATE_SHA"],
                      "tag": os.environ["TAG"],
                      "tag_created": True,
