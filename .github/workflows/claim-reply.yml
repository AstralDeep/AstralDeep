# Reconciles source issue claims through the pinned community action without checking out repository code.
name: Bounty claims
on:
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
    inputs:
      comment_id:
        description: Comment ID, or leave empty to reconcile all claims
        required: false
        type: string
      dry_run:
        description: Preview without changing comments or assignments
        required: true
        type: boolean
        default: true
permissions: {}
concurrency:
  group: bounty-claims
  cancel-in-progress: false
jobs:
  reply:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || github.event.comment.user.type == 'User'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: AstralDeep/astraldeep.github.io/actions/claim-reply@3d2d31aa243fdfde35be30ce46de0065430ea4cf
        with:
          comment-id: ${{ inputs.comment_id || '' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
