# Spec 060 (T107/T119) — the protected trust root of the release-readiness
# pipeline. Call-only by design: this workflow reconstructs producer job,
# runner, and artifact identities from the SHARED run's GitHub API state (a
# reusable call shares github.run_id with its caller) and NEVER from
# producer-uploaded bytes, writes one trusted_workflow_provenance manifest per
# evidence producer, consumes stage-deploy's trusted_stage_deploy manifest,
# attests every manifest, and uploads them under an exact attempt-scoped
# `trusted-manifests-<request>-<attempt>` artifact name. The protected commit
# SHA of THIS FILE is the validator's
# --protected-builder-sha (repository variable RELEASE_TRUSTED_BUILDER_SHA,
# recorded at the first T120 checkpoint); its attestation certificate identity
# is RELEASE_TRUSTED_BUILDER_IDENTITY.
name: release-trusted-builder

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit the shared run is testing
        required: true
        type: string
      request_id:
        description: Optional caller correlation id (rides the run-name only)
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  attestations: write
  actions: read
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      STAGE_ARTIFACT_SUFFIX: ${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
      RELEASE_TRUSTED_BUILDER_SHA: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
      RELEASE_TRUSTED_BUILDER_IDENTITY: ${{ vars.RELEASE_TRUSTED_BUILDER_IDENTITY }}
    steps:
      - name: Refuse authority outside the installed protected workflow commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          expected = os.environ.get("RELEASE_TRUSTED_BUILDER_SHA", "")
          actual = os.environ.get("GITHUB_WORKFLOW_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected) or actual != expected:
              raise SystemExit("trusted builder is not executing at the installed protected commit")
          if not os.environ.get("RELEASE_TRUSTED_BUILDER_IDENTITY", ""):
              raise SystemExit("trusted builder certificate identity is not installed")
          PY
      - name: Check out the installed protected artifact extractor
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.RELEASE_TRUSTED_BUILDER_SHA }}
          fetch-depth: 1
          persist-credentials: false
      # Identity reconstruction source: the CURRENT run's own job and artifact
      # listings. Self-declared values inside any downloaded artifact are never
      # a trust root here.
      - name: Reconstruct producer identities from the shared run API state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e build || -L build ]]; then
            echo "::error::protected builder checkout unexpectedly contains build output" >&2
            exit 1
          fi
          mkdir -p build/060/trust/producers build/060/trust/stage build/060/api
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --paginate --jq '.jobs[]' > build/060/api/jobs.ndjson
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --paginate --jq '.artifacts[]' > build/060/api/artifacts.ndjson

      - name: Download evidence and stage artifacts by exact artifact id
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          api = pathlib.Path("build/060/api")
          artifacts = [
              json.loads(line)
              for line in api.joinpath("artifacts.ndjson").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          suffix = os.environ["STAGE_ARTIFACT_SUFFIX"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", suffix):
              raise SystemExit("stage artifact suffix is not canonical")
          expected_stage_outputs = f"stage-outputs-{suffix}"
          expected_stage_manifest = f"stage-manifest-{suffix}"
          expected_evidence = {
              f"evidence-{platform}-{suffix}"
              for platform in ("backend", "web", "windows", "android", "macos", "ios", "watchos", "docs")
          }
          expected_raw_apple = {
              f"raw-apple-evidence-{platform}-{suffix}"
              for platform in ("macos", "ios", "watchos")
          }
          candidate = os.environ["CANDIDATE_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if (
              not re.fullmatch(r"[0-9a-f]{40}", candidate)
              or not re.fullmatch(r"[1-9][0-9]*", run_id)
              or not re.fullmatch(r"[1-9][0-9]*", run_attempt)
          ):
              raise SystemExit("candidate or current-run identity is not canonical")
          expected_windows_product = (
              f"windows-unsigned-{candidate}-{run_id}-{run_attempt}"
          )
          expected_names = expected_evidence | expected_raw_apple | {
              expected_stage_outputs,
              expected_stage_manifest,
              expected_windows_product,
          }
          wanted = {}
          for artifact in artifacts:
              name = artifact["name"]
              if name.startswith((
                  "evidence-",
                  "raw-apple-evidence-",
                  "stage-outputs-",
                  "stage-manifest-",
                  "windows-unsigned-",
              )) and name not in expected_names:
                  raise SystemExit(f"wrong attempt-scoped input artifact name: {name}")
              if name not in expected_names:
                  continue
              if artifact.get("expired") is not False:
                  raise SystemExit(f"selected run artifact is expired: {name}")
              if name in wanted:
                  raise SystemExit(f"duplicate run artifact name: {name}")
              wanted[name] = artifact
          missing = expected_names - set(wanted)
          if missing:
              raise SystemExit(f"shared run lacks required artifact(s): {sorted(missing)}")
          artifact_ids = [str(artifact.get("id", "")) for artifact in wanted.values()]
          if (
              any(not re.fullmatch(r"[1-9][0-9]*", artifact_id) for artifact_id in artifact_ids)
              or len(artifact_ids) != len(set(artifact_ids))
          ):
              raise SystemExit("selected artifacts lack unique canonical ids")
          for name, artifact in wanted.items():
              size = artifact.get("size_in_bytes")
              if isinstance(size, bool) or not isinstance(size, int) or not 0 < size <= 512 * 1024 * 1024:
                  raise SystemExit(f"selected run artifact has an invalid size: {name}")
          downloads = pathlib.Path("build/060/downloads")
          downloads.mkdir(parents=True, exist_ok=True)
          for name, artifact in sorted(wanted.items()):
              zip_path = downloads / f"{artifact['id']}.zip"
              with zip_path.open("wb") as handle:
                  subprocess.run(
                      ["gh", "api",
                       f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact['id']}/zip"],
                      check=True, stdout=handle,
                  )
              target = downloads / str(artifact["id"])
              subprocess.run(
                  [
                      "python3",
                      "scripts/extract_release_artifact.py",
                      "--archive",
                      str(zip_path),
                      "--target",
                      str(target),
                  ],
                  check=True,
              )
          api.joinpath("selected.json").write_text(
              json.dumps({name: a["id"] for name, a in wanted.items()}, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Write one trusted manifest per producer and the stage manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, uuid
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          candidate = os.environ["CANDIDATE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("candidate_sha must be one exact lowercase commit SHA")
          builder_sha = os.environ.get("RELEASE_TRUSTED_BUILDER_SHA", "")
          builder_identity = os.environ.get("RELEASE_TRUSTED_BUILDER_IDENTITY", "")
          if not builder_sha or not builder_identity:
              raise SystemExit(
                  "RELEASE_TRUSTED_BUILDER_SHA / RELEASE_TRUSTED_BUILDER_IDENTITY "
                  "repository variables are unset (T120 checkpoint 1)"
              )
          workflow_ref = os.environ["GITHUB_WORKFLOW_REF"].split("@", 1)[0]
          workflow_ref = f"{workflow_ref}@{os.environ['GITHUB_WORKFLOW_SHA']}"

          api = pathlib.Path("build/060/api")
          jobs = [
              json.loads(line)
              for line in api.joinpath("jobs.ndjson").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          selected = json.loads(api.joinpath("selected.json").read_text(encoding="utf-8"))

          def job_for(job_id: str) -> dict:
              matches = [
                  job for job in jobs
                  if job_id in [part.strip() for part in job.get("name", "").split("/")]
              ]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one run job for {job_id}: {len(matches)}")
              job = matches[0]
              if (
                  job.get("status") != "completed"
                  or job.get("conclusion") != "success"
              ):
                  raise SystemExit(f"producer job did not complete successfully: {job_id}")
              return job

          def runner_identity(job: dict) -> dict:
              labels = [str(item).lower() for item in job.get("labels", [])]
              text = " ".join(labels)
              os_name = "windows" if "windows" in text else "macos" if "macos" in text else "linux"
              return {
                  "os": os_name,
                  "architecture": "arm64" if os_name == "macos" else "x86_64",
                  "runner_image": ",".join(labels) or "unknown",
                  "runner_name": job.get("runner_name") or "unknown",
                  "runner_environment": (
                      "self_hosted" if "self-hosted" in text else "github_hosted"
                  ),
              }

          def members(artifact_id: str, root: pathlib.Path) -> list[dict]:
              records = []
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  member = path.relative_to(root).as_posix()
                  with path.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  records.append({
                      "kind": "github_actions_artifact_member",
                      "repository": repo,
                      "run_id": run_id,
                      "run_attempt": run_attempt,
                      "artifact_id": str(artifact_id),
                      "artifact_name": name_by_id[str(artifact_id)],
                      "member": member,
                      "immutable_reference": (
                          f"gh://{repo}/runs/{run_id}/attempts/{run_attempt}"
                          f"/artifacts/{artifact_id}/members/{member}"
                      ),
                      "sha256": digest,
                  })
              return records

          name_by_id = {str(v): k for k, v in selected.items()}
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          producers = ("backend", "web", "windows", "android", "macos", "ios", "watchos", "docs")
          suffix = os.environ["STAGE_ARTIFACT_SUFFIX"]
          stage_manifest_name = f"stage-manifest-{suffix}"
          stage_manifest_id = str(selected[stage_manifest_name])
          stage_manifest_path = (
              pathlib.Path("build/060/downloads")
              / stage_manifest_id
              / "trusted-stage-deploy.json"
          )
          stage_document = json.loads(stage_manifest_path.read_text(encoding="utf-8"))
          deployment = stage_document.get("deployment")
          candidate_image = (
              deployment.get("candidate_image_reference")
              if isinstance(deployment, dict)
              else None
          )
          candidate_image_sha256 = (
              deployment.get("candidate_image_sha256")
              if isinstance(deployment, dict)
              else None
          )
          image_match = re.fullmatch(
              r"(?P<registry>[A-Za-z0-9.-]+(?::[0-9]{1,5})?)/"
              r"(?P<repository>[A-Za-z0-9._/-]+)@"
              r"(?P<digest>sha256:[0-9a-f]{64})",
              candidate_image or "",
          )
          if (
              image_match is None
              or image_match.group("registry") != "ghcr.io"
              or image_match.group("repository") != repo.lower()
              or image_match.group("digest").removeprefix("sha256:")
              != candidate_image_sha256
          ):
              raise SystemExit("stage manifest has a noncanonical candidate OCI identity")
          candidate_product_claim = {
              "kind": "oci_manifest",
              "registry": image_match.group("registry"),
              "repository_path": image_match.group("repository"),
              "digest": image_match.group("digest"),
              "immutable_reference": f"oci://{candidate_image}",
              "sha256": candidate_image_sha256,
          }
          index = {"producers": {}, "stage": {}}
          for platform in producers:
              artifact_name = f"evidence-{platform}-{os.environ['STAGE_ARTIFACT_SUFFIX']}"
              if artifact_name not in selected:
                  raise SystemExit(f"missing run artifact: {artifact_name}")
              artifact_id = selected[artifact_name]
              job = job_for(f"{platform}-producer")
              artifact_claims = members(
                  artifact_id, pathlib.Path("build/060/downloads") / str(artifact_id)
              )
              if platform in {"backend", "web"}:
                  artifact_claims.append(dict(candidate_product_claim))
              manifest = {
                  "document_type": "trusted_workflow_provenance",
                  "schema_version": 1,
                  "manifest_id": str(uuid.uuid4()),
                  "repository": repo,
                  "candidate_sha": candidate,
                  "workflow": {
                      "name": os.environ["GITHUB_WORKFLOW"],
                      "run_id": run_id,
                      "run_attempt": run_attempt,
                      "job_id": f"{platform}-producer",
                  },
                  "workflow_ref": workflow_ref,
                  "runner": runner_identity(job),
                  "trusted_builder": {
                      "repository": repo,
                      "workflow_path": ".github/workflows/release-trusted-builder.yml",
                      "signer_digest": builder_sha,
                      "certificate_identity": builder_identity,
                  },
                  "generated_at": now,
                  "artifacts": artifact_claims,
              }
              if platform in {"macos", "ios", "watchos"}:
                  raw_name = (
                      f"raw-apple-evidence-{platform}-"
                      f"{os.environ['STAGE_ARTIFACT_SUFFIX']}"
                  )
                  if raw_name not in selected:
                      raise SystemExit(f"missing raw Apple run artifact: {raw_name}")
                  raw_artifact_id = selected[raw_name]
                  raw_job_id = f"{platform}-raw-producer"
                  raw_job = job_for(raw_job_id)
                  manifest["source_provenance"] = {
                      "workflow": {
                          "name": os.environ["GITHUB_WORKFLOW"],
                          "run_id": run_id,
                          "run_attempt": run_attempt,
                          "job_id": raw_job_id,
                      },
                      "runner": runner_identity(raw_job),
                      "artifacts": members(
                          raw_artifact_id,
                          pathlib.Path("build/060/downloads") / str(raw_artifact_id),
                      ),
                  }
              elif platform == "windows":
                  source_name = (
                      f"windows-unsigned-{candidate}-{run_id}-{run_attempt}"
                  )
                  if source_name not in selected:
                      raise SystemExit(f"missing Windows product artifact: {source_name}")
                  source_artifact_id = selected[source_name]
                  source_claims = members(
                      source_artifact_id,
                      pathlib.Path("build/060/downloads") / str(source_artifact_id),
                  )
                  if len(
                      [claim for claim in source_claims if claim["member"] == "AstralDeep.exe"]
                  ) != 1:
                      raise SystemExit(
                          "Windows product artifact lacks one exact AstralDeep.exe member"
                      )
                  manifest["source_provenance"] = {
                      "workflow": {
                          "name": os.environ["GITHUB_WORKFLOW"],
                          "run_id": run_id,
                          "run_attempt": int(run_attempt),
                          "job_id": "windows-candidate",
                      },
                      "runner": runner_identity(job_for("windows-candidate")),
                      "artifacts": source_claims,
                  }
              out = pathlib.Path(f"build/060/trust/producers/{platform}.json")
              out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              index["producers"][platform] = {
                  "manifest_id": manifest["manifest_id"],
                  "role": "producer",
                  "member": f"producers/{platform}.json",
                  "source_artifact_id": str(artifact_id),
              }

          # Stage outputs are uploaded first. The protected staging driver then
          # writes a manifest containing the actual immutable artifact id, and
          # that manifest is uploaded as a separate immutable artifact.
          stage_outputs_name = f"stage-outputs-{suffix}"
          if stage_outputs_name not in selected or stage_manifest_name not in selected:
              raise SystemExit("exact stage output/manifest artifacts are missing")
          job_for("stage-deploy")
          stage_outputs_id = str(selected[stage_outputs_name])
          stage_dir = pathlib.Path("build/060/downloads") / stage_outputs_id
          manifest_dir = pathlib.Path("build/060/downloads") / stage_manifest_id
          stage_output = stage_dir / "staging-outputs.json"
          stage_manifest = manifest_dir / "trusted-stage-deploy.json"
          for root, expected_file in (
              (stage_dir, stage_output),
              (manifest_dir, stage_manifest),
          ):
              members_found = sorted(path for path in root.rglob("*") if path.is_file())
              if members_found != [expected_file] or any(path.is_symlink() for path in root.rglob("*")):
                  raise SystemExit("stage artifact has unexpected or symlinked members")
          document = json.loads(stage_manifest.read_text(encoding="utf-8"))
          if document.get("document_type") != "trusted_stage_deploy":
              raise SystemExit("stage manifest has the wrong document_type")
          expected_claim = {
              "kind": "github_actions_artifact_member",
              "repository": repo,
              "run_id": run_id,
              "run_attempt": run_attempt,
              "artifact_id": stage_outputs_id,
              "artifact_name": stage_outputs_name,
              "member": "staging-outputs.json",
              "immutable_reference": (
                  f"gh://{repo}/runs/{run_id}/attempts/{run_attempt}"
                  f"/artifacts/{stage_outputs_id}/members/staging-outputs.json"
              ),
              "sha256": hashlib.sha256(stage_output.read_bytes()).hexdigest(),
          }
          if document.get("stage_outputs_artifact") != expected_claim:
              raise SystemExit("stage manifest does not bind the exact immutable outputs artifact")
          stage_output_document = json.loads(stage_output.read_text(encoding="utf-8"))
          expected_deployment = {
              key: value
              for key, value in stage_output_document.items()
              if key not in {"deployed_at", "macos_personal_agent_host"}
          }
          if document.get("deployment") != expected_deployment:
              raise SystemExit("stage manifest deployment differs from the uploaded stage outputs")
          target = pathlib.Path("build/060/trust/stage/trusted-stage-deploy.json")
          target.write_bytes(stage_manifest.read_bytes())
          index["stage"] = {
              "manifest_id": document.get("manifest_id"),
              "role": "stage_deploy",
              "member": "stage/trusted-stage-deploy.json",
              "source_artifact_id": stage_manifest_id,
              "stage_outputs_artifact_id": stage_outputs_id,
          }
          pathlib.Path("build/060/trust/receipt-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Attest every trusted manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            build/060/trust/producers/*.json
            build/060/trust/stage/*.json

      - name: Upload trusted manifests and receipt index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-manifests-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/trust/
          if-no-files-found: error
          retention-days: 14
