# Direct Windows release — build, sign (keyless sigstore), and publish the
# Windows desktop client as a GitHub Release on a v* tag push.
#
# This restores the feature-039 direct release path (which shipped v0.1.0
# through v0.3.0) in place of the feature-060 protected bridge. The bridge
# (never-rebuild, decision-verified signer) lives in git history at d3cb9a51
# and can be restored when the protected readiness pipeline goes live —
# re-pin vars.RELEASE_BRIDGE_WORKFLOW_SHA256 at that point.
#
# The workflow path and tag-ref trigger are load-bearing: the shipped client's
# updater (components/AstralProjection/windows-client/astral_client/integrity.py) fail-closes unless the
# release assets are signed by the OIDC identity
#   https://github.com/AstralDeep/AstralDeep/.github/workflows/release-windows.yml@refs/tags/<tag>
# so the signing MUST happen in this file, running at the tag ref.
#
# Produces three assets per release:
#   AstralDeep.exe   — the PyInstaller-built native client
#   SHA256SUMS       — the SHA-256 of the exe (the client's primary integrity check)
#   cosign.bundle    — the sigstore bundle (keyless, signed with the workflow's
#                      GitHub OIDC identity; verified client-side)

name: Release Windows client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release + upload assets
  id-token: write   # sigstore keyless signing (OIDC)

jobs:
  build-sign-release:
    # A privileged manual dispatch may only start from the protected default
    # branch. GitHub runs the workflow DEFINITION FROM THE DISPATCHED REF, so
    # without this guard anyone with write access could push arbitrary YAML to a
    # feature branch, dispatch it there, and have candidate code write its own
    # privileges inside a job holding contents: write + id-token: write —
    # minting a real sigstore signature and overwriting a live release's assets.
    #
    # Tag pushes (the real release path) short-circuit the first disjunct, so
    # github.ref stays refs/tags/<tag> and the Fulcio SAN the shipped v0.3.0
    # updater pins is byte-identical to today's. The outer parentheses are
    # required by scripts/verify_release_evidence_bootstrap.py's guard matcher.
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The Windows client lives in the AstralProjection submodule since
      # Feature 074; the release is built from the exact composition pin.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: components/AstralProjection/windows-client/requirements-release.lock.txt

      # Guard: the pushed tag must equal v<astral_client.__version__>. Without
      # this, a tag pushed against a stale version constant builds and signs
      # cleanly but ships an exe whose launch integrity check permanently
      # reports "A verified update is available" (it compares the baked
      # __version__ to the latest release tag). Tag-push runs only —
      # workflow_dispatch runs from a branch ref and is exempt.
      - name: Tag matches astral_client.__version__
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: components/AstralProjection/windows-client
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, sys
          import astral_client
          tag = os.environ["TAG"]
          want = f"v{astral_client.__version__}"
          if tag != want:
              sys.exit(f"Tag {tag!r} != v<__version__> ({want!r}) — bump "
                       "components/AstralProjection/windows-client/astral_client/__init__.py before tagging.")
          print(f"tag {tag} matches __version__")
          EOF

      # The complete hash lock (same one build-windows-candidate.yml proves
      # reproducible) already pins pyinstaller and the sigstore CLI, so the
      # released exe is built from exactly the dependency set CI validates.
      - name: Install locked build + signing deps
        run: python -m pip install --require-hashes -r components/AstralProjection/windows-client/requirements-release.lock.txt

      # Feature 075: AstralDeep.spec embeds the first-party native speech helper
      # and refuses to freeze without its deterministic publish and provenance
      # record. These steps mirror the AstralProjection CI windows lane exactly.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.400"

      - name: Verify the exact native SDK
        working-directory: components/AstralProjection
        shell: pwsh
        run: |
          if ((dotnet --version).Trim() -ne "10.0.400") {
            throw "unexpected .NET SDK"
          }

      - name: Restore the native helper from its exact lock
        working-directory: components/AstralProjection
        run: dotnet restore windows-client\asr-helper\tests\AstralSpeechHelper.Tests.csproj --locked-mode

      - name: Publish deterministic helper and verify provenance
        working-directory: components/AstralProjection
        shell: pwsh
        run: |
          $publish = 'windows-client\asr-helper\publish'
          $allowed = @(
            'AstralSpeechHelper.exe',
            'AstralSpeechHelper.exe.config',
            'AstralSpeechHelper.pdb',
            'helper-build-provenance.json'
          ) | Sort-Object

          function Get-VerifiedHelperHash([string] $directory) {
            $actual = @(Get-ChildItem $directory -File | ForEach-Object Name | Sort-Object)
            if (($actual -join "`n") -ne ($allowed -join "`n")) {
              throw "helper publish allowlist mismatch: $($actual -join ', ')"
            }
            $provenance = Get-Content "$directory\helper-build-provenance.json" -Raw |
              ConvertFrom-Json
            $keys = @($provenance.PSObject.Properties.Name | Sort-Object)
            if (($keys -join ',') -ne 'executable_sha256,schema_version,source_manifest_sha256' -or
                $provenance.schema_version -ne 1) {
              throw "helper provenance shape is invalid"
            }
            foreach ($value in @(
              $provenance.source_manifest_sha256,
              $provenance.executable_sha256
            )) {
              if ($value -cnotmatch '^[0-9A-Fa-f]{64}$') {
                throw "helper provenance digest is invalid"
              }
            }
            $sourceHash = (Get-FileHash `
              windows-client\asr-helper\helper-source-hashes.json -Algorithm SHA256).Hash
            $executableHash = (Get-FileHash `
              "$directory\AstralSpeechHelper.exe" -Algorithm SHA256).Hash
            if ($provenance.source_manifest_sha256.ToLowerInvariant() -ne
                $sourceHash.ToLowerInvariant() -or
                $provenance.executable_sha256.ToLowerInvariant() -ne
                $executableHash.ToLowerInvariant()) {
              throw "helper provenance does not match its inputs"
            }
            return $executableHash
          }

          if (Test-Path -LiteralPath $publish) {
            Remove-Item -LiteralPath $publish -Recurse -Force
          }
          dotnet clean windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release
          dotnet publish windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release --no-restore --output $publish
          $firstHash = Get-VerifiedHelperHash $publish

          Remove-Item -LiteralPath $publish -Recurse -Force
          dotnet clean windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release
          dotnet publish windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release --no-restore --output $publish
          $secondHash = Get-VerifiedHelperHash $publish
          if ($firstHash -ne $secondHash) {
            throw "helper publish is not byte reproducible"
          }

      - name: Build the exe (PyInstaller)
        working-directory: components/AstralProjection/windows-client
        run: pyinstaller --noconfirm --clean AstralDeep.spec

      - name: Create SHA256SUMS
        working-directory: components/AstralProjection/windows-client/dist
        shell: bash
        run: |
          sha256sum AstralDeep.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Keyless sign with sigstore (GitHub OIDC)
        working-directory: components/AstralProjection/windows-client/dist
        shell: bash
        # Keyless signing uses the job's ambient GitHub OIDC credential
        # (permissions.id-token: write) — no --identity/--oidc-issuer flags,
        # which conflict with the ambient token. Fulcio issues a cert whose
        # SAN is the token's `sub`:
        #   https://github.com/AstralDeep/AstralDeep/.github/workflows/release-windows.yml@refs/tags/<tag>
        # The client verifier rebuilds that exact string from the release tag.
        run: |
          sigstore sign AstralDeep.exe --bundle cosign.bundle

      - name: Verify the signature (self-check)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: components/AstralProjection/windows-client/dist
        shell: bash
        env:
          SIGSTORE_IDENTITY: "https://github.com/AstralDeep/AstralDeep/.github/workflows/release-windows.yml@refs/tags/${{ github.ref_name }}"
        run: |
          sigstore verify identity AstralDeep.exe --bundle cosign.bundle \
            --cert-identity "$SIGSTORE_IDENTITY" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com

      # A main-ref rehearsal dispatch proves the build and signing path end to
      # end; its Fulcio SAN names refs/heads/main, and nothing is published.
      - name: Verify the signature (rehearsal self-check)
        if: github.event_name == 'workflow_dispatch'
        working-directory: components/AstralProjection/windows-client/dist
        shell: bash
        env:
          SIGSTORE_IDENTITY: "https://github.com/AstralDeep/AstralDeep/.github/workflows/release-windows.yml@${{ github.ref }}"
        run: |
          sigstore verify identity AstralDeep.exe --bundle cosign.bundle \
            --cert-identity "$SIGSTORE_IDENTITY" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com
          echo "::notice::rehearsal only — no release is published from ${{ github.ref }}"

      # Tag pushes only: a main-ref rehearsal dispatch builds, signs, and
      # self-verifies the exe but never publishes.
      - name: Create / update the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            components/AstralProjection/windows-client/dist/AstralDeep.exe
            components/AstralProjection/windows-client/dist/SHA256SUMS
            components/AstralProjection/windows-client/dist/cosign.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true
