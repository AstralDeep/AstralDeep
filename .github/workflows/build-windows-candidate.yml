name: Build Windows unsigned candidate

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to build once
        required: true
        type: string
    outputs:
      artifact_id:
        description: Immutable GitHub Actions artifact ID
        value: ${{ jobs.windows-candidate.outputs.artifact_id }}
      artifact_digest:
        description: SHA-256 reported by upload-artifact
        value: ${{ jobs.windows-candidate.outputs.artifact_digest }}
      executable_sha256:
        description: SHA-256 of the one unsigned AstralDeep.exe
        value: ${{ jobs.windows-candidate.outputs.executable_sha256 }}
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit (defaults to the dispatched commit)
        required: false
        type: string

# This candidate producer cannot sign, tag, create a release, upload release
# assets, or otherwise mutate public state. The protected native CI publisher
# consumes the independently validated decision and these exact artifact
# identities with a job-scoped short-lived token; no custom GitHub App is used.
permissions:
  contents: read

concurrency:
  group: windows-unsigned-candidate-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  windows-candidate:
    name: Windows 0.4.0 build-once candidate
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      executable_sha256: ${{ steps.identity.outputs.executable_sha256 }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      # actions/checkout v5, pinned to immutable action bytes.
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Verify the exact initialized component composition
        shell: pwsh
        run: python -I scripts/verify_composition.py --root .

      - name: Prove the exact candidate checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "candidate_sha must be one exact lowercase 40-character commit SHA"
          }
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "checked out $actual instead of candidate $env:CANDIDATE_SHA"
          }

      # actions/setup-python v6, pinned to immutable action bytes.
      - name: Select release Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: components/AstralProjection/windows-client/requirements-release.lock.txt

      - name: Create two clean locked release environments
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          python -m venv components\AstralProjection\windows-client\.venv-release-a
          python -m venv components\AstralProjection\windows-client\.venv-release-b
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pip install --require-hashes -r components\AstralProjection\windows-client\requirements-release.lock.txt
          & components\AstralProjection\windows-client\.venv-release-b\Scripts\python -m pip install --require-hashes -r components\AstralProjection\windows-client\requirements-release.lock.txt
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pip check
          & components\AstralProjection\windows-client\.venv-release-b\Scripts\python -m pip check

      - name: Prove the clean runtime sets are identical
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build\windows-candidate | Out-Null
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py environment-manifest `
            --lock components\AstralProjection\windows-client\requirements-release.lock.txt `
            --output build\windows-candidate\environment-a.json
          & components\AstralProjection\windows-client\.venv-release-b\Scripts\python scripts\windows_release_candidate.py environment-manifest `
            --lock components\AstralProjection\windows-client\requirements-release.lock.txt `
            --output build\windows-candidate\environment-b.json
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py compare-environments `
            --first build\windows-candidate\environment-a.json `
            --second build\windows-candidate\environment-b.json `
            --output build\windows-candidate\reproducibility.json

      - name: Build the unsigned executable exactly once
        working-directory: components/AstralProjection/windows-client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & .\.venv-release-a\Scripts\pyinstaller --noconfirm --clean AstralDeep.spec
          if (-not (Test-Path .\dist\AstralDeep.exe)) {
            throw "PyInstaller did not produce AstralDeep.exe"
          }

      - name: Preflight the actual frozen profile, runtime, and lock
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ASTRAL_WINDOWS_PROFILE_ID = [guid]::NewGuid().ToString('D')
          # AstralDeep.exe is built WINDOWED (console=False in AstralDeep.spec).
          # PowerShell's call operator returns immediately for a GUI subsystem
          # binary and never sets $LASTEXITCODE, so the previous check compared
          # $null against 0, threw on EVERY run, and threw before the exe had
          # even finished writing its report — the report it did write said
          # "status": "valid". Start-Process -Wait is the only form that both
          # waits for a windowed process and yields its real exit code.
          $exe = Join-Path $PWD 'components\AstralProjection\windows-client\dist\AstralDeep.exe'
          $report = Join-Path $PWD 'build\windows-candidate\deployment-validation.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $report) | Out-Null
          $validate = Start-Process -FilePath $exe `
            -ArgumentList '--validate-deployment', '--report', $report `
            -Wait -PassThru -NoNewWindow
          if ($validate.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "frozen deployment validation failed with $($validate.ExitCode)"
          }
          Get-Content $report

      - name: Bind executable to source, profile, runtime, and lock
        id: identity
        shell: pwsh
        env:
          ARTIFACT_NAME: windows-unsigned-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py artifact-manifest `
            --executable components\AstralProjection\windows-client\dist\AstralDeep.exe `
            --profile components\AstralProjection\windows-client\deployment\release-profile.json `
            --runtime-manifest components\AstralProjection\windows-client\deployment\runtime-manifest.json `
            --requirements-input components\AstralProjection\windows-client\requirements.in `
            --lock components\AstralProjection\windows-client\requirements-release.lock.txt `
            --source-sha $env:CANDIDATE_SHA `
            --run-id "${{ github.run_id }}" `
            --run-attempt "${{ github.run_attempt }}" `
            --artifact-name $env:ARTIFACT_NAME `
            --output build\windows-candidate\candidate-manifest.json
          $manifest = Get-Content build\windows-candidate\candidate-manifest.json -Raw | ConvertFrom-Json
          "artifact_name=$env:ARTIFACT_NAME" >> $env:GITHUB_OUTPUT
          "executable_sha256=$($manifest.executable_sha256)" >> $env:GITHUB_OUTPUT
          Copy-Item components\AstralProjection\windows-client\dist\AstralDeep.exe build\windows-candidate\AstralDeep.exe

      # actions/upload-artifact v4, pinned to immutable action bytes.
      - name: Archive the exact matrix-input executable and provenance
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: build/windows-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record immutable Actions artifact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py artifact-reference `
            --manifest build\windows-candidate\candidate-manifest.json `
            --artifact-id "${{ steps.upload.outputs.artifact-id }}" `
            --artifact-digest "${{ steps.upload.outputs.artifact-digest }}" `
            --output build\windows-candidate-reference.json

      - name: Archive the artifact reference receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-candidate-reference.json
          if-no-files-found: error
          retention-days: 14
