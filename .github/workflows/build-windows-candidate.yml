name: Build Windows unsigned candidate

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to build once
        required: true
        type: string
    secrets:
      staging_access_token:
        description: >-
          Pre-minted short-lived token for the bundled staging deployment.
          Optional when staging_username/staging_password are supplied — the job
          then mints its own token immediately before the smoke steps, which is
          strictly better because this build takes ~30 minutes to reach them and
          a Keycloak access token minted before dispatch has usually expired.
        required: false
      staging_username:
        description: Least-privilege staging account used to mint a fresh smoke token
        required: false
      staging_password:
        description: Password for staging_username
        required: false
    outputs:
      artifact_id:
        description: Immutable GitHub Actions artifact ID
        value: ${{ jobs.windows-candidate.outputs.artifact_id }}
      artifact_digest:
        description: SHA-256 reported by upload-artifact
        value: ${{ jobs.windows-candidate.outputs.artifact_digest }}
      executable_sha256:
        description: SHA-256 of the one unsigned AstralDeep.exe
        value: ${{ jobs.windows-candidate.outputs.executable_sha256 }}
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit (defaults to the dispatched commit)
        required: false
        type: string

# This candidate producer cannot sign, tag, create a release, upload release
# assets, or otherwise mutate public state. The protected native CI publisher
# consumes the independently validated decision and these exact artifact
# identities with a job-scoped short-lived token; no custom GitHub App is used.
permissions:
  contents: read

concurrency:
  group: windows-unsigned-candidate-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  windows-candidate:
    name: Windows 0.4.0 build-once candidate
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      executable_sha256: ${{ steps.identity.outputs.executable_sha256 }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      # actions/checkout v5, pinned to immutable action bytes.
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Verify the exact initialized component composition
        shell: pwsh
        run: python -I scripts/verify_composition.py --root .

      - name: Prove checkout and staging input
        shell: pwsh
        env:
          ASTRAL_WINDOWS_SMOKE_TOKEN: ${{ secrets.staging_access_token }}
          ASTRAL_STAGING_USERNAME: ${{ secrets.staging_username || secrets.ASTRAL_STAGING_USERNAME }}
          ASTRAL_STAGING_PASSWORD: ${{ secrets.staging_password || secrets.ASTRAL_STAGING_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "candidate_sha must be one exact lowercase 40-character commit SHA"
          }
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "checked out $actual instead of candidate $env:CANDIDATE_SHA"
          }
          # Fail fast on missing staging access, exactly as before — but either
          # form satisfies it: a pre-minted token, or credentials this job can
          # mint from later (preferred; see the mint step).
          $haveToken = -not [string]::IsNullOrWhiteSpace($env:ASTRAL_WINDOWS_SMOKE_TOKEN)
          $haveCreds = (-not [string]::IsNullOrWhiteSpace($env:ASTRAL_STAGING_USERNAME)) `
            -and (-not [string]::IsNullOrWhiteSpace($env:ASTRAL_STAGING_PASSWORD))
          if (-not $haveToken -and -not $haveCreds) {
            throw "staging access is required: supply staging_username/staging_password (preferred) or a pre-minted staging_access_token"
          }
          Write-Host "staging access: $(if ($haveCreds) { 'credentials (token minted at smoke time)' } else { 'pre-minted token' })"

      # actions/setup-python v6, pinned to immutable action bytes.
      - name: Select release Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            components/AstralProjection/windows-client/requirements-release.lock.txt
            tooling/python-ci/requirements.lock.txt

      - name: Create two clean locked release environments
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          python -m venv components\AstralProjection\windows-client\.venv-release-a
          python -m venv components\AstralProjection\windows-client\.venv-release-b
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pip install --require-hashes -r components\AstralProjection\windows-client\requirements-release.lock.txt
          & components\AstralProjection\windows-client\.venv-release-b\Scripts\python -m pip install --require-hashes -r components\AstralProjection\windows-client\requirements-release.lock.txt
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pip check
          & components\AstralProjection\windows-client\.venv-release-b\Scripts\python -m pip check

      - name: Prove the clean runtime sets are identical
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build\windows-candidate | Out-Null
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py environment-manifest `
            --lock components\AstralProjection\windows-client\requirements-release.lock.txt `
            --output build\windows-candidate\environment-a.json
          & components\AstralProjection\windows-client\.venv-release-b\Scripts\python scripts\windows_release_candidate.py environment-manifest `
            --lock components\AstralProjection\windows-client\requirements-release.lock.txt `
            --output build\windows-candidate\environment-b.json
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py compare-environments `
            --first build\windows-candidate\environment-a.json `
            --second build\windows-candidate\environment-b.json `
            --output build\windows-candidate\reproducibility.json

      - name: Build the unsigned executable exactly once
        working-directory: components/AstralProjection/windows-client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & .\.venv-release-a\Scripts\pyinstaller --noconfirm --clean AstralDeep.spec
          if (-not (Test-Path .\dist\AstralDeep.exe)) {
            throw "PyInstaller did not produce AstralDeep.exe"
          }

      - name: Clear the native QSettings key
        shell: pwsh
        run: |
          reg.exe delete HKCU\Software\AstralDeep\WindowsClient /f 2>$null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            throw "could not clear the WindowsClient QSettings key"
          }
          exit 0

      - name: Preflight the actual frozen profile, runtime, and lock
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # AstralDeep.exe is built WINDOWED (console=False in AstralDeep.spec).
          # PowerShell's call operator returns immediately for a GUI subsystem
          # binary and never sets $LASTEXITCODE, so the previous check compared
          # $null against 0, threw on EVERY run, and threw before the exe had
          # even finished writing its report — the report it did write said
          # "status": "valid". Start-Process -Wait is the only form that both
          # waits for a windowed process and yields its real exit code.
          $exe = Join-Path $PWD 'components\AstralProjection\windows-client\dist\AstralDeep.exe'
          $report = Join-Path $PWD 'build\windows-candidate\deployment-validation.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $report) | Out-Null
          $validate = Start-Process -FilePath $exe `
            -ArgumentList '--validate-deployment', '--report', $report `
            -Wait -PassThru -NoNewWindow
          if ($validate.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "frozen deployment validation failed with $($validate.ExitCode)"
          }
          Get-Content $report

      # Minted HERE, not at job start: the build above takes ~30 minutes, and a
      # Keycloak access token is typically valid for 5-15. A token supplied by
      # the caller was usually already expired by the time the smoke steps ran.
      - name: Mint a fresh staging smoke token
        id: smoke_token
        shell: pwsh
        env:
          PREMINTED_TOKEN: ${{ secrets.staging_access_token }}
          ASTRAL_STAGING_USERNAME: ${{ secrets.staging_username || secrets.ASTRAL_STAGING_USERNAME }}
          ASTRAL_STAGING_PASSWORD: ${{ secrets.staging_password || secrets.ASTRAL_STAGING_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:ASTRAL_STAGING_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:ASTRAL_STAGING_PASSWORD)) {
            # No credentials — carry the caller's pre-minted token through
            # unchanged. Byte-compatible with the previous behaviour.
            Write-Host "no staging credentials supplied; using the pre-minted token"
            "ASTRAL_WINDOWS_SMOKE_TOKEN=$env:PREMINTED_TOKEN" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          # Authority and client id come from the SAME release profile that is
          # baked into the exe, so CI can never authenticate against a different
          # realm than the client it is testing.
          $profile = Get-Content components\AstralProjection\windows-client\deployment\release-profile.json -Raw | ConvertFrom-Json
          $authority = $profile.authority
          $clientId = $profile.client_id
          if ([string]::IsNullOrWhiteSpace($authority) -or [string]::IsNullOrWhiteSpace($clientId)) {
            throw "release-profile.json is missing authority/client_id"
          }
          Write-Host "minting a staging token from $authority as client $clientId"
          $body = @{
            grant_type = 'password'
            client_id  = $clientId
            scope      = 'openid'
            username   = $env:ASTRAL_STAGING_USERNAME
            password   = $env:ASTRAL_STAGING_PASSWORD
          }
          try {
            $resp = Invoke-RestMethod -Method Post `
              -Uri "$authority/protocol/openid-connect/token" `
              -Body $body -ContentType 'application/x-www-form-urlencoded'
          } catch {
            # Never echo the response body — it can contain credential material.
            throw "minting the staging token failed: $($_.Exception.Message). Confirm the account exists and that Direct Access Grants are enabled for '$clientId'."
          }
          $token = $resp.access_token
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "the token endpoint returned no access_token"
          }
          # Mask before the value can reach any later log line, and keep it out
          # of step outputs/artifacts — it only ever travels through the env.
          Write-Host "::add-mask::$token"
          "ASTRAL_WINDOWS_SMOKE_TOKEN=$token" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "minted a fresh staging token (expires_in=$($resp.expires_in)s)"

      - name: Run frozen worker, no-dialog, rendered-chat, offline, and termination smoke
        shell: pwsh
        env:
          ASTRAL_WINDOWS_EXE: ${{ github.workspace }}\components\AstralProjection\windows-client\dist\AstralDeep.exe
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # The candidate bytes were built above from the pristine release
          # environment. Test-only packages enter that environment only now,
          # from the separate complete hash lock, so they cannot affect the exe.
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pip install --require-hashes -r tooling\python-ci\requirements.lock.txt
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pytest `
            components\AstralProjection\windows-client\tests\test_packaged_release.py -q `
            --junitxml=build\windows-candidate\packaged-release.junit.xml

      # The connected GUI smokes report ONLY through a JSON file written by the
      # frozen exe (status + detail_code); pytest sees a bare exit code, and the
      # archive steps below are skipped on failure. Without this, a smoke failure
      # is undiagnosable from the logs — which is exactly where this build stalled.
      # These reports are already redacted at the source (write_redacted_report)
      # and the smoke token is masked, so echoing them leaks nothing.
      - name: Explain a smoke failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $roots = @(
            (Join-Path $env:TEMP 'pytest-of-runneradmin'),
            (Join-Path $PWD 'build\windows-candidate')
          )
          $found = $false
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem -Path $root -Recurse -Filter '*.json' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'smoke|deployment-validation' } |
              ForEach-Object {
                $found = $true
                Write-Host "===== $($_.FullName) ====="
                Get-Content $_.FullName -Raw
                Write-Host ""
              }
          }
          if (-not $found) {
            Write-Host "no smoke report was written — the exe exited before it could report"
          }
          $junit = 'build\windows-candidate\packaged-release.junit.xml'
          if (Test-Path $junit) {
            Write-Host "===== failing testcases ====="
            Select-Xml -Path $junit -XPath '//testcase[failure or error]' |
              ForEach-Object { Write-Host $_.Node.name }
          }

      - name: Run full Windows source suite with coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python -m pytest components\AstralProjection\windows-client\tests -q `
            --cov=components/AstralProjection/windows-client `
            --cov-report=xml:build\windows-candidate\windows-coverage.xml `
            --junitxml=build\windows-candidate\windows-source.junit.xml

      - name: Bind executable to source, profile, runtime, and lock
        id: identity
        shell: pwsh
        env:
          ARTIFACT_NAME: windows-unsigned-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py artifact-manifest `
            --executable components\AstralProjection\windows-client\dist\AstralDeep.exe `
            --profile components\AstralProjection\windows-client\deployment\release-profile.json `
            --runtime-manifest components\AstralProjection\windows-client\deployment\runtime-manifest.json `
            --requirements-input components\AstralProjection\windows-client\requirements.in `
            --lock components\AstralProjection\windows-client\requirements-release.lock.txt `
            --source-sha $env:CANDIDATE_SHA `
            --run-id "${{ github.run_id }}" `
            --run-attempt "${{ github.run_attempt }}" `
            --artifact-name $env:ARTIFACT_NAME `
            --output build\windows-candidate\candidate-manifest.json
          $manifest = Get-Content build\windows-candidate\candidate-manifest.json -Raw | ConvertFrom-Json
          "artifact_name=$env:ARTIFACT_NAME" >> $env:GITHUB_OUTPUT
          "executable_sha256=$($manifest.executable_sha256)" >> $env:GITHUB_OUTPUT
          Copy-Item components\AstralProjection\windows-client\dist\AstralDeep.exe build\windows-candidate\AstralDeep.exe

      # actions/upload-artifact v4, pinned to immutable action bytes.
      - name: Archive the exact matrix-input executable and provenance
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: build/windows-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record immutable Actions artifact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & components\AstralProjection\windows-client\.venv-release-a\Scripts\python scripts\windows_release_candidate.py artifact-reference `
            --manifest build\windows-candidate\candidate-manifest.json `
            --artifact-id "${{ steps.upload.outputs.artifact-id }}" `
            --artifact-digest "${{ steps.upload.outputs.artifact-digest }}" `
            --output build\windows-candidate-reference.json

      - name: Archive the artifact reference receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-candidate-reference.json
          if-no-files-found: error
          retention-days: 14
