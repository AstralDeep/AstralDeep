# Uploads only the iPhone app and its embedded Watch app using qualified source-bound inputs.
name: Upload iPhone App Store build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version for both iPhone and Watch
        required: true
        type: string
      build:
        description: Integer 1..9999 exceeding every uploaded iOS build (checked against App Store Connect)
        required: true
        type: string
      producer_run_id:
        description: Successful main release-macos workflow run with unchanged Projection and Kernel sources
        required: true
        type: string
      artifact_id:
        description: Source-bound macos-apple-artifacts artifact ID from that run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iphone-app-store-upload
  cancel-in-progress: false

env:
  PROJECT: components/AstralProjection/apple-clients/AstralApp/AstralApp.xcodeproj
  SCHEME: AstralApp

jobs:
  gate:
    name: Verify native qualification and framework provenance
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved producer and exact source qualification
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          python3 scripts/ios_store_upload.py producer --run-id "$PRODUCER_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" --receipt "$RUNNER_TEMP/producer.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-producer-receipt
          path: ${{ runner.temp }}/producer.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign, validate and upload iPhone with embedded Watch
    needs: gate
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (needs.gate.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-publisher
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install App Store API dependencies
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ios-release.txt
      - name: Select exact Xcode 26.6 (17F113)
        run: bash components/AstralKernel/scripts/select-xcode.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-producer-receipt
          path: ${{ runner.temp }}/evidence
      - name: Restore provider- and source-verified Apple framework
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/apple-input.zip"
          python3 scripts/ios_store_upload.py restore --input "$RUNNER_TEMP/apple-input.zip" \
            --receipt "$RUNNER_TEMP/evidence/producer.json" \
            --destination components/AstralProjection/apple-clients/AstralKernel
          python3 components/AstralKernel/scripts/artifact_manifest.py verify \
            --root components/AstralProjection/apple-clients/AstralKernel/Artifacts \
            --kind apple --expected-source "$(git -C components/AstralKernel rev-parse HEAD)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('components/AstralProjection/apple-clients/AstralKernel/Artifacts/apple-build-manifest.json').read_text())
          assert manifest['toolchain']['xcode'] == 'Xcode 26.6\nBuild version 17F113'
          assert manifest['toolchain']['rustc'].startswith('rustc 1.99.1 ')
          PY
      - name: Require signing and App Store material
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_PROFILE_IOS: ${{ secrets.APPLE_PROFILE_IOS }}
          APPLE_PROFILE_WATCH: ${{ secrets.APPLE_PROFILE_WATCH }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_CERT_PASSWORD \
            APPLE_PROVISION_PROFILE_BASE64 APPLE_PROFILE_IOS APPLE_PROFILE_WATCH ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [[ -n "${!name}" ]] || { echo "::error::Missing $name"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Refuse colliding or nonmonotonic iOS build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 scripts/ios_store_upload.py preflight --version "$VERSION" --build "$BUILD" \
            --input "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            --receipt "$RUNNER_TEMP/evidence/app-store-preflight.json"
      - name: Import Apple Distribution identity into ephemeral keychain
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/astral-ios-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/ios-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution:'
      - name: Install only matching iPhone and Watch distribution profiles
        env:
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROFILE_IOS: ${{ secrets.APPLE_PROFILE_IOS }}
          APPLE_PROFILE_WATCH: ${{ secrets.APPLE_PROFILE_WATCH }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profiles.blob"
          python3 scripts/ios_store_upload.py profiles --input "$RUNNER_TEMP/profiles.blob" \
            --destination "$HOME/Library/MobileDevice/Provisioning Profiles" \
            --receipt "$RUNNER_TEMP/evidence/producer.json"
          python3 components/AstralProjection/apple-clients/Scripts/render_export_options.py \
            components/AstralProjection/apple-clients/ExportOptions-ios.plist "$RUNNER_TEMP/ExportOptions-ios.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions-ios.plist"
      - name: Archive and export iPhone with embedded Watch
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROFILE_IOS: ${{ secrets.APPLE_PROFILE_IOS }}
          APPLE_PROFILE_WATCH: ${{ secrets.APPLE_PROFILE_WATCH }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/candidate-sha.txt"
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/AstralDeep-ios.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            ASTRAL_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            ASTRAL_PROFILE_IOS="$APPLE_PROFILE_IOS" ASTRAL_PROFILE_WATCH="$APPLE_PROFILE_WATCH"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AstralDeep-ios.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-ios" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-ios.plist"
          ipas=("$RUNNER_TEMP/export-ios/"*.ipa)
          [[ ${#ipas[@]} -eq 1 && -f "${ipas[0]}" ]]
          mkdir -p "$RUNNER_TEMP/ipa-check"
          ditto -x -k "${ipas[0]}" "$RUNNER_TEMP/ipa-check"
          python3 scripts/ios_store_upload.py verify-app \
            --input "$RUNNER_TEMP/ipa-check/Payload/AstralDeep.app" --version "$VERSION" --build "$BUILD" \
            --receipt "$RUNNER_TEMP/evidence/producer.json"
          cp "${ipas[0]}" "$RUNNER_TEMP/evidence/AstralDeep-$VERSION-$BUILD.ipa"
          cp "$RUNNER_TEMP/ExportOptions-ios.plist" "$RUNNER_TEMP/evidence/ExportOptions-ios.plist"
          (cd "$RUNNER_TEMP/evidence" && shasum -a 256 ./*.ipa > SHA256SUMS)
          echo "IPA=$RUNNER_TEMP/evidence/AstralDeep-$VERSION-$BUILD.ipa" >> "$GITHUB_ENV"
      - name: Validate then upload the exact verified iPhone IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash components/AstralProjection/apple-clients/Scripts/altool_strict.sh 'validate iPhone' \
            --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/evidence/validation-receipt.txt"
          bash components/AstralProjection/apple-clients/Scripts/altool_strict.sh 'upload iPhone' \
            --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/evidence/upload-receipt.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ios-app-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ios-cert.p12" "$RUNNER_TEMP/profiles.blob" "$RUNNER_TEMP"/decoded-profile-*.mobileprovision
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/astral-ios-"*.mobileprovision
          if [[ -f "$RUNNER_TEMP/astral-ios-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/astral-ios-signing.keychain-db"
          fi
