name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable reviewed PR base for non-production changed-code qualification
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend-image:
    name: Clean backend production image build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Verify the exact composed sources before building
        run: |
          set -euo pipefail
          python scripts/verify_composition.py --root .
          python scripts/install_local_components.py validate --root . --require-gitlinks
      - name: Build a clean production image containing the pinned browser client
        run: |
          set -euo pipefail
          mkdir -p build/backend-web
          docker build --pull --no-cache --file Dockerfile \
            --iidfile build/backend-web/image-id.txt \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" .
      - name: Save the one immutable candidate image for the independent gates
        run: |
          set -euo pipefail
          docker save "$(cat build/backend-web/image-id.txt)" | gzip > build/backend-web/image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image
          path: |
            build/backend-web/image-id.txt
            build/backend-web/image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  backend-boot:
    name: Development and fail-closed production boot smoke
    needs: [backend-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: build/backend-web
      - name: Load and probe the exact built artifact
        run: |
          set -euo pipefail
          docker load --input build/backend-web/image.tar.gz
          test "$(docker image inspect "$(cat build/backend-web/image-id.txt)" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$(git rev-parse HEAD)"
          rm build/backend-web/image.tar.gz
          bash scripts/backend_web_image_gate.sh "$(cat build/backend-web/image-id.txt)" boot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-boot-evidence
          path: |
            build/backend-web/boot*
            build/backend-web/image-id.txt
          if-no-files-found: error
          retention-days: 14

  backend-web:
    name: Python 3.11 complete backend and isolated PostgreSQL
    needs: [backend-image]
    runs-on: ubuntu-24.04
    # Observed complete-root diagnostic: 35 minutes at 32%; catalogue
    # verification is CPU-bound. Keep all tests and leave time for modules.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: build/backend-web
      - name: Load and test the exact built artifact
        run: |
          set -euo pipefail
          docker load --input build/backend-web/image.tar.gz
          test "$(docker image inspect "$(cat build/backend-web/image-id.txt)" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$(git rev-parse HEAD)"
          rm build/backend-web/image.tar.gz
          bash scripts/backend_web_image_gate.sh "$(cat build/backend-web/image-id.txt)" tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-web-test-evidence
          path: build/backend-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  projection-backend-web:
    name: Pinned Projection Python and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRALDEEP_SOURCE_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: components/AstralProjection/tooling/web-ci/package-lock.json
      - name: Install isolated Python tooling and the exact composed Primitives source
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r components/AstralProjection/tooling/python-ci/requirements.lock.txt
          python -m pip install --no-deps components/AstralPrimitives
      - name: Lint and test all Projection backend Python
        working-directory: components/AstralProjection
        run: |
          set -euo pipefail
          ruff check src backend tests scripts
          python -m pytest -q -ra -p no:cacheprovider \
            --cov=astralprojection --cov=rote --cov=webrender --cov-branch \
            --cov-report=xml:build/backend-web/projection-python.xml \
            --junitxml=build/backend-web/projection-tests.xml
      - name: Enforce changed Projection Python against the baseline component
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          base_component="$(git ls-tree "$BASE_SHA" components/AstralProjection | awk '{print $3}')"
          [[ "$base_component" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$base_component" == "$(git -C components/AstralProjection rev-parse HEAD)" ]]; then
            echo "Projection Python changed coverage is not applicable: the exact component is unchanged."
            exit 0
          fi
          git -C components/AstralProjection fetch origin "$base_component"
          cd components/AstralProjection
          diff-cover build/backend-web/projection-python.xml \
            --compare-branch "$base_component" --diff-range-notation '..' --fail-under=90
      - name: Install and lint exact browser tooling
        working-directory: components/AstralProjection/tooling/web-ci
        run: |
          set -euo pipefail
          test "$(corepack npm --version)" = "11.16.0"
          corepack npm ci --ignore-scripts
          corepack npm run check:package-manager
          mkdir -p ../../build/backend-web/node-v8
          export NODE_V8_COVERAGE="$GITHUB_WORKSPACE/components/AstralProjection/build/backend-web/node-v8"
          corepack npm run check:product-isolation
          corepack npm run test:product-isolation
          corepack npm run lint
          corepack npm run test:coverage-conversion
          corepack npm run test:coverage-conversion:node
          corepack npm run test:coverage-union
          corepack npm run test:coverage-conversion:browser-cli
      - name: Exercise the public offline worker and retain its exact coverage
        working-directory: components/AstralProjection
        run: |
          set -euo pipefail
          mkdir -p build/backend-web/offline-v8
          NODE_V8_COVERAGE="$PWD/build/backend-web/offline-v8" \
            node --test tooling/web-ci/tests/offline-worker-088.test.mjs
          node tooling/web-ci/coverage-conversion-cli.mjs \
            --node-v8-directory build/backend-web/offline-v8 --repo-root "$PWD" \
            --output build/backend-web/offline-javascript.json
      - name: Render server-owned browser fixtures and run all ordinary browser suites
        working-directory: components/AstralProjection
        run: |
          set -euo pipefail
          mkdir -p build/079/browser-fixtures build/backend-web
          for mode in create revise detail expired error; do
            python tooling/web-ci/fixtures/persistent-agents-079.py "$mode" > "build/079/browser-fixtures/$mode.json"
          done
          image="$(tr -d '\r\n' < tooling/web-ci/playwright-image.txt)"
          docker run --rm --init --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env ASTRAL_ASSIGNMENT_FIXTURE_DIR=/workspace/build/079/browser-fixtures \
            --env ASTRAL_EXPORT_COVERAGE_OUTPUT=/workspace/build/backend-web/export-javascript.json \
            --env ASTRAL_ALL_CLIENT_COVERAGE_DIR=/workspace/build/backend-web/client-v8 \
            --volume "$PWD:/workspace" --workdir /workspace/tooling/web-ci "$image" \
            /bin/bash -euc 'corepack npm run test:coverage-conversion:browser
              corepack npm exec -- playwright test tests/continuity-contract-060.spec.js tests/voice-conversation-065.spec.js tests/persistent-agents-079.spec.js tests/offline-worker-088.spec.js tests/canvas-review-088.spec.js tests/native-export-088.spec.js tests/work-reads-088.spec.js tests/guidance-notes-088.spec.js tests/workspace-topbar-088.spec.js tests/native-chart-088.spec.js tests/first-task-088.spec.js tests/selection-088.spec.js --browser=chromium --workers=1'
      - name: Verify responsive and enlarged-text interactions in all three browser engines
        working-directory: components/AstralProjection
        run: |
          set -euo pipefail
          image="$(tr -d '\r\n' < tooling/web-ci/playwright-image.txt)"
          docker run --rm --init --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/workspace" --workdir /workspace/tooling/web-ci "$image" \
            node node_modules/@playwright/test/cli.js test tests/first-task-088.spec.js \
            --browser=all --workers=1
      - name: Union independent browser and Node observations against exact candidate sources
        working-directory: components/AstralProjection
        run: |
          set -euo pipefail
          export NODE_V8_COVERAGE="$PWD/build/backend-web/node-v8"
          browser_inputs=()
          for suite in continuity-contract-060 first-task-088 \
              persistent-agents-079 selection-088 guidance-notes-088 \
              work-reads-088 voice-conversation-065; do
            browser_inputs+=(--input "build/backend-web/client-v8/$suite.json")
          done
          node tooling/web-ci/browser-v8-cli.mjs --repo-root "$PWD" "${browser_inputs[@]}" \
            --output build/backend-web/browser-javascript.json
          node tooling/web-ci/coverage-conversion-cli.mjs \
            --node-v8-directory build/backend-web/node-v8 --repo-root "$PWD" \
            --output build/backend-web/node-interim.json
          unset NODE_V8_COVERAGE
          node tooling/web-ci/coverage-conversion-cli.mjs \
            --node-v8-directory build/backend-web/node-v8 --repo-root "$PWD" \
            --output build/backend-web/node-javascript.json
          node tooling/web-ci/coverage-union-cli.mjs \
            --node build/backend-web/node-javascript.json \
            --browser build/backend-web/browser-javascript.json \
            --offline-node build/backend-web/offline-javascript.json \
            --export-browser build/backend-web/export-javascript.json --repo-root "$PWD" \
            --output build/backend-web/javascript.json
      - name: Enforce strict backend and browser changed coverage without deferred native inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          base_component="$(git ls-tree "$BASE_SHA" components/AstralProjection | awk '{print $3}')"
          [[ "$base_component" =~ ^[a-f0-9]{40}$ ]]
          candidate_component="$(git -C components/AstralProjection rev-parse HEAD)"
          if [[ "$base_component" == "$candidate_component" ]]; then
            printf '{"status":"not-applicable","reason":"identical-component-commit","base_sha":"%s","candidate_sha":"%s"}\n' \
              "$base_component" "$candidate_component" \
              > components/AstralProjection/build/backend-web/changed-coverage.json
            exit 0
          fi
          python scripts/check_changed_coverage.py --repo components/AstralProjection \
            --event-name manual --base-sha "$base_component" \
            --candidate-sha "$candidate_component" \
            --repository-profile projection-web --coverage-mode strict \
            --projection-python components/AstralProjection/build/backend-web/projection-python.xml \
            --javascript components/AstralProjection/build/backend-web/javascript.json \
            --fail-under 90 --output components/AstralProjection/build/backend-web/changed-coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: projection-backend-web-test-evidence
          path: |
            components/AstralProjection/build/backend-web
            components/AstralProjection/tooling/web-ci/test-results
          if-no-files-found: error
          retention-days: 14

  plane-postgres:
    name: Exact Plane complete PostgreSQL suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ASTRALPLANE_TEST_POSTGRES_DSN: postgresql://astral:isolated_ci_only@127.0.0.1:5432/ad_gate_plane
      ASTRALDEEP_SOURCE_REPO: ${{ github.workspace }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
        env:
          POSTGRES_USER: astral
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ad_gate_plane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astral -d ad_gate_plane"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.11"
      - working-directory: components/AstralPlane
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --group ci
          uv run --frozen --group ci ruff check .
          uv run --frozen --group ci pytest -q -ra -p no:cacheprovider \
            --cov=astralplane --cov=scripts.import_staging_fixture \
            --cov=scripts.migrate_qualification_database --cov-branch \
            --cov-report=xml:build/backend-web/plane-python.xml \
            --junitxml=build/backend-web/plane-tests.xml --cov-fail-under=88.75
      - name: Enforce changed Plane Python against the baseline component
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          base_component="$(git ls-tree "$BASE_SHA" components/AstralPlane | awk '{print $3}')"
          [[ "$base_component" =~ ^[a-f0-9]{40}$ ]]
          candidate_component="$(git -C components/AstralPlane rev-parse HEAD)"
          if [[ "$base_component" == "$candidate_component" ]]; then
            printf '{"status":"not-applicable","reason":"identical-component-commit","base_sha":"%s","candidate_sha":"%s"}\n' \
              "$base_component" "$candidate_component" \
              > components/AstralPlane/build/backend-web/changed-coverage.json
            exit 0
          fi
          git -C components/AstralPlane fetch origin "$base_component"
          cd components/AstralPlane
          uv run --frozen --group ci diff-cover build/backend-web/plane-python.xml \
            --compare-branch "$base_component" --diff-range-notation '..' --fail-under=90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plane-postgres-evidence
          path: components/AstralPlane/build/backend-web
          if-no-files-found: error
          retention-days: 14

  backend-changed-coverage:
    name: Nonempty immutable changed Python coverage at least 90 percent
    needs: [backend-web, voice-worker-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-web-test-evidence
          path: build/backend-web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: voice-worker-coverage
          path: build/065/coverage
      - name: Enforce immutable event or reviewed PR-base comparison
        env:
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          revision_args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            revision_args=(--base-sha "$MANUAL_BASE_SHA" --candidate-sha "$GITHUB_SHA")
          fi
          python scripts/check_changed_coverage.py --repo . \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            "${revision_args[@]}" --repository-profile deep --coverage-mode strict \
            --backend-python build/backend-web/backend-python.xml \
            --tooling-python build/backend-web/tooling-python.xml \
            --voice-worker-python build/065/coverage/voice-worker.xml \
            --fail-under 90 --output build/backend-web/changed-coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-changed-coverage-decision
          path: build/backend-web/changed-coverage.json
          if-no-files-found: error

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/python-ci/requirements.lock.txt
      - name: Install hash-locked CI-only Python tooling
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Lint Deep-owned Python
        run: ruff check .

  ui-v2-contracts:
    name: Backend UI v2 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRAL_ENV: development
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: backend:components/AstralProjection/src:components/AstralProjection/backend:components/AstralProjection:components/AstralPlane/src:components/AstralPrimitives/src:components/LETS/src
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/ui-ci/requirements.lock.txt
      - name: Install the hash-locked UI contract test dependencies
        run: python -m pip install --require-hashes -r tooling/ui-ci/requirements.lock.txt
      - name: Check server chrome, selection, transcript, and routing contracts
        # These tests use deterministic fakes and never need user credentials,
        # a live model, or a database. Projection owns browser interaction tests.
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/test_client_js_contract.py \
            backend/tests/test_turn_selection_surface_089.py \
            backend/tests/test_typesafe_layout.py \
            backend/tests/test_typesafe_budget.py \
            backend/tests/test_typesafe_decision.py \
            backend/tests/test_typesafe_security.py \
            backend/tests/test_rail_parts_062.py \
            backend/tests/test_history_write_failures.py \
            backend/tests/chrome/test_topbar.py \
            backend/tests/test_chrome_events.py \
            backend/tests/test_voice_deployment_topology_065.py

  sdk:
    name: Astral SDK (built and tested outside the product image)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/python-ci/requirements.lock.txt
      - name: Install hash-locked CI-only Python tooling (ruff)
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Lint the SDK
        run: ruff check sdk
      - name: Confirm the SDK never enters the product image
        shell: bash
        run: |
          set -euo pipefail
          # Dockerfile's COPY list is explicit and enumerated (never a broad
          # `COPY . .`) — assert it names neither the sdk/ directory nor the
          # astral-sdk/astral_sdk distribution, and that the product's own
          # runtime manifest never depends on it (Constitution V).
          ! grep -E "^\s*COPY\s+.*\bsdk/" Dockerfile
          ! grep -Ei "astral[_-]sdk" backend/requirements.txt Dockerfile
      - name: Build the astral-sdk wheel
        run: |
          python -m pip install --upgrade build
          python -m build sdk
      - name: Install the built wheel into a clean venv and run its tests (no network)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/astral-sdk-venv
          /tmp/astral-sdk-venv/bin/pip install --upgrade pip
          wheel="$(ls sdk/dist/*.whl)"
          /tmp/astral-sdk-venv/bin/pip install "${wheel}[dev]"
          /tmp/astral-sdk-venv/bin/python -m pytest -q sdk/tests

  release-tooling-tests:
    needs: [backend-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/backend-ci/requirements.lock.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: build/backend-web
      - name: Load the exact backend dependency closure for release-tooling tests
        run: |
          set -euo pipefail
          docker load --input build/backend-web/image.tar.gz
          test "$(docker image inspect "$(cat build/backend-web/image-id.txt)" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$(git rev-parse HEAD)"
          rm build/backend-web/image.tar.gz
      - name: Test and cover Deep-owned release tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/060/coverage
          RELEASE_TOOL_TESTS=(
            backend/tests/test_changed_coverage_060.py
            backend/tests/test_release_tooling_coverage_060.py
            backend/tests/test_apple_coverage_artifacts_088.py
            backend/tests/test_native_xccov_domain_088.py
            backend/tests/test_merge_xccov_coverage_088.py
            backend/tests/test_documentation_060.py
            backend/tests/test_quickstart_commands.py
            backend/tests/test_python_ci_supply_chain_060.py
            backend/tests/test_android_next_major_canary.py
            backend/tests/test_candidate_staging_060.py
            backend/tests/test_release_evidence_validator.py
            backend/tests/test_prepare_release_evidence_060.py
            backend/tests/test_extract_release_artifact_060.py
            backend/tests/test_release_evidence_bootstrap.py
            scripts/tests/test_component_build_surfaces_074.py
            scripts/tests/test_backend_web_auth.py
            scripts/tests/test_backend_web_evidence.py
            scripts/tests/test_backend_web_functional.py
            scripts/tests/test_backend_web_gate.py
            scripts/tests/test_backend_web_producer.py
            scripts/tests/test_backend_web_qualification.py
            scripts/tests/test_backend_web_services.py
            scripts/tests/test_backend_web_state.py
            scripts/tests/test_install_local_components.py
            scripts/tests/test_retire_restored_sessions.py
            scripts/tests/test_verify_component_ownership.py
            scripts/tests/test_verify_composition.py
            scripts/tests/test_verify_migration_provenance.py
            scripts/tests/test_verify_primitive_coverage.py
            scripts/tests/test_verify_persistent_agents_079.py
            scripts/tests/test_csharp_native_coverage_079.py
          )
          test "${#RELEASE_TOOL_TESTS[@]}" -gt 0
          docker run --rm --init --cpus=2 --memory=4g \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PYTHON_DOTENV_DISABLED=1 --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace/backend:/workspace --env ASTRAL_ENV=development \
            --env COVERAGE_FILE=/workspace/build/060/coverage/.coverage \
            --volume "$PWD:/workspace" --workdir /workspace --entrypoint /bin/bash \
            "$(cat build/backend-web/image-id.txt)" -euc '
              python -m venv --system-site-packages /tmp/tooling
              /tmp/tooling/bin/python -m pip install --require-hashes -r tooling/backend-ci/requirements.lock.txt
              /tmp/tooling/bin/python -m coverage run --source=scripts \
                --omit=scripts/windows_release_candidate.py,scripts/export_work_contract.py \
                -m pytest "$@" -q \
                --deselect=backend/tests/test_documentation_060.py::test_byo_guide_is_reachable_from_projection_apple_client_docs \
                --deselect=backend/tests/test_python_ci_supply_chain_060.py::test_ci_only_python_manifest_cannot_enter_projection_product_artifacts \
                --deselect=scripts/tests/test_verify_composition.py::test_current_composition_has_exact_pins_canonical_urls_and_contracts \
                --deselect=scripts/tests/test_verify_composition.py::test_real_checkout_verification_executes_only_local_git_commands
              /tmp/tooling/bin/python -m coverage report --fail-under=90
              /tmp/tooling/bin/python -m coverage xml -o build/060/coverage/tooling-python.xml
            ' release-tooling "${RELEASE_TOOL_TESTS[@]}"
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-python-coverage
          path: build/060/coverage/tooling-python.xml
          if-no-files-found: error
          retention-days: 14

  component-contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/python-ci/requirements.lock.txt
      - name: Install hash-locked CI-only Python tooling
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Test source-free component contracts
        shell: bash
        run: |
          python -m pytest -q \
            scripts/tests/test_install_local_components.py \
            scripts/tests/test_verify_component_ownership.py \
            scripts/tests/test_verify_composition.py \
            scripts/tests/test_verify_migration_provenance.py \
            scripts/tests/test_verify_primitive_coverage.py \
            --deselect=scripts/tests/test_install_local_components.py::test_real_initialized_sources_match_the_declarations \
            --deselect=scripts/tests/test_verify_composition.py::test_current_composition_has_exact_pins_canonical_urls_and_contracts \
            --deselect=scripts/tests/test_verify_composition.py::test_real_checkout_verification_executes_only_local_git_commands

  composition-declarations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/python-ci/requirements.lock.txt
      - name: Install hash-locked CI-only Python tooling
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Prove exactly four uninitialized component gitlinks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t COMPONENT_GITLINKS < <(
            git ls-files --stage -- \
              components/AstralPlane \
              components/AstralPrimitives \
              components/AstralProjection \
              components/LETS
          )
          test "${#COMPONENT_GITLINKS[@]}" -eq 4
          printf '%s\n' "${COMPONENT_GITLINKS[@]}" \
            | awk '$1 != "160000" { exit 1 } END { if (NR != 4) exit 1 }'
          mapfile -t COMPONENT_STATUS < <(git submodule status --recursive)
          test "${#COMPONENT_STATUS[@]}" -eq 4
          if printf '%s\n' "${COMPONENT_STATUS[@]}" \
            | grep -Ev '^-([0-9a-f]{40}) components/(AstralPlane|AstralPrimitives|AstralProjection|LETS)( |$)'; then
            exit 1
          fi
      - name: Validate exact public composition declarations
        run: >-
          python scripts/install_local_components.py validate
          --root . --declarations-only --require-gitlinks

  voice-worker-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the voice-worker runtime and test images
        run: |
          set -euo pipefail
          test -f Dockerfile.voice.dockerignore
          mkdir -p build/065/coverage
          candidate="$(git rev-parse HEAD)"
          docker build --pull --no-cache \
            --file Dockerfile.voice \
            --target runtime \
            --label "org.opencontainers.image.revision=$candidate" \
            --iidfile build/065/coverage/voice-runtime-image-id.txt \
            .
          docker build \
            --file Dockerfile.voice \
            --target test \
            --label "org.opencontainers.image.revision=$candidate" \
            --iidfile build/065/coverage/voice-test-image-id.txt \
            .
          docker image inspect "$(cat build/065/coverage/voice-runtime-image-id.txt)" \
            > build/065/coverage/voice-runtime-image.json
          docker image inspect "$(cat build/065/coverage/voice-test-image-id.txt)" \
            > build/065/coverage/voice-test-image.json
      - name: Run the isolated voice-worker suite with Cobertura coverage
        run: |
          set -euo pipefail
          mkdir -p build/065/coverage
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e COVERAGE_FILE=/tmp/.coverage \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/build/065/coverage:/coverage" \
            --entrypoint /bin/sh \
            "$(cat build/065/coverage/voice-test-image-id.txt)" \
            -ec '
              /opt/voice-test-venv/bin/python -m coverage run \
                --source=voice_agent \
                --omit="*/voice_agent/tests/*" \
                -m pytest voice_agent/tests -q -p no:cacheprovider \
                --junitxml=/coverage/voice-worker-tests.xml
              /opt/voice-test-venv/bin/python -m coverage xml \
                -o /coverage/voice-worker.xml
              /opt/voice-test-venv/bin/python -m coverage report \
                --fail-under=90
              /opt/voice-test-venv/bin/python -c \
                "from xml.etree import ElementTree; root = ElementTree.parse(\"/coverage/voice-worker.xml\").getroot(); assert root.tag == \"coverage\"; statements = int(root.attrib[\"lines-valid\"]); rate = float(root.attrib[\"line-rate\"]); assert statements > 0 and rate >= 0.90"
            '
          test -s build/065/coverage/voice-worker.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-worker-coverage
          path: build/065/coverage/
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_root="$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          test "$("$install_root/gitleaks" version)" = "$GITLEAKS_VERSION"
          echo "$install_root" >> "$GITHUB_PATH"
      - name: Scan the complete Git history without repository secrets
        run: >-
          gitleaks git --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml"
          --gitleaks-ignore-path "$GITHUB_WORKSPACE/.gitleaksignore"
          --log-opts="--all" "$GITHUB_WORKSPACE"

  gates:
    name: Deep owner CI aggregate
    if: always()
    needs:
      - backend-image
      - backend-boot
      - backend-web
      - projection-backend-web
      - plane-postgres
      - backend-changed-coverage
      - lint
      - ui-v2-contracts
      - sdk
      - release-tooling-tests
      - component-contract-tests
      - composition-declarations
      - voice-worker-test
      - secret-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce every hosted owner gate
        run: |
          [[ '${{ needs.backend-image.result }}' == 'success' ]]
          [[ '${{ needs.backend-boot.result }}' == 'success' ]]
          [[ '${{ needs.backend-web.result }}' == 'success' ]]
          [[ '${{ needs.projection-backend-web.result }}' == 'success' ]]
          [[ '${{ needs.plane-postgres.result }}' == 'success' ]]
          [[ '${{ needs.backend-changed-coverage.result }}' == 'success' ]]
          [[ '${{ needs.lint.result }}' == 'success' ]]
          [[ '${{ needs.ui-v2-contracts.result }}' == 'success' ]]
          [[ '${{ needs.sdk.result }}' == 'success' ]]
          [[ '${{ needs.release-tooling-tests.result }}' == 'success' ]]
          [[ '${{ needs.component-contract-tests.result }}' == 'success' ]]
          [[ '${{ needs.composition-declarations.result }}' == 'success' ]]
          [[ '${{ needs.voice-worker-test.result }}' == 'success' ]]
          [[ '${{ needs.secret-scan.result }}' == 'success' ]]
          echo "Backend/web CI passed. Native qualification is deferred; protected real-authentication, LETS-enforce, migration and recovery staging remain required before release."
