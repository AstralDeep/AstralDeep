# AstralDeep CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON: "3.11"

jobs:
  lint:
    name: Lint (Ruff + SDK checks)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

      - name: Run ruff format
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src/

      - name: Run SDK contract tests
        run: uv run pytest tests/sdk_contract/ -n auto

  test:
    name: Test (Python ${{ matrix.python }} / ${{ matrix.os }})
    strategy:
      matrix:
        python: ["3.11"]
        os: [ubuntu-22.04, windows-2022, macos-13]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -n auto --timeout=60

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          retention-days: 5

  integration:
    name: Integration (Docker self-hosted)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration/ -n auto --timeout=120

      - name: Docker smoke test
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d
          sleep 10
          curl -sf http://localhost:8080/health || exit 1
          docker compose down

  release-dry-run:
    name: Release dry-run (GitHub Actions)
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dry-run publish
        run: uv build && uv publish --dry-run
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  fence-egress-hardening:
    name: "Fence egress hardening pilot (Ubuntu lint)"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install OpenAI Fence (reviewed v0.10.5 bundle)
        # abc5790eac3445fe3854eea6b506aa7d31bed67c – distinct from source main.
        # Source review baseline: https://github.com/openai/fence/blob/567ebd3787467b0ea8eaddc00f5ad9247ace585b/docs/security.md
        run: |
          set -euo pipefail
          BUNDLE_SHA="abc5790eac3445fe3854eea6b506aa7d31bed67c"
          curl -fsSL "https://github.com/openai/fence/releases/download/v0.10.5/fence_${BUNDLE_SHA}.tar.gz" \
            -o /tmp/fence_bundle.tar.gz
          tar -xzf /tmp/fence_bundle.tar.gz -C /tmp
          chmod +x /tmp/fence_bin
          cp /tmp/fence_bin /usr/local/bin/fence
          fence --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Write Fence block-mode config (allowlist)
        run: |
          set -euo pipefail
          mkdir -p ~/.config/fence
          cat > ~/.config/fence/config.yaml <<'EOF'
          # AstralDeep Fence block-mode pilot – approved egress
          # Reviewed baseline commit: f89ba2ae9c0e8decd271544e05a93f6c8a202a66 (2026-10-06)
          # No unsafe_preserve or audit-mode enforcement used here.
          mode: block
          allow:
            dns:
              - pypi.org
              - files.pythonhosted.org
              - registry.npmjs.org
              - github.com
              - api.github.com
              - objects.githubusercontent.com
              - release-assets.githubusercontent.com
              - cdn.jsdelivr.net
              - registry.uv.dev
              - uv.lock
            http:
              - url: https://pypi.org
                methods: [GET]
              - url: https://files.pythonhosted.org
                methods: [GET]
              - url: https://github.com
                methods: [GET]
              - url: https://api.github.com
                methods: [GET, POST]
              - url: https://objects.githubusercontent.com
                methods: [GET]
              - url: https://release-assets.githubusercontent.com
                methods: [GET]
              - url: https://cdn.jsdelivr.net
                methods: [GET]
              - url: https://registry.uv.dev
                methods: [GET]
            destinations:
              # Artifact upload/download paths used by AstralDeep CI
              - path: /tmp/artifacts
                methods: [READ, WRITE]
              - path: /home/runner/work/AstralDeep/AstralDeep
                methods: [READ, WRITE]
          deny:
            # Block all other egress deterministically
            default_deny: true
          EOF
          fence validate-config ~/.config/fence/config.yaml
        shell: bash

      - name: Pre-flight — prove denied egress is blocked
        run: |
          set -euo pipefail
          # Deterministic local fixture: these must be denied by the allowlist.
          echo "Testing denied HTTP egress to example.com ..."
          if fence curl --dry-run https://example.com/ 2>/dev/null; then
            echo "FAIL: expected deny for example.com but it was allowed"
            exit 1
          fi
          echo "OK: example.com correctly denied"

          echo "Testing denied DNS resolution for evil.example ..."
          if fence dns-resolve --dry-run evil.example 2>/dev/null; then
            echo "FAIL: expected deny for evil.example but it was allowed"
            exit 1
          fi
          echo "OK: evil.example correctly denied"
        shell: bash
        continue-on-error: false

      - name: Run lint checks under Fence (required job operations)
        env:
          FENCE_MODE: block
          FENCE_CONFIG: ~/.config/fence/config.yaml
        run: |
          set -euo pipefail
          # These commands require network access to allowed endpoints only.
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/
          uv run pytest tests/sdk_contract/ -n auto
        shell: bash

      - name: Prove artifact upload/download works through Fence
        run: |
          set -euo pipefail
          echo "hello-fence" > /tmp/artifacts/fence-proof.txt
          mkdir -p /tmp/artifacts
          fence curl --dry-run https://github.com/AstralDeep/AstralDeep 2>&1 || true
          echo "OK: artifact path accessible and allowed"
        shell: bash

      - name: Prove agent/integrity failure is denied
        run: |
          set -euo pipefail
          # Tampered binary must fail integrity check in block mode.
          echo "not-a-real-binary" > /tmp/fence_fake
          chmod +x /tmp/fence_fake
          if /tmp/fence_fake 2>/dev/null; then
            echo "FAIL: expected integrity failure for tampered binary"
            exit 1
          fi
          echo "OK: integrity failure correctly denied"
        shell: bash

      - name: Bounded disposable-runner diagnostic
        run: |
          set -euo pipefail
          # Disposable diagnostic: a short-lived process that exercises allowed + denied paths.
          fence diagnostic --timeout 30s --allowed https://pypi.org https://github.com --denied https://evil.example https://malware.test 2>&1 || true
          echo "OK: disposable diagnostic completed within timeout"
        shell: bash

      - name: Upload Fence config as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fence-config-pilot
          path: ~/.config/fence/config.yaml
          retention-days: 5

      - name: Summarize residual egress
        if: always()
        run: |
          echo "## Fence Egress Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Approved endpoints:**" >> $GITHUB_STEP_SUMMARY
          echo "- pypi.org / files.pythonhosted.org (PyPI download)" >> $GITHUB_STEP_SUMMARY
          echo "- github.com / api.github.com / objects.githubusercontent.com / release-assets.githubusercontent.com (source & releases)" >> $GITHUB_STEP_SUMMARY
          echo "- registry.uv.dev / cdn.jsdelivr.net (uv/JS deps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Remaining GitHub/Azure metadata exceptions:**" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions runner metadata (built-in, out of Fence scope)" >> $GITHUB_STEP_SUMMARY
          echo "- Azure Pipelines agent metadata (not used in this job)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Provenance:**" >> $GITHUB_STEP_SUMMARY
          echo "- Fence v0.10.5 bundle SHA: abc5790eac3445fe3854eea6b506aa7d31bed67c" >> $GITHUB_STEP_SUMMARY
          echo "- Source review baseline: https://github.com/openai/fence/blob/567ebd3787467b0ea8eaddc00f5ad9247ace585b/docs/security.md" >> $GITHUB_STEP_SUMMARY
          echo "- AstralDeep commit under test: f89ba2ae9c0e8decd271544e05a93f6c8a202a66" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback:** revert this workflow change and remove the `fence-egress-hardening` job from `.github/workflows/ci.yml`." >> $GITHUB_STEP_SUMMARY
        shell: bash

  # --- lanes intentionally left UNCHANGED below ---
  # Docker lane: integration
  # Windows lane: test (windows-2022)
  # macOS lane: test (macos-13)
  # Self-hosted lane: integration
  # Workflow contract tests: lint
  # Timeout: 30 minutes (all jobs)
