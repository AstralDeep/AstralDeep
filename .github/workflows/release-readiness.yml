# Spec 060 (T107/T119) — the same-candidate release-readiness evidence matrix.
# One staging deployment (stage-deploy, left running) feeds eight platform
# evidence producers that all test the SAME candidate SHA and the SAME staged
# artifacts; the protected trusted builder attests reconstructed identities;
# the protected-decision job re-validates everything with the PINNED policy
# copy and emits and attests the only trusted release decision. Candidate-facing
# jobs are read-only; only the trusted-builder call and protected-decision job
# receive narrowly scoped OIDC/attestation authority.
#
# This protected executor produces candidate-bound evidence, but a workflow_run
# job attaches to the default-branch SHA. It is not itself a PR required check;
# activation remains blocked until an exact required-workflow control is
# available and installed by the repository owner.
name: release-readiness

run-name: release-readiness ${{ inputs.request_id }}

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit every producer must test
        required: true
        type: string
      base_sha:
        description: Verified comparison base for the changed-code gate
        required: true
        type: string
      source_run_id:
        description: Successful candidate CI run that owns build and coverage artifacts
        required: true
        type: string
      request_id:
        description: Unique request id embedded in the run-name
        required: false
        type: string
        default: ""
permissions:
  contents: read

concurrency:
  # One labeled host owns fixed WSS/ICE/TURN listeners. Different candidates
  # must never overlap or probe/clean each other's media namespace.
  group: release-readiness-staging
  cancel-in-progress: false

jobs:
  # ── The staged image is the EXACT ci.yml build artifact pushed under an
  #    immutable digest-qualified reference — never rebuilt. On dispatch the
  #    candidate tag must already exist from a prior ci.yml call. This job is
  #    the only packages-write authority in the pipeline. ──
  publish-candidate:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    outputs:
      candidate_image: ${{ steps.digest.outputs.candidate_image }}
      voice_worker_image: ${{ steps.digest.outputs.voice_worker_image }}
      livekit_image: ${{ steps.digest.outputs.livekit_image }}
    steps:
      - name: Verify the exact successful candidate CI run before accepting artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          python3 - <<'PY'
          import json, os, pathlib, re

          run = json.loads(pathlib.Path("/tmp/source-run.json").read_text(encoding="utf-8"))
          pulls = run.get("pull_requests")
          if (
              str(run.get("id")) != os.environ["SOURCE_RUN_ID"]
              or run.get("name") != "CI"
              or run.get("path") != ".github/workflows/ci.yml"
              or run.get("event") != "pull_request"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("head_sha") != os.environ["CANDIDATE_SHA"]
              or run.get("head_repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]
              or not isinstance(pulls, list)
              or len(pulls) != 1
              or pulls[0].get("base", {}).get("sha") != os.environ["BASE_SHA"]
              or not re.fullmatch(r"[0-9a-f]{40}", os.environ["CANDIDATE_SHA"])
              or not re.fullmatch(r"[0-9a-f]{40}", os.environ["BASE_SHA"])
          ):
              raise SystemExit("source run is not the exact successful protected CI candidate")
          PY
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the shared-run image under the immutable candidate tag
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
          path: /tmp
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download the shared-run voice-worker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: voice-worker-image
          path: /tmp
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Load, tag, and push the exact built images
        run: |
          set -euo pipefail
          docker load -i /tmp/astraldeep.tar
          docker load -i /tmp/astraldeep-voice-worker.tar
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag astraldeep:ci "ghcr.io/$REPO_LC:candidate-${{ inputs.candidate_sha }}"
          docker tag astraldeep-voice-worker:ci \
            "ghcr.io/$REPO_LC/voice-worker:candidate-${{ inputs.candidate_sha }}"
          docker push "ghcr.io/$REPO_LC:candidate-${{ inputs.candidate_sha }}"
          docker push "ghcr.io/$REPO_LC/voice-worker:candidate-${{ inputs.candidate_sha }}"
      - name: Resolve the immutable candidate and media image digests
        id: digest
        run: |
          set -euo pipefail
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="ghcr.io/$REPO_LC:candidate-${{ inputs.candidate_sha }}"
          VOICE_TAG="ghcr.io/$REPO_LC/voice-worker:candidate-${{ inputs.candidate_sha }}"
          LIVEKIT_IMAGE="livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1"
          if ! DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}'); then
            echo "::error::no candidate image for ${{ inputs.candidate_sha }} — run the ci.yml build (which calls this workflow) for the candidate first" >&2
            exit 1
          fi
          if ! VOICE_DIGEST=$(docker buildx imagetools inspect "$VOICE_TAG" --format '{{.Manifest.Digest}}'); then
            echo "::error::no voice-worker image for ${{ inputs.candidate_sha }} — run the blocking voice-worker-test lane first" >&2
            exit 1
          fi
          LIVEKIT_DIGEST=$(docker buildx imagetools inspect \
            "$LIVEKIT_IMAGE" --format '{{.Manifest.Digest}}')
          test "$LIVEKIT_DIGEST" = \
            "sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1"
          echo "candidate_image=ghcr.io/$REPO_LC@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "voice_worker_image=ghcr.io/$REPO_LC/voice-worker@$VOICE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "livekit_image=$LIVEKIT_IMAGE" >> "$GITHUB_OUTPUT"

  # ── Qualifying staging deployment.
  #    IMPORTANT: this job requires an EXTERNAL, persistent staging host that
  #    stays reachable at ASTRAL_STAGING_ENDPOINT for the WHOLE matrix — the
  #    Windows/Android/Apple/web producers each run on their own fresh runner
  #    and must reach the same deployment. A GitHub-hosted runner's local stack
  #    is torn down when this job ends, so it cannot host the shared endpoint by
  #    itself. The originally intended host was a dedicated persistent staging
  #    runner; the project has decided NOT to provision one ("won't set up"), so
  #    this qualifying matrix stays INACTIVE (vars.RELEASE_READINESS_ACTIVE is
  #    not 'true') and tasks T111/T125/T128 are deferred until an external
  #    staging host + ASTRAL_STAGING_ENDPOINT exist. The local pre-push
  #    diagnostic (scripts/prepare_release_evidence.py) needs none of this.
  #    Env gate mirrors scripts/run_candidate_staging.py::_required_environment.
  stage-deploy:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: publish-candidate
    runs-on: [self-hosted, astral-staging]
    environment: release-readiness-staging
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      ASTRAL_STAGING_RUNNER_TRUSTED: "true"
      ASTRAL_STAGING_EXPECTED_RUNNER_NAME: ${{ vars.ASTRAL_STAGING_RUNNER_NAME }}
      ASTRAL_STAGING_ENDPOINT: ${{ secrets.ASTRAL_STAGING_ENDPOINT }}
      ASTRAL_STAGING_PROBE_TOKEN: ${{ secrets.ASTRAL_STAGING_PROBE_TOKEN }}
      STAGING_POSTGRES_IMAGE: ${{ secrets.STAGING_POSTGRES_IMAGE }}
      STAGING_KEYCLOAK_IMAGE: ${{ secrets.STAGING_KEYCLOAK_IMAGE }}
      STAGING_SCHEMA_BASELINE_IMAGE: ${{ secrets.STAGING_SCHEMA_BASELINE_IMAGE }}
      STAGING_RUNTIME_ENV_FILE: ${{ secrets.STAGING_RUNTIME_ENV_FILE }}
      STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
      STAGING_KEYCLOAK_DB_USER: ${{ secrets.STAGING_KEYCLOAK_DB_USER }}
      STAGING_KEYCLOAK_DB_PASSWORD: ${{ secrets.STAGING_KEYCLOAK_DB_PASSWORD }}
      STAGING_KEYCLOAK_DB_NAME: ${{ secrets.STAGING_KEYCLOAK_DB_NAME }}
      STAGING_KEYCLOAK_ADMIN_USER: ${{ secrets.STAGING_KEYCLOAK_ADMIN_USER }}
      STAGING_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.STAGING_KEYCLOAK_ADMIN_PASSWORD }}
      STAGING_BIND_PORT: ${{ secrets.STAGING_BIND_PORT }}
      RELEASE_TRUSTED_BUILDER_SHA: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
      RELEASE_TRUSTED_BUILDER_IDENTITY: ${{ vars.RELEASE_TRUSTED_BUILDER_IDENTITY }}
      ASTRAL_CANDIDATE_IMAGE: ${{ needs.publish-candidate.outputs.candidate_image }}
      STAGING_ENVIRONMENT_ID: rr-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      endpoint: ${{ steps.stage.outputs.endpoint }}
      environment_id: ${{ steps.stage.outputs.environment_id }}
      runner_name: ${{ steps.runner-binding.outputs.runner_name }}
      artifact_id: ${{ steps.outputs-upload.outputs.artifact-id }}
      manifest_artifact_id: ${{ steps.manifest-upload.outputs.artifact-id }}
    steps:
      - name: Block staging until the external ephemeral credential issuer is integrated
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::external ephemeral credential issuer integration is not implemented; candidate staging remains fail-closed" >&2
          exit 1
      - name: Validate and export the canonical staging runner name
        id: runner-binding
        shell: bash
        run: |
          set -euo pipefail
          runner_name_pattern='^[A-Za-z0-9][A-Za-z0-9._ -]{0,199}$'
          test -n "$ASTRAL_STAGING_EXPECTED_RUNNER_NAME"
          if [[ ! "$RUNNER_NAME" =~ $runner_name_pattern ]]; then
            echo "::error::staging runner name is not canonical" >&2
            exit 1
          fi
          test "$RUNNER_NAME" = "$ASTRAL_STAGING_EXPECTED_RUNNER_NAME"
          printf 'runner_name=%s\n' "$RUNNER_NAME" >> "$GITHUB_OUTPUT"
      - name: Create job-temporary Docker registry configuration
        shell: bash
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/release-readiness-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          case "$docker_config" in
            "$RUNNER_TEMP"/release-readiness-docker-*) ;;
            *)
              echo "::error::refusing unexpected Docker configuration path" >&2
              exit 1
              ;;
          esac
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          if [[ -e "$docker_config" || -L "$docker_config" ]]; then
            echo "::error::job-temporary Docker configuration already exists" >&2
            exit 1
          fi
          install -d -m 0700 "$docker_config"
      - name: Log in to GHCR for private candidate image pulls
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: false
      - name: Check out the exact candidate source without executing its staging policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate-source
          persist-credentials: false
      - name: Check out the owner-reviewed protected staging policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
          path: protected-policy
          persist-credentials: false
      - name: Bind this workflow and policy checkout to the protected checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_SHA" = "$RELEASE_TRUSTED_BUILDER_SHA"
          test -n "$ASTRAL_STAGING_EXPECTED_RUNNER_NAME"
          test "$RUNNER_NAME" = "$ASTRAL_STAGING_EXPECTED_RUNNER_NAME"
          test "$(git -C protected-policy rev-parse HEAD)" = "$RELEASE_TRUSTED_BUILDER_SHA"
          test "$(git -C candidate-source rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - name: Hash the exact LiveKit staging configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=protected-policy/deploy/livekit/livekit.staging.yaml
          test -f "$CONFIG" && test ! -L "$CONFIG"
          LIVEKIT_CONFIG_SHA256="$(sha256sum "$CONFIG" | cut -d ' ' -f 1)"
          test "${#LIVEKIT_CONFIG_SHA256}" -eq 64
          echo "LIVEKIT_CONFIG_SHA256=$LIVEKIT_CONFIG_SHA256" >> "$GITHUB_ENV"
      - name: Probe and hash the exact speech inventory and profile
        shell: bash
        env:
          VOICE_SPEECH_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          VOICE_SPEECH_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import hashlib
          import json
          import os
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ.get("VOICE_SPEECH_BASE_URL", "").rstrip("/")
          api_key = os.environ.get("VOICE_SPEECH_API_KEY", "")
          parsed = urllib.parse.urlsplit(base)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
              or not api_key
          ):
              raise SystemExit("protected speech inventory inputs are absent or invalid")
          request = urllib.request.Request(
              f"{base}/models",
              headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(
                      req.full_url, code, "speech inventory redirects are forbidden", headers, fp
                  )

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect(),
          )
          try:
              with opener.open(request, timeout=20) as response:
                  body = response.read(4 * 1024 * 1024 + 1)
          except Exception:
              raise SystemExit("exact speech inventory probe failed") from None
          if len(body) > 4 * 1024 * 1024:
              raise SystemExit("speech inventory exceeds the protected size bound")
          try:
              document = json.loads(body)
          except (UnicodeError, json.JSONDecodeError):
              raise SystemExit("speech inventory is not one bounded JSON document") from None
          entries = document.get("data") if isinstance(document, dict) else None
          if not isinstance(entries, list):
              raise SystemExit("speech inventory lacks a model list")
          by_id = {}
          for entry in entries:
              if not isinstance(entry, dict) or not isinstance(entry.get("id"), str):
                  raise SystemExit("speech inventory contains a malformed model")
              if entry["id"] in by_id:
                  raise SystemExit("speech inventory contains a duplicate model id")
              by_id[entry["id"]] = entry

          asr_id = "Systran/faster-whisper-large-v3"
          tts_id = "speaches-ai/Kokoro-82M-v1.0-ONNX"
          try:
              asr = by_id[asr_id]
              tts = by_id[tts_id]
          except KeyError:
              raise SystemExit("the exact ASR/TTS model is absent") from None
          voices = tts.get("voices")
          if (
              asr.get("task") != "automatic-speech-recognition"
              or tts.get("task") != "text-to-speech"
              or tts.get("sample_rate") != 24000
              or not isinstance(voices, list)
              or not any(
                  isinstance(voice, dict)
                  and voice.get("id") == "af_heart"
                  and voice.get("language") == "en-us"
                  for voice in voices
              )
          ):
              raise SystemExit("the exact speech profile is not ready")

          def selected_model(entry):
              value = {
                  key: entry[key]
                  for key in ("id", "language", "task", "sample_rate", "voices")
                  if key in entry
              }
              if isinstance(value.get("language"), list):
                  value["language"] = sorted(value["language"])
              if isinstance(value.get("voices"), list):
                  value["voices"] = sorted(
                      value["voices"], key=lambda voice: json.dumps(voice, sort_keys=True)
                  )
              return value

          inventory = {"asr": selected_model(asr), "tts": selected_model(tts)}
          inventory_bytes = json.dumps(
              inventory, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          profile = {
              "asr_model": asr_id,
              "tts_model": tts_id,
              "voice": "af_heart",
              "sample_rate_hz": 24000,
          }
          profile_bytes = json.dumps(
              profile, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          profile_sha256 = hashlib.sha256(profile_bytes).hexdigest()
          expected_profile_sha256 = "9b857a3d788a5d6c4ff67278eca4a169028fb2e185ccaf0b01961283f629445b"
          if profile_sha256 != expected_profile_sha256:
              raise SystemExit("canonical speech-profile digest drifted")
          print(f"SPEECH_INVENTORY_SHA256={hashlib.sha256(inventory_bytes).hexdigest()}")
          print(f"SPEECH_PROFILE_SHA256={profile_sha256}")
          PY
      - name: Generate request-scoped LiveKit and control credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          LIVEKIT_API_KEY="stage_$(openssl rand -hex 12)"
          LIVEKIT_API_SECRET="$(openssl rand -hex 32)"
          VOICE_CONTROL_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$LIVEKIT_API_KEY"
          echo "::add-mask::$LIVEKIT_API_SECRET"
          echo "::add-mask::$VOICE_CONTROL_SECRET"
          echo "LIVEKIT_API_KEY=$LIVEKIT_API_KEY" >> "$GITHUB_ENV"
          echo "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET" >> "$GITHUB_ENV"
          echo "VOICE_CONTROL_SECRET=$VOICE_CONTROL_SECRET" >> "$GITHUB_ENV"
      - name: Validate the tracked staging fixture set
        run: >-
          python3 protected-policy/scripts/run_candidate_staging.py validate-fixtures
          --manifest protected-policy/backend/tests/fixtures/runtime_reliability_060/staging/fixture-manifest.json
      - name: Deploy the candidate namespace and leave it running
        id: stage
        env:
          # Scoped to the deploy step: candidate-facing producer jobs never
          # receive these runtime-only media/speech values.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIVEKIT_PUBLIC_URL: ${{ secrets.LIVEKIT_PUBLIC_URL }}
          LIVEKIT_TURN_DOMAIN: ${{ secrets.LIVEKIT_TURN_DOMAIN }}
        run: |
          set -euo pipefail
          mkdir -p build/060
          python3 protected-policy/scripts/run_candidate_staging.py deploy \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --candidate-source-root "$GITHUB_WORKSPACE/candidate-source" \
            --candidate-image "$ASTRAL_CANDIDATE_IMAGE" \
            --voice-worker-image "${{ needs.publish-candidate.outputs.voice_worker_image }}" \
            --livekit-image "${{ needs.publish-candidate.outputs.livekit_image }}" \
            --livekit-config-sha256 "$LIVEKIT_CONFIG_SHA256" \
            --speech-inventory-sha256 "$SPEECH_INVENTORY_SHA256" \
            --speech-profile-sha256 "$SPEECH_PROFILE_SHA256" \
            --fixture-manifest protected-policy/backend/tests/fixtures/runtime_reliability_060/staging/fixture-manifest.json \
            --environment-id "$STAGING_ENVIRONMENT_ID" \
            --outputs build/060/staging-outputs.json \
            --leave-running
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          outputs = json.load(open("build/060/staging-outputs.json", encoding="utf-8"))
          print(f"endpoint={outputs['endpoint']}")
          print(f"environment_id={outputs['environment_id']}")
          PY
      - name: Archive the immutable stage outputs
        id: outputs-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/staging-outputs.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate the protected manifest from the actual immutable artifact id
        shell: bash
        env:
          STAGE_OUTPUTS_ARTIFACT_ID: ${{ steps.outputs-upload.outputs.artifact-id }}
          STAGE_OUTPUTS_ARTIFACT_NAME: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 protected-policy/scripts/run_candidate_staging.py write-trusted-manifest \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --environment-id "$STAGING_ENVIRONMENT_ID" \
            --outputs build/060/staging-outputs.json \
            --trusted-manifest build/060/trusted-stage-deploy.json \
            --stage-outputs-artifact-id "$STAGE_OUTPUTS_ARTIFACT_ID" \
            --stage-outputs-artifact-name "$STAGE_OUTPUTS_ARTIFACT_NAME" \
            --stage-outputs-member staging-outputs.json
      - name: Archive the post-upload protected stage manifest separately
        id: manifest-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-manifest-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/trusted-stage-deploy.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove job-temporary Docker registry credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_CONFIG:-}" ]]; then
            exit 0
          fi
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/release-readiness-docker-*) ;;
            *)
              echo "::error::refusing to remove unexpected Docker configuration path" >&2
              exit 1
              ;;
          esac
          if [[ -L "$DOCKER_CONFIG" ]]; then
            echo "::error::refusing to traverse a symlinked Docker configuration" >&2
            exit 1
          fi
          if [[ -d "$DOCKER_CONFIG" ]]; then
            find "$DOCKER_CONFIG" -mindepth 1 -depth -delete
            rmdir -- "$DOCKER_CONFIG"
          elif [[ -e "$DOCKER_CONFIG" ]]; then
            echo "::error::Docker configuration path is not a directory" >&2
            exit 1
          fi

  # ── Build-once Windows candidate (feature 068 reusable workflow); its exact
  #    artifact id / executable digest feed the windows producer and, later,
  #    the bridge signer. ──
  windows-candidate:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    uses: ./.github/workflows/build-windows-candidate.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
    secrets:
      staging_access_token: ${{ secrets.ASTRAL_WINDOWS_SMOKE_TOKEN }}

  backend-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: [stage-deploy, publish-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: astral
          POSTGRES_PASSWORD: astral_ci
          POSTGRES_DB: astraldeep
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U astral -d astraldeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRAL_STAGING_PROBE_TOKEN: ${{ secrets.ASTRAL_STAGING_PROBE_TOKEN }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      - name: Pull the exact staged candidate image by digest
        run: docker pull "${{ needs.publish-candidate.outputs.candidate_image }}"
      # The producer module re-executes the admission/scheduler/migration
      # suites, so it runs INSIDE the candidate container against a real
      # Postgres — the same recipe as the ci.yml test job.
      - name: Produce backend release evidence inside the candidate container
        run: |
          set -euo pipefail
          mkdir -p build/060/release-evidence
          docker run --rm --network host \
            -v "$PWD/backend:/app/backend" \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/specs:/app/specs:ro" \
            -v "$PWD/tooling/python-ci:/ci/python:ro" \
            -v "$PWD/build:/app/build" \
            -e ASTRAL_ENV=development \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=astraldeep \
            -e DB_USER=astral \
            -e DB_PASSWORD=astral_ci \
            -e AGENT_API_KEY=ci-release-agent-key \
            -e AUDIT_HMAC_SECRET=ci-release-hmac-secret \
            -e LOOP_GUARD_ENFORCE=1 \
            -e ASTRAL_STAGING_URL="${{ needs.stage-deploy.outputs.endpoint }}" \
            -e ASTRAL_RELEASE_EVIDENCE_OUTPUT=/app/build/060/release-evidence/backend.json \
            -e ASTRAL_RELEASE_STAGING_FILE=/app/build/060/stage/staging-outputs.json \
            -e ASTRAL_RELEASE_CANDIDATE_SHA="${{ inputs.candidate_sha }}" \
            -e ASTRAL_RELEASE_ID="release-060-${{ inputs.candidate_sha }}" \
            -e ASTRAL_RELEASE_VERSION="${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}" \
            -e ASTRAL_STAGING_PROBE_TOKEN \
            -e ASTRAL_RUNNER_ENVIRONMENT=github_hosted \
            -e ASTRAL_RUNNER_IMAGE="${ImageOS:-ubuntu}-${ImageVersion:-hosted}" \
            -e GITHUB_JOB -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW \
            -e RUNNER_ARCH -e RUNNER_NAME -e RUNNER_OS \
            -w /app/backend --entrypoint bash \
            "${{ needs.publish-candidate.outputs.candidate_image }}" \
            -c "python -m pip install --require-hashes -r /ci/python/requirements.lock.txt && python -m pytest tests/perf/release_backend_060.py -q -m perf"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-backend-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/release-evidence/
          if-no-files-found: error
          retention-days: 14

  web-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASTRAL_RELEASE_USERNAME: ${{ secrets.ASTRAL_RELEASE_USERNAME }}
      ASTRAL_RELEASE_PASSWORD: ${{ secrets.ASTRAL_RELEASE_PASSWORD }}
      ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
      ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
      ASTRAL_RELEASE_LIFECYCLE_AGENT_ID: ${{ vars.RELEASE_LIFECYCLE_AGENT_ID || 'dice-roller-1' }}
      ASTRAL_RELEASE_LIFECYCLE_STATES: ${{ vars.RELEASE_LIFECYCLE_STATES || 'starting,online' }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      - name: Run the browser release lane in the digest-pinned image
        run: |
          set -euo pipefail
          PLAYWRIGHT_IMAGE="$(tr -d '\n' < components/AstralProjection/tooling/web-ci/playwright-image.txt)"
          test "${PLAYWRIGHT_IMAGE#*@sha256:}" != "$PLAYWRIGHT_IMAGE"
          docker pull "$PLAYWRIGHT_IMAGE"
          mkdir -p build/060/release-evidence/coverage
          docker run --rm -v "$PWD:/work" -w /work/components/AstralProjection/tooling/web-ci \
            -e ASTRAL_PLAYWRIGHT_IMAGE="$PLAYWRIGHT_IMAGE" \
            -e ASTRAL_RELEASE_USERNAME -e ASTRAL_RELEASE_PASSWORD \
            -e ASTRAL_RELEASE_ID -e ASTRAL_RELEASE_VERSION \
            -e ASTRAL_RELEASE_STAGING_FILE=/work/build/060/stage/staging-outputs.json \
            -e ASTRAL_RELEASE_LIFECYCLE_AGENT_ID -e ASTRAL_RELEASE_LIFECYCLE_STATES \
            -e ASTRAL_RUNNER_ENVIRONMENT=github_hosted \
            -e GITHUB_JOB -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW \
            -e RUNNER_ARCH -e RUNNER_NAME -e RUNNER_OS \
            "$PLAYWRIGHT_IMAGE" sh -lc \
            'test "$(corepack npm --version)" = "11.16.0" && corepack npm ci --ignore-scripts && corepack npm run check:package-manager && corepack npm run browser:release -- --base-url "${{ needs.stage-deploy.outputs.endpoint }}" --candidate-sha "${{ inputs.candidate_sha }}" --output /work/build/060/release-evidence/web.json --coverage-output /work/build/060/release-evidence/coverage/web-v8.json --coverage-istanbul-output /work/build/060/release-evidence/coverage/web-istanbul.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-web-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/release-evidence/
          if-no-files-found: error
          retention-days: 14

  windows-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: [stage-deploy, windows-candidate]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ASTRAL_WINDOWS_EXE_SHA256: ${{ needs.windows-candidate.outputs.executable_sha256 }}
      ASTRAL_WINDOWS_ARTIFACT_ID: ${{ needs.windows-candidate.outputs.artifact_id }}
      ASTRAL_WINDOWS_SMOKE_TOKEN: ${{ secrets.ASTRAL_WINDOWS_SMOKE_TOKEN }}
      ASTRAL_STAGING_URL: ${{ needs.stage-deploy.outputs.endpoint }}
      ASTRAL_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
      ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
      ASTRAL_RELEASE_LIFECYCLE_AGENT_ID: ${{ vars.RELEASE_LIFECYCLE_AGENT_ID || 'dice-roller-1' }}
      ASTRAL_RELEASE_LIFECYCLE_STATES: ${{ vars.RELEASE_LIFECYCLE_STATES || 'starting,online' }}
      ASTRAL_RUNNER_ENVIRONMENT: github_hosted
      PYTHONUTF8: "1"
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            components/AstralProjection/windows-client/requirements-release.lock.txt
            tooling/python-ci/requirements.lock.txt
      - name: Install hash-locked client runtime requirements
        run: python -m pip install --require-hashes -r components/AstralProjection/windows-client/requirements-release.lock.txt
      - name: Install hash-locked CI-only Python tooling
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      - name: Download the build-once candidate by exact artifact id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.windows-candidate.outputs.artifact_id }}
          path: build/windows-candidate-download
      - name: Re-hash the exact archived executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse build\windows-candidate-download -Filter AstralDeep.exe | Select-Object -First 1
          if (-not $exe) { throw "downloaded candidate artifact lacks AstralDeep.exe" }
          $digest = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $env:ASTRAL_WINDOWS_EXE_SHA256) {
            throw "downloaded executable digest $digest differs from the recorded executable_sha256"
          }
          "ASTRAL_WINDOWS_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "ASTRAL_WINDOWS_CANDIDATE_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
      - name: Produce Windows release evidence against staging
        shell: pwsh
        env:
          ASTRAL_RELEASE_EVIDENCE_OUTPUT: ${{ github.workspace }}/build/060/release-evidence/windows.json
          ASTRAL_RELEASE_STAGING_FILE: ${{ github.workspace }}/build/060/stage/staging-outputs.json
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build\060\release-evidence | Out-Null
          python -m pytest components/AstralProjection/windows-client/tests/release_evidence_060.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-windows-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/release-evidence/
          if-no-files-found: error
          retention-days: 14

  android-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASTRAL_STAGING_URL: ${{ needs.stage-deploy.outputs.endpoint }}
      ASTRAL_STAGING_ACCESS_TOKEN: ${{ secrets.ASTRAL_STAGING_ACCESS_TOKEN }}
      ASTRAL_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
      ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
      ASTRAL_RELEASE_LIFECYCLE_AGENT_ID: ${{ vars.RELEASE_LIFECYCLE_AGENT_ID || 'dice-roller-1' }}
      ASTRAL_RELEASE_LIFECYCLE_STATES: ${{ vars.RELEASE_LIFECYCLE_STATES || 'starting,online' }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve Gradle version from the committed wrapper
        id: wrapper
        working-directory: components/AstralProjection/android-client
        run: |
          v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$v" || { echo "could not parse Gradle version from wrapper properties" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: ${{ steps.wrapper.outputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      # The toolchain canary is a reached fail-closed diagnostic; its JSON is
      # handed to the instrumented producer as a base64 argument.
      - name: Run the Android next-major readiness canary diagnostic
        run: >-
          python3 scripts/run_android_next_major_canary.py
          components/AstralProjection/android-client/gradle/next-major-canary.properties
          --allow-unreleased
          --verify-official-availability
          --output build/060/android-next-major-readiness.json
      - name: Encode staging and canary inputs for instrumentation
        run: |
          set -euo pipefail
          echo "STAGING_B64=$(base64 -w0 build/060/stage/staging-outputs.json)" >> "$GITHUB_ENV"
          echo "CANARY_B64=$(base64 -w0 build/060/android-next-major-readiness.json)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Produce Android release evidence on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          working-directory: components/AstralProjection/android-client
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.class=com.personalailabs.astraldeep.app.ReleaseEvidenceInstrumentedTest \
              -Pandroid.testInstrumentationRunnerArguments.astralStagingUrl="$ASTRAL_STAGING_URL" \
              -Pandroid.testInstrumentationRunnerArguments.astralAccessToken="$ASTRAL_STAGING_ACCESS_TOKEN" \
              -Pandroid.testInstrumentationRunnerArguments.astralCandidateSha="$ASTRAL_RELEASE_CANDIDATE_SHA" \
              -Pandroid.testInstrumentationRunnerArguments.astralReleaseId="$ASTRAL_RELEASE_ID" \
              -Pandroid.testInstrumentationRunnerArguments.astralReleaseVersion="$ASTRAL_RELEASE_VERSION" \
              -Pandroid.testInstrumentationRunnerArguments.astralLifecycleAgentId="$ASTRAL_RELEASE_LIFECYCLE_AGENT_ID" \
              -Pandroid.testInstrumentationRunnerArguments.astralLifecycleStates="$ASTRAL_RELEASE_LIFECYCLE_STATES" \
              -Pandroid.testInstrumentationRunnerArguments.astralStagingEnvironmentB64="$STAGING_B64" \
              -Pandroid.testInstrumentationRunnerArguments.astralToolchainCanaryB64="$CANARY_B64" \
              -Pandroid.testInstrumentationRunnerArguments.astralRunnerImage="${ImageOS:-ubuntu}-${ImageVersion:-hosted}" \
              -Pandroid.testInstrumentationRunnerArguments.astralRunnerName="$RUNNER_NAME" \
              -Pandroid.testInstrumentationRunnerArguments.astralRunnerArch="$RUNNER_ARCH" \
              -Pandroid.testInstrumentationRunnerArguments.astralRunnerEnvironment=github_hosted \
              -Pandroid.testInstrumentationRunnerArguments.astralWorkflowName="$GITHUB_WORKFLOW" \
              -Pandroid.testInstrumentationRunnerArguments.astralRunId="$GITHUB_RUN_ID" \
              -Pandroid.testInstrumentationRunnerArguments.astralRunAttempt="$GITHUB_RUN_ATTEMPT" \
              -Pandroid.testInstrumentationRunnerArguments.astralJobId="$GITHUB_JOB"
            device_path="$(adb logcat -d | sed -n 's/.*release_evidence_output=\(\S*\).*/\1/p' | tail -n 1)"
            test -n "$device_path" || { echo "instrumented producer logged no release_evidence_output" >&2; exit 1; }
            mkdir -p ../build/060/release-evidence
            adb pull "$device_path" ../build/060/release-evidence-device
            cp -R ../build/060/release-evidence-device/. ../build/060/release-evidence/
            test -f ../build/060/release-evidence/android.json
      # The report references the exact tested APK bytes as
      # bundle://android/app-debug.apk — place them at that member path.
      - name: Bundle the tested APK bytes and Kover coverage inputs
        working-directory: components/AstralProjection/android-client
        run: |
          set -euo pipefail
          mkdir -p ../build/060/release-evidence/android ../build/060/release-evidence/coverage
          cp app/build/outputs/apk/debug/app-debug.apk ../build/060/release-evidence/android/app-debug.apk
          gradle :app:koverXmlReport :core:koverXmlReport --no-daemon --stacktrace
          cp app/build/reports/kover/report.xml ../build/060/release-evidence/coverage/android-app.xml
          cp core/build/reports/kover/report.xml ../build/060/release-evidence/coverage/android-core.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-android-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/release-evidence/
          if-no-files-found: error
          retention-days: 14

  macos-raw-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    outputs:
      raw_artifact_id: ${{ steps.raw-evidence-upload.outputs.artifact-id }}
      archive_repo_root: ${{ steps.raw-archive-root.outputs.archive_repo_root }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
      APP_PROJECT: components/AstralProjection/apple-clients/AstralApp/AstralApp.xcodeproj
      DESTINATION: platform=macOS
      PRODUCER_PLATFORM: macos
      PRODUCER_ONLY_TESTING: AstralAppUITests/ReleaseEvidenceUITests
      PRODUCER_SCHEME: AstralApp
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Record the raw archive checkout root before candidate execution
        id: raw-archive-root
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKSPACE" == /* && "$GITHUB_WORKSPACE" != */ ]]
          printf 'archive_repo_root=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      - name: Materialize the staging capability file from stage outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          stage = json.load(open("build/060/stage/staging-outputs.json", encoding="utf-8"))
          capability = {"macos_personal_agent_host": stage["macos_personal_agent_host"]}
          out = pathlib.Path("build/060/stage/capability.json")
          out.write_text(json.dumps(capability, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Build for testing and digest the exact tested app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${APP_PROJECT}" -scheme "${PRODUCER_SCHEME}" \
            -destination "${DESTINATION}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build/060/dd build-for-testing
          APP="$(/usr/bin/find build/060/dd/Build/Products -maxdepth 2 -name '*.app' -print | sort | head -n 1)"
          test -n "$APP"
          mkdir -p "build/060/release-evidence/${PRODUCER_PLATFORM}"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "build/060/release-evidence/${PRODUCER_PLATFORM}/AstralApp.app.zip"
          DIGEST=$(shasum -a 256 "build/060/release-evidence/${PRODUCER_PLATFORM}/AstralApp.app.zip" | cut -d ' ' -f 1)
          echo "ARTIFACT_SHA256=$DIGEST" >> "$GITHUB_ENV"
      - name: Produce macOS release evidence against staging
        shell: bash
        env:
          TEST_RUNNER_ASTRAL_STAGING_URL: ${{ needs.stage-deploy.outputs.endpoint }}
          TEST_RUNNER_ASTRAL_RELEASE_PLATFORM: macos
          TEST_RUNNER_ASTRAL_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TEST_RUNNER_ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
          TEST_RUNNER_ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
          TEST_RUNNER_ASTRAL_RELEASE_USERNAME: ${{ secrets.ASTRAL_RELEASE_USERNAME }}
          TEST_RUNNER_ASTRAL_RELEASE_PASSWORD: ${{ secrets.ASTRAL_RELEASE_PASSWORD }}
          TEST_RUNNER_ASTRAL_RELEASE_LIFECYCLE_AGENT_ID: ${{ vars.RELEASE_LIFECYCLE_AGENT_ID || 'dice-roller-1' }}
          TEST_RUNNER_ASTRAL_RUNNER_ENVIRONMENT: github_hosted
          TEST_RUNNER_ASTRAL_RUNNER_IMAGE: macos-26
        run: |
          set -euo pipefail
          mkdir -p build/060/release-evidence/coverage/raw
          export TEST_RUNNER_ASTRAL_RELEASE_EVIDENCE_OUTPUT="$PWD/build/060/release-evidence/macos.json"
          export TEST_RUNNER_ASTRAL_RELEASE_STAGING_FILE="$PWD/build/060/stage/staging-outputs.json"
          export TEST_RUNNER_ASTRAL_STAGING_CAPABILITY_FILE="$PWD/build/060/stage/capability.json"
          export TEST_RUNNER_ASTRAL_RELEASE_ARTIFACT_REFERENCE="bundle://${PRODUCER_PLATFORM}/AstralApp.app.zip"
          export TEST_RUNNER_ASTRAL_RELEASE_ARTIFACT_SHA256="$ARTIFACT_SHA256"
          export TEST_RUNNER_GITHUB_JOB="$GITHUB_JOB" TEST_RUNNER_GITHUB_RUN_ID="$GITHUB_RUN_ID"
          export TEST_RUNNER_GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" TEST_RUNNER_GITHUB_WORKFLOW="$GITHUB_WORKFLOW"
          export TEST_RUNNER_RUNNER_OS="$RUNNER_OS" TEST_RUNNER_RUNNER_ARCH="$RUNNER_ARCH" TEST_RUNNER_RUNNER_NAME="$RUNNER_NAME"
          result="build/060/release-evidence/coverage/raw/apple-${PRODUCER_PLATFORM}.xcresult"
          rm -rf "$result"
          xcodebuild -project "${APP_PROJECT}" -scheme "${PRODUCER_SCHEME}" \
            -destination "${DESTINATION}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -enableCodeCoverage YES \
            -derivedDataPath build/060/dd \
            -resultBundlePath "$result" \
            "-only-testing:${PRODUCER_ONLY_TESTING}" \
            test-without-building
          test -d "$result"
      - id: raw-evidence-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-apple-evidence-macos-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: |
            build/060/release-evidence/macos.json
            build/060/release-evidence/macos/
            build/060/release-evidence/macos-raw/
            build/060/release-evidence/coverage/raw/apple-macos.xcresult/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  ios-raw-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    outputs:
      raw_artifact_id: ${{ steps.raw-evidence-upload.outputs.artifact-id }}
      archive_repo_root: ${{ steps.raw-archive-root.outputs.archive_repo_root }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
      IOS_RUNTIME: "26.5"
      APP_PROJECT: components/AstralProjection/apple-clients/AstralApp/AstralApp.xcodeproj
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
      PRODUCER_PLATFORM: ios
      PRODUCER_ONLY_TESTING: AstralAppUITests/ReleaseEvidenceUITests
      PRODUCER_SCHEME: AstralApp
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Record the raw archive checkout root before candidate execution
        id: raw-archive-root
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKSPACE" == /* && "$GITHUB_WORKSPACE" != */ ]]
          printf 'archive_repo_root=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
      - name: Require the supported iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available | grep -F "iOS ${IOS_RUNTIME}"
          xcrun simctl list devicetypes | grep -F "iPhone 17 Pro"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      - name: Build for testing and digest the exact tested app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${APP_PROJECT}" -scheme "${PRODUCER_SCHEME}" \
            -destination "${DESTINATION}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build/060/dd build-for-testing
          APP="$(/usr/bin/find build/060/dd/Build/Products -maxdepth 2 -name '*.app' -print | sort | head -n 1)"
          test -n "$APP"
          mkdir -p "build/060/release-evidence/${PRODUCER_PLATFORM}"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "build/060/release-evidence/${PRODUCER_PLATFORM}/AstralApp.app.zip"
          DIGEST=$(shasum -a 256 "build/060/release-evidence/${PRODUCER_PLATFORM}/AstralApp.app.zip" | cut -d ' ' -f 1)
          echo "ARTIFACT_SHA256=$DIGEST" >> "$GITHUB_ENV"
      - name: Produce iOS release evidence against staging
        shell: bash
        env:
          TEST_RUNNER_ASTRAL_STAGING_URL: ${{ needs.stage-deploy.outputs.endpoint }}
          TEST_RUNNER_ASTRAL_RELEASE_PLATFORM: ios
          TEST_RUNNER_ASTRAL_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TEST_RUNNER_ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
          TEST_RUNNER_ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
          TEST_RUNNER_ASTRAL_RELEASE_USERNAME: ${{ secrets.ASTRAL_RELEASE_USERNAME }}
          TEST_RUNNER_ASTRAL_RELEASE_PASSWORD: ${{ secrets.ASTRAL_RELEASE_PASSWORD }}
          TEST_RUNNER_ASTRAL_RELEASE_LIFECYCLE_AGENT_ID: ${{ vars.RELEASE_LIFECYCLE_AGENT_ID || 'dice-roller-1' }}
          TEST_RUNNER_ASTRAL_RUNNER_ENVIRONMENT: github_hosted
          TEST_RUNNER_ASTRAL_RUNNER_IMAGE: macos-26
        run: |
          set -euo pipefail
          mkdir -p build/060/release-evidence/coverage/raw
          export TEST_RUNNER_ASTRAL_RELEASE_EVIDENCE_OUTPUT="$PWD/build/060/release-evidence/ios.json"
          export TEST_RUNNER_ASTRAL_RELEASE_STAGING_FILE="$PWD/build/060/stage/staging-outputs.json"
          export TEST_RUNNER_ASTRAL_RELEASE_ARTIFACT_REFERENCE="bundle://${PRODUCER_PLATFORM}/AstralApp.app.zip"
          export TEST_RUNNER_ASTRAL_RELEASE_ARTIFACT_SHA256="$ARTIFACT_SHA256"
          export TEST_RUNNER_GITHUB_JOB="$GITHUB_JOB" TEST_RUNNER_GITHUB_RUN_ID="$GITHUB_RUN_ID"
          export TEST_RUNNER_GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" TEST_RUNNER_GITHUB_WORKFLOW="$GITHUB_WORKFLOW"
          export TEST_RUNNER_RUNNER_OS="$RUNNER_OS" TEST_RUNNER_RUNNER_ARCH="$RUNNER_ARCH" TEST_RUNNER_RUNNER_NAME="$RUNNER_NAME"
          result="build/060/release-evidence/coverage/raw/apple-${PRODUCER_PLATFORM}.xcresult"
          rm -rf "$result"
          xcodebuild -project "${APP_PROJECT}" -scheme "${PRODUCER_SCHEME}" \
            -destination "${DESTINATION}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -enableCodeCoverage YES \
            -derivedDataPath build/060/dd \
            -resultBundlePath "$result" \
            "-only-testing:${PRODUCER_ONLY_TESTING}" \
            test-without-building
          test -d "$result"
      - id: raw-evidence-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-apple-evidence-ios-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: |
            build/060/release-evidence/ios.json
            build/060/release-evidence/ios/
            build/060/release-evidence/ios-raw/
            build/060/release-evidence/coverage/raw/apple-ios.xcresult/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  watchos-raw-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    outputs:
      raw_artifact_id: ${{ steps.raw-evidence-upload.outputs.artifact-id }}
      archive_repo_root: ${{ steps.raw-archive-root.outputs.archive_repo_root }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
      WATCHOS_RUNTIME: "26.5"
      APP_PROJECT: components/AstralProjection/apple-clients/AstralApp/AstralApp.xcodeproj
      PRODUCER_PLATFORM: watchos
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Record the raw archive checkout root before candidate execution
        id: raw-archive-root
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKSPACE" == /* && "$GITHUB_WORKSPACE" != */ ]]
          printf 'archive_repo_root=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
      - name: Require and boot the supported watchOS simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available | grep -F "watchOS ${WATCHOS_RUNTIME}"
          xcrun simctl list devicetypes | grep -F "Apple Watch Series 11 (46mm)"
          if ! xcrun simctl list devices available | grep -F "Apple Watch Series 11 (46mm)"; then
            runtime_id="$(xcrun simctl list runtimes available | sed -n "s/.*watchOS ${WATCHOS_RUNTIME}.*- \(com\.apple\.CoreSimulator\.SimRuntime\.[A-Za-z0-9.-]*\)$/\1/p" | head -n 1)"
            [[ -n "$runtime_id" ]] || { echo "watchOS ${WATCHOS_RUNTIME} runtime identifier not found" >&2; exit 1; }
            xcrun simctl create "Apple Watch Series 11 (46mm)" "Apple Watch Series 11 (46mm)" "$runtime_id"
          fi
          xcrun simctl boot "Apple Watch Series 11 (46mm)" || true
          xcrun simctl bootstatus "Apple Watch Series 11 (46mm)" -b
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-outputs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/stage
      - name: Build for testing and digest the exact tested watch app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${APP_PROJECT}" -scheme AstralWatch \
            -destination "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=${WATCHOS_RUNTIME}" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/060/dd build-for-testing
          APP="$(/usr/bin/find build/060/dd/Build/Products -maxdepth 2 -name '*.app' -print | sort | head -n 1)"
          test -n "$APP"
          mkdir -p "build/060/release-evidence/${PRODUCER_PLATFORM}"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "build/060/release-evidence/${PRODUCER_PLATFORM}/AstralWatch.app.zip"
          DIGEST=$(shasum -a 256 "build/060/release-evidence/${PRODUCER_PLATFORM}/AstralWatch.app.zip" | cut -d ' ' -f 1)
          echo "ARTIFACT_SHA256=$DIGEST" >> "$GITHUB_ENV"
      - name: Produce watchOS release evidence against staging
        shell: bash
        env:
          TEST_RUNNER_ASTRAL_STAGING_URL: ${{ needs.stage-deploy.outputs.endpoint }}
          TEST_RUNNER_ASTRAL_RELEASE_PLATFORM: watchos
          TEST_RUNNER_ASTRAL_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TEST_RUNNER_ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
          TEST_RUNNER_ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
          TEST_RUNNER_ASTRAL_RELEASE_LIFECYCLE_AGENT_ID: ${{ vars.RELEASE_LIFECYCLE_AGENT_ID || 'dice-roller-1' }}
          TEST_RUNNER_ASTRAL_RUNNER_ENVIRONMENT: github_hosted
          TEST_RUNNER_ASTRAL_RUNNER_IMAGE: macos-26
        run: |
          set -euo pipefail
          mkdir -p build/060/release-evidence/coverage/raw
          export TEST_RUNNER_ASTRAL_RELEASE_EVIDENCE_OUTPUT="$PWD/build/060/release-evidence/watchos.json"
          export TEST_RUNNER_ASTRAL_RELEASE_STAGING_FILE="$PWD/build/060/stage/staging-outputs.json"
          export TEST_RUNNER_ASTRAL_RELEASE_ARTIFACT_REFERENCE="bundle://${PRODUCER_PLATFORM}/AstralWatch.app.zip"
          export TEST_RUNNER_ASTRAL_RELEASE_ARTIFACT_SHA256="$ARTIFACT_SHA256"
          export TEST_RUNNER_GITHUB_JOB="$GITHUB_JOB" TEST_RUNNER_GITHUB_RUN_ID="$GITHUB_RUN_ID"
          export TEST_RUNNER_GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" TEST_RUNNER_GITHUB_WORKFLOW="$GITHUB_WORKFLOW"
          export TEST_RUNNER_RUNNER_OS="$RUNNER_OS" TEST_RUNNER_RUNNER_ARCH="$RUNNER_ARCH" TEST_RUNNER_RUNNER_NAME="$RUNNER_NAME"
          result="build/060/release-evidence/coverage/raw/apple-${PRODUCER_PLATFORM}.xcresult"
          rm -rf "$result"
          xcodebuild -project "${APP_PROJECT}" -scheme AstralWatch \
            -destination "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=${WATCHOS_RUNTIME}" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO -enableCodeCoverage YES \
            -derivedDataPath build/060/dd \
            -resultBundlePath "$result" \
            -only-testing:AstralWatchTests/ReleaseEvidenceTests \
            test-without-building
          test -d "$result"
      - id: raw-evidence-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-apple-evidence-watchos-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: |
            build/060/release-evidence/watchos.json
            build/060/release-evidence/watchos/
            build/060/release-evidence/watchos-raw/
            build/060/release-evidence/coverage/raw/apple-watchos.xcresult/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # The final Apple producer jobs are fresh protected normalizers. Candidate
  # build phases run only in the corresponding *-raw-producer job above.
  macos-producer:
    needs: macos-raw-producer
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-apple-evidence-normalizer.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      raw_artifact_id: ${{ needs.macos-raw-producer.outputs.raw_artifact_id }}
      raw_artifact_name: raw-apple-evidence-macos-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
      archive_repo_root: ${{ needs.macos-raw-producer.outputs.archive_repo_root }}
      platform: macos
      app_archive: AstralApp.app.zip
      producer_job_id: macos-producer
      final_artifact_name: evidence-macos-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}

  ios-producer:
    needs: ios-raw-producer
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-apple-evidence-normalizer.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      raw_artifact_id: ${{ needs.ios-raw-producer.outputs.raw_artifact_id }}
      raw_artifact_name: raw-apple-evidence-ios-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
      archive_repo_root: ${{ needs.ios-raw-producer.outputs.archive_repo_root }}
      platform: ios
      app_archive: AstralApp.app.zip
      producer_job_id: ios-producer
      final_artifact_name: evidence-ios-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}

  watchos-producer:
    needs: watchos-raw-producer
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-apple-evidence-normalizer.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      raw_artifact_id: ${{ needs.watchos-raw-producer.outputs.raw_artifact_id }}
      raw_artifact_name: raw-apple-evidence-watchos-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
      archive_repo_root: ${{ needs.watchos-raw-producer.outputs.archive_repo_root }}
      platform: watchos
      app_archive: AstralWatch.app.zip
      producer_job_id: watchos-producer
      final_artifact_name: evidence-watchos-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
  docs-producer:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: stage-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate tracked documentation links
        run: |
          set -euo pipefail
          mkdir -p build/060/release-evidence/docs-raw
          python3 scripts/check_doc_links.py | tee build/060/release-evidence/docs-raw/documentation_links.txt
      # The apply-config operator contract is checked by inspection (grep),
      # never by executing compose against the producer runner.
      - name: Verify the Makefile apply-config contract by inspection
        run: |
          set -euo pipefail
          grep -F -- '--force-recreate' Makefile | tee build/060/release-evidence/docs-raw/apply_config_reload.txt
          grep -F 'docker compose up' Makefile >> build/060/release-evidence/docs-raw/apply_config_reload.txt
          grep -F 'FF_BYO_AGENTS' Makefile >> build/060/release-evidence/docs-raw/apply_config_reload.txt
      - name: Write and schema-validate the docs evidence report
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ASTRAL_RELEASE_ID: release-060-${{ inputs.candidate_sha }}
          ASTRAL_RELEASE_VERSION: ${{ vars.RELEASE_CANDIDATE_VERSION || '0.4.0' }}
        run: |
          set -euo pipefail
          mkdir -p build/060/release-evidence/docs
          git archive --format=tar "$CANDIDATE_SHA" > build/060/release-evidence/docs/source-tree.tar
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, sys, uuid
          from datetime import datetime, timezone

          spec = importlib.util.spec_from_file_location(
              "astral_release_evidence_validator", "scripts/validate_release_evidence.py"
          )
          validator = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = validator
          spec.loader.exec_module(validator)

          root = pathlib.Path("build/060/release-evidence")
          candidate = os.environ["CANDIDATE_SHA"]
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def raw_reference(name: str) -> dict:
              path = root / "docs-raw" / f"{name}.txt"
              return {
                  "name": f"{name}.txt",
                  "kind": "log",
                  "immutable_reference": f"bundle://docs-raw/{name}.txt",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          def check(check_id: str) -> dict:
              return {
                  "id": check_id,
                  "outcome": "passed",
                  "duration_ms": 1,
                  "detail_code": None,
                  "applicability_reason": None,
                  "measurements": [],
                  "evidence_artifacts": [raw_reference(check_id)],
              }

          tree = root / "docs" / "source-tree.tar"
          report = {
              "document_type": "platform_evidence",
              "schema_version": 1,
              "evidence_id": str(uuid.uuid5(
                  uuid.NAMESPACE_URL, f"astraldeep:060:docs-evidence:{candidate}"
              )),
              "candidate_sha": candidate,
              "release_id": os.environ["ASTRAL_RELEASE_ID"],
              "release_version": os.environ["ASTRAL_RELEASE_VERSION"],
              "platform": "docs",
              "target_description": "Tracked documentation and operator contract of the exact candidate source tree",
              "artifact": {
                  "name": "astraldeep-source-tree",
                  "kind": "source_tree",
                  "immutable_reference": "bundle://docs/source-tree.tar",
                  "sha256": hashlib.sha256(tree.read_bytes()).hexdigest(),
                  "build_identity": f"source-tree:{candidate}",
              },
              "staging_environment": None,
              "runner": {
                  "os": "linux",
                  "architecture": "x86_64",
                  "runner_image": f"{os.environ.get('ImageOS', 'ubuntu')}-{os.environ.get('ImageVersion', 'hosted')}",
                  "runner_name": os.environ.get("RUNNER_NAME", "unknown"),
                  "runner_environment": "github_hosted",
              },
              "workflow": {
                  "name": os.environ.get("GITHUB_WORKFLOW", "release-readiness"),
                  "run_id": os.environ.get("GITHUB_RUN_ID", "1"),
                  "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
                  "job_id": os.environ.get("GITHUB_JOB", "docs-producer"),
              },
              "started_at": now,
              "completed_at": now,
              "outcome": "passed",
              "unavailable_reason": None,
              "unavailability_observation": None,
              "checks": [check("documentation_links"), check("apply_config_reload")],
          }
          schema = validator.load_json_document(
              "specs/060-runtime-reliability-hardening/contracts/release-evidence.schema.json"
          )
          validator.validate_document(report, schema)
          out = root / "docs.json"
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"wrote schema-valid {out}")
          PY
          test -f build/060/release-evidence/docs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-docs-${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
          path: build/060/release-evidence/
          if-no-files-found: error
          retention-days: 14

  # ── The manifest-attestation authority: the protected reusable trusted
  #    builder reconstructs producer identities from the shared run's API state
  #    and attests one manifest per producer plus the stage manifest. The
  #    protected-decision job separately attests only its final decision. ──
  trusted-builder:
    needs:
      - stage-deploy
      - backend-producer
      - web-producer
      - windows-producer
      - android-producer
      - macos-raw-producer
      - ios-raw-producer
      - watchos-raw-producer
      - macos-producer
      - ios-producer
      - watchos-producer
      - docs-producer
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (always()) }}
    permissions:
      id-token: write
      attestations: write
      actions: read
      contents: read
    uses: ./.github/workflows/release-trusted-builder.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      request_id: ${{ inputs.request_id }}

  # ── The protected decision. Job id is EXACTLY protected-decision; the
  #    validator refuses --decision-output from any other job. ──
  protected-decision:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs:
      - trusted-builder
      - backend-producer
      - web-producer
      - windows-producer
      - android-producer
      - macos-raw-producer
      - ios-raw-producer
      - watchos-raw-producer
      - macos-producer
      - ios-producer
      - watchos-producer
      - docs-producer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TRUSTED_BUILDER_SHA: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
      RELEASE_TRUSTED_BUILDER_IDENTITY: ${{ vars.RELEASE_TRUSTED_BUILDER_IDENTITY }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      STAGE_ARTIFACT_SUFFIX: ${{ inputs.request_id || github.run_id }}-${{ github.run_attempt }}
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out the exact candidate with full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download every run input by exact artifact id
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e build || -L build ]]; then
            echo "::error::candidate checkout contains protected-decision build output" >&2
            exit 1
          fi
          mkdir -p build/060/api build/060/release-evidence build/060/coverage-inputs \
            build/060/trust/approvals build/060/trust/resolutions \
            build/060/attestation-verification build/060/protected-decision \
            build/060/exception-ledger
          RELEASE_ARTIFACT_EXTRACTOR="$RUNNER_TEMP/release-artifact-extractor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          if [[ -e "$RELEASE_ARTIFACT_EXTRACTOR" || -L "$RELEASE_ARTIFACT_EXTRACTOR" ]]; then
            echo "::error::protected artifact extractor path already exists" >&2
            exit 1
          fi
          git show "$RELEASE_TRUSTED_BUILDER_SHA:scripts/extract_release_artifact.py" \
            > "$RELEASE_ARTIFACT_EXTRACTOR"
          test -s "$RELEASE_ARTIFACT_EXTRACTOR"
          chmod 0500 "$RELEASE_ARTIFACT_EXTRACTOR"
          export RELEASE_ARTIFACT_EXTRACTOR
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --paginate --jq '.artifacts[]' > build/060/api/artifacts-current.ndjson
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --paginate --jq '.artifacts[]' > build/060/api/artifacts-source.ndjson
          python3 -I - <<'PY'
          import json, os, pathlib, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]

          def records(name):
              lines = pathlib.Path(f"build/060/api/{name}").read_text(encoding="utf-8")
              return [json.loads(line) for line in lines.splitlines() if line.strip()]

          current_artifacts = records("artifacts-current.ndjson")
          source_artifacts = records("artifacts-source.ndjson")
          suffix = os.environ["STAGE_ARTIFACT_SUFFIX"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", suffix):
              raise SystemExit("stage artifact suffix is not canonical")
          stage_outputs_name = f"stage-outputs-{suffix}"
          stage_manifest_name = f"stage-manifest-{suffix}"
          trusted_name = f"trusted-manifests-{suffix}"
          evidence_names = {
              f"evidence-{platform}-{suffix}"
              for platform in (
                  "backend", "web", "windows", "android", "macos", "ios", "watchos", "docs"
              )
          }
          raw_apple_names = {
              f"raw-apple-evidence-{platform}-{suffix}"
              for platform in ("macos", "ios", "watchos")
          }
          raw_apple_targets = {
              f"raw-apple-evidence-{platform}-{suffix}":
                  f"build/060/raw-apple-evidence/{platform}"
              for platform in ("macos", "ios", "watchos")
          }
          candidate = os.environ["CANDIDATE_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("candidate SHA is not canonical")
          if not re.fullmatch(r"[1-9][0-9]*", run_id) or not re.fullmatch(
              r"[1-9][0-9]*", run_attempt
          ):
              raise SystemExit("protected run identity is not canonical")
          windows_name = f"windows-unsigned-{candidate}-{run_id}-{run_attempt}"
          current_targets = {
              **{name: "build/060/release-evidence" for name in evidence_names},
              **raw_apple_targets,
              stage_outputs_name: "build/060/stage",
              stage_manifest_name: "build/060/stage-manifest",
              trusted_name: "build/060/trust",
              windows_name: "build/060/coverage-inputs/windows",
          }
          source_targets = {
              "coverage": "build/060/coverage-inputs/backend",
              "tooling-python-coverage": "build/060/coverage-inputs/tooling",
              "voice-worker-coverage": "build/060/coverage-inputs/voice-worker",
          }
          protected_prefixes = (
              "evidence-",
              "raw-apple-evidence-",
              "stage-outputs-",
              "stage-manifest-",
              "trusted-manifests-",
              "windows-unsigned-",
          )

          listing: dict[str, list[dict]] = {}
          for artifacts, targets, scope in (
              (current_artifacts, current_targets, "current"),
              (source_artifacts, source_targets, "source"),
          ):
              for artifact in artifacts:
                  name = artifact.get("name")
                  if not isinstance(name, str):
                      raise SystemExit("run artifact lacks a string name")
                  if scope == "current" and name in source_targets:
                      raise SystemExit(f"candidate coverage appeared in protected run: {name}")
                  if (
                      scope == "current"
                      and name.startswith(protected_prefixes)
                      and name not in current_targets
                      and name not in raw_apple_names
                  ):
                      raise SystemExit(f"wrong attempt-scoped input artifact name: {name}")
                  if name not in targets:
                      continue
                  if artifact.get("expired") is not False:
                      raise SystemExit(f"selected run artifact is expired: {name}")
                  artifact_id = str(artifact.get("id", ""))
                  size = artifact.get("size_in_bytes")
                  if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
                      raise SystemExit(f"selected run artifact lacks a canonical id: {name}")
                  if (
                      isinstance(size, bool)
                      or not isinstance(size, int)
                      or not 0 < size <= 512 * 1024 * 1024
                  ):
                      raise SystemExit(f"selected run artifact has an invalid size: {name}")
                  listing.setdefault(name, []).append(
                      {"artifact_id": artifact_id, "scope": scope, "size_in_bytes": size}
                  )

          for name in (*current_targets, *source_targets):
              selections = listing.get(name)
              if not isinstance(selections, list) or len(selections) != 1:
                  raise SystemExit(f"required run artifact is missing or ambiguous: {name}")
              expected_scope = "current" if name in current_targets else "source"
              if selections[0]["scope"] != expected_scope:
                  raise SystemExit(f"run artifact has the wrong scope: {name}")
          selected_ids = [
              selection[0]["artifact_id"]
              for selection in listing.values()
          ]
          if len(selected_ids) != len(set(selected_ids)):
              raise SystemExit("selected run artifacts do not have unique immutable ids")

          extractor = os.environ["RELEASE_ARTIFACT_EXTRACTOR"]
          for name in sorted(listing):
              selection = listing[name][0]
              artifact_id = selection["artifact_id"]
              target = (current_targets | source_targets)[name]
              zip_path = pathlib.Path(
                  f"build/060/api/{selection['scope']}-{artifact_id}.zip"
              )
              with zip_path.open("xb") as handle:
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                      check=True,
                      stdout=handle,
                  )
              if zip_path.stat().st_size > 512 * 1024 * 1024:
                  raise SystemExit(f"downloaded run artifact exceeds the byte limit: {name}")
              subprocess.run(
                  [
                      "python3",
                      "-I",
                      extractor,
                      "--archive",
                      str(zip_path),
                      "--target",
                      target,
                  ],
                  check=True,
              )
          pathlib.Path("build/060/api/selected.json").write_text(
              json.dumps(listing, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Independently reconcile the protected stage manifest to current-run API state
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          suffix = os.environ["STAGE_ARTIFACT_SUFFIX"]
          outputs_name = f"stage-outputs-{suffix}"
          manifest_name = f"stage-manifest-{suffix}"
          listing = json.loads(
              pathlib.Path("build/060/api/selected.json").read_text(encoding="utf-8")
          )
          outputs_selection = listing.get(outputs_name)
          manifest_selection = listing.get(manifest_name)
          if (
              not isinstance(outputs_selection, list)
              or len(outputs_selection) != 1
              or outputs_selection[0].get("scope") != "current"
              or not isinstance(manifest_selection, list)
              or len(manifest_selection) != 1
              or manifest_selection[0].get("scope") != "current"
          ):
              raise SystemExit("stage artifacts are not unique current-run selections")
          outputs_id = str(outputs_selection[0]["artifact_id"])
          output_path = pathlib.Path("build/060/stage/staging-outputs.json")
          source_manifest_path = pathlib.Path(
              "build/060/stage-manifest/trusted-stage-deploy.json"
          )
          trusted_manifest_path = pathlib.Path(
              "build/060/trust/stage/trusted-stage-deploy.json"
          )
          for root, expected in (
              (pathlib.Path("build/060/stage"), output_path),
              (pathlib.Path("build/060/stage-manifest"), source_manifest_path),
          ):
              members = sorted(path for path in root.rglob("*") if path.is_file())
              if members != [expected] or any(path.is_symlink() for path in root.rglob("*")):
                  raise SystemExit("stage artifact has unexpected or symlinked members")
          if source_manifest_path.read_bytes() != trusted_manifest_path.read_bytes():
              raise SystemExit("attested stage manifest differs from its immutable source artifact")
          manifest = json.loads(source_manifest_path.read_text(encoding="utf-8"))
          expected_claim = {
              "kind": "github_actions_artifact_member",
              "repository": repo,
              "run_id": run_id,
              "run_attempt": run_attempt,
              "artifact_id": outputs_id,
              "artifact_name": outputs_name,
              "member": "staging-outputs.json",
              "immutable_reference": (
                  f"gh://{repo}/runs/{run_id}/attempts/{run_attempt}"
                  f"/artifacts/{outputs_id}/members/staging-outputs.json"
              ),
              "sha256": hashlib.sha256(output_path.read_bytes()).hexdigest(),
          }
          if manifest.get("stage_outputs_artifact") != expected_claim:
              raise SystemExit("attested stage manifest has a false stage-output artifact claim")
          output = json.loads(output_path.read_text(encoding="utf-8"))
          expected_deployment = {
              key: value
              for key, value in output.items()
              if key not in {"deployed_at", "macos_personal_agent_host"}
          }
          if manifest.get("deployment") != expected_deployment:
              raise SystemExit("attested stage deployment differs from immutable stage outputs")
          PY
      # The protected debt-ledger branch is created at the T120 bootstrap; an
      # absent ref FAILS this job by design — never tolerated silently.
      - name: Read the protected debt-ledger head (before evaluation)
        shell: bash
        run: |
          set -euo pipefail
          LEDGER_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release-evidence-debt" --jq .object.sha)"
          test "${#LEDGER_SHA}" -eq 40
          echo "LEDGER_SHA=$LEDGER_SHA" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+refs/heads/release-evidence-debt:refs/remotes/origin/release-evidence-debt"
          git archive "$LEDGER_SHA" | tar -x -C build/060/exception-ledger
      - name: Verify every trusted-manifest attestation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TRUSTED_BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$RELEASE_TRUSTED_BUILDER_IDENTITY"
          test "$GITHUB_WORKFLOW_SHA" = "$RELEASE_TRUSTED_BUILDER_SHA"
          for manifest in build/060/trust/producers/*.json build/060/trust/stage/*.json; do
            receipt="build/060/api/attest-$(basename "$manifest").json"
            gh attestation verify "$manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-trusted-builder.yml" \
              --signer-digest "$RELEASE_TRUSTED_BUILDER_SHA" \
              --cert-identity "$RELEASE_TRUSTED_BUILDER_IDENTITY" \
              --format json > "$receipt"
          done
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          trust_artifact_name = f"trusted-manifests-{os.environ['STAGE_ARTIFACT_SUFFIX']}"
          listing = json.loads(pathlib.Path("build/060/api/selected.json").read_text(encoding="utf-8"))
          trust_artifact_id = str(
              listing[trust_artifact_name][0]["artifact_id"]
          )
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          for directory, role in (("producers", "producer"), ("stage", "stage_deploy")):
              for path in sorted(pathlib.Path(f"build/060/trust/{directory}").glob("*.json")):
                  document = json.loads(path.read_text(encoding="utf-8"))
                  manifest_id = document["manifest_id"]
                  member = f"{directory}/{path.name}"
                  receipt = {
                      "manifest_id": manifest_id,
                      "role": role,
                      "verification_outcome": "passed",
                      "repository": repo,
                      "candidate_sha": os.environ["CANDIDATE_SHA"],
                      "protected_builder_sha": os.environ["RELEASE_TRUSTED_BUILDER_SHA"],
                      "protected_builder_identity": os.environ["RELEASE_TRUSTED_BUILDER_IDENTITY"],
                      "manifest_artifact": {
                          "kind": "github_actions_artifact_member",
                          "repository": repo,
                          "run_id": run_id,
                          "run_attempt": run_attempt,
                          "artifact_id": trust_artifact_id,
                          "artifact_name": trust_artifact_name,
                          "member": member,
                          "immutable_reference": (
                              f"gh://{repo}/runs/{run_id}/attempts/{run_attempt}"
                              f"/artifacts/{trust_artifact_id}/members/{member}"
                          ),
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      },
                      "verified_at": now,
                  }
                  out = pathlib.Path(f"build/060/attestation-verification/{manifest_id}.json")
                  out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      # The policy copy comes from the PINNED protected commit — never the
      # candidate checkout. Its tar digest is the --protected-policy-sha.
      - name: Extract the pinned protected policy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TRUSTED_BUILDER_SHA"
          git archive "$RELEASE_TRUSTED_BUILDER_SHA" \
            scripts/extract_release_artifact.py \
            scripts/validate_release_evidence.py \
            scripts/check_changed_coverage.py \
            scripts/prepare_release_evidence.py \
            specs/060-runtime-reliability-hardening/contracts/windows-deployment-profile.schema.json \
            specs/060-runtime-reliability-hardening/contracts/release-evidence.schema.json \
            specs/060-runtime-reliability-hardening/contracts/release-trust.schema.json \
            > build/060/protected-policy.tar
          PROTECTED_POLICY_SHA256="$(sha256sum build/060/protected-policy.tar | cut -d ' ' -f 1)"
          test "${#PROTECTED_POLICY_SHA256}" -eq 64
          echo "PROTECTED_POLICY_SHA256=$PROTECTED_POLICY_SHA256" >> "$GITHUB_ENV"
          mkdir -p build/060/protected-policy
          tar -xf build/060/protected-policy.tar -C build/060/protected-policy
          test -z "$(find build/060/protected-policy -type l -print -quit)"
      - name: Run the protected changed-code coverage gate
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|/app/backend|backend|g' build/060/coverage-inputs/backend/coverage.xml
          sed -i 's|/app/backend|backend|g' build/060/coverage-inputs/voice-worker/voice-worker.xml
          WINDOWS_COVERAGE="$(find build/060/coverage-inputs/windows -name windows-coverage.xml -print -quit)"
          test -n "$WINDOWS_COVERAGE"
          python3 -I build/060/protected-policy/scripts/check_changed_coverage.py \
            --repo . \
            --event-name "${GITHUB_EVENT_NAME/workflow_dispatch/manual}" \
            --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --backend-python build/060/coverage-inputs/backend/coverage.xml \
            --voice-worker-python build/060/coverage-inputs/voice-worker/voice-worker.xml \
            --tooling-python build/060/coverage-inputs/tooling/tooling-python.xml \
            --windows-python "$WINDOWS_COVERAGE" \
            --javascript build/060/release-evidence/coverage/web-istanbul.json \
            --android-app build/060/release-evidence/coverage/android-app.xml \
            --android-core build/060/release-evidence/coverage/android-core.xml \
            --ios build/060/release-evidence/coverage/apple-ios-xccov.json \
            --macos build/060/release-evidence/coverage/apple-macos-xccov.json \
            --watchos build/060/release-evidence/coverage/apple-watchos-xccov.json \
            --coverage-mode strict \
            --fail-under 90 \
            --output build/060/release-evidence/coverage/changed-code.json
          COVERAGE_PERCENT="$(python3 -I -c "import json; print(json.load(open('build/060/release-evidence/coverage/changed-code.json'))['combined']['percent'])")"
          echo "COVERAGE_PERCENT=$COVERAGE_PERCENT" >> "$GITHUB_ENV"
      # Mechanical canonical assembly (content-derived UUIDv5); every claim in
      # the assembled set is still re-validated by the protected policy below.
      - name: Assemble the canonical evidence set
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import importlib.util, json, pathlib, sys
          from datetime import datetime, timezone

          spec = importlib.util.spec_from_file_location(
              "astral_prepare_release_evidence",
              "build/060/protected-policy/scripts/prepare_release_evidence.py",
          )
          prepare = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = prepare
          spec.loader.exec_module(prepare)

          root = pathlib.Path("build/060/release-evidence")
          reports, requests = [], []
          for path in sorted(root.glob("*.json")):
              document = json.loads(path.read_text(encoding="utf-8"))
              if document.get("document_type") == "platform_evidence":
                  reports.append(document)
              elif document.get("document_type") == "evidence_exception_request":
                  requests.append(document)
              elif document.get("document_type") == "release_evidence_set":
                  raise SystemExit("producers must not upload a pre-assembled evidence set")
          evidence_set = prepare.assemble_evidence_set(
              reports, requests, now=datetime.now(timezone.utc)
          )
          out = root / "release-evidence-set.json"
          out.write_text(
              json.dumps(evidence_set, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"assembled {out} for {len(reports)} platform reports")
          PY
      - name: Upload the canonical evidence bundle
        id: evidence-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: build/060/release-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Bind the exact evidence-set and coverage artifact members
        shell: bash
        env:
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          artifact_id = os.environ["EVIDENCE_ARTIFACT_ID"]

          def member_record(member: str, path: str) -> dict:
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              return {
                  "kind": "github_actions_artifact_member",
                  "repository": repo,
                  "run_id": run_id,
                  "run_attempt": run_attempt,
                  "artifact_id": str(artifact_id),
                  "artifact_name": "release-evidence",
                  "member": member,
                  "immutable_reference": (
                      f"gh://{repo}/runs/{run_id}/attempts/{run_attempt}"
                      f"/artifacts/{artifact_id}/members/{member}"
                  ),
                  "sha256": digest,
              }

          out = pathlib.Path("build/060/protected-decision")
          out.joinpath("evidence-set-artifact.json").write_text(
              json.dumps(member_record(
                  "release-evidence-set.json",
                  "build/060/release-evidence/release-evidence-set.json",
              ), indent=2, sort_keys=True) + "\n", encoding="utf-8",
          )
          out.joinpath("coverage-artifact.json").write_text(
              json.dumps(member_record(
                  "coverage/changed-code.json",
                  "build/060/release-evidence/coverage/changed-code.json",
              ), indent=2, sort_keys=True) + "\n", encoding="utf-8",
          )
          PY
      - name: Run the protected release-evidence policy and emit the decision
        shell: bash
        run: |
          set -euo pipefail
          VALID_UNTIL="$(date -u -d '+20 hours' +%Y-%m-%dT%H:%M:%SZ)"
          python3 -I build/060/protected-policy/scripts/validate_release_evidence.py \
            --schema build/060/protected-policy/specs/060-runtime-reliability-hardening/contracts/release-evidence.schema.json \
            --trust-schema build/060/protected-policy/specs/060-runtime-reliability-hardening/contracts/release-trust.schema.json \
            --deployment-profile-schema build/060/protected-policy/specs/060-runtime-reliability-hardening/contracts/windows-deployment-profile.schema.json \
            --evidence-dir build/060/release-evidence \
            --base-sha "$BASE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-provenance-dir build/060/trust/producers \
            --raw-apple-evidence-dir build/060/raw-apple-evidence \
            --windows-product-evidence-dir build/060/coverage-inputs/windows \
            --trusted-stage-deploy build/060/trust/stage/trusted-stage-deploy.json \
            --trusted-approvals-dir build/060/trust/approvals \
            --trusted-debt-resolutions-dir build/060/trust/resolutions \
            --attestation-verification-dir build/060/attestation-verification \
            --protected-builder-sha "$RELEASE_TRUSTED_BUILDER_SHA" \
            --protected-builder-identity "$RELEASE_TRUSTED_BUILDER_IDENTITY" \
            --protected-policy-sha "$PROTECTED_POLICY_SHA256" \
            --exception-ledger-repository "$GITHUB_REPOSITORY" \
            --exception-ledger-ref refs/heads/release-evidence-debt \
            --exception-ledger-commit "$LEDGER_SHA" \
            --exception-ledger-checkout build/060/exception-ledger \
            --coverage-percent "$COVERAGE_PERCENT" \
            --coverage-artifact build/060/protected-decision/coverage-artifact.json \
            --evidence-set-artifact build/060/protected-decision/evidence-set-artifact.json \
            --protected-workflow-ref "$GITHUB_REPOSITORY/.github/workflows/release-readiness.yml@$GITHUB_WORKFLOW_SHA" \
            --valid-until "$VALID_UNTIL" \
            --decision-output build/060/protected-decision/trusted-release-decision.json
      - name: Re-read the protected debt-ledger head (after evaluation)
        shell: bash
        run: |
          set -euo pipefail
          AFTER="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release-evidence-debt" --jq .object.sha)"
          test "$AFTER" = "$LEDGER_SHA" || { echo "::error::debt ledger moved during evaluation" >&2; exit 1; }
      - name: Attest the exact protected release decision
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/060/protected-decision/trusted-release-decision.json
      - name: Upload the trusted release decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-release-decision
          path: build/060/protected-decision/trusted-release-decision.json
          if-no-files-found: error
          retention-days: 90

  stage-cleanup:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && always() && needs.stage-deploy.outputs.runner_name != '' }}
    needs:
      - stage-deploy
      - windows-candidate
      - backend-producer
      - web-producer
      - windows-producer
      - android-producer
      - macos-raw-producer
      - ios-raw-producer
      - watchos-raw-producer
      - macos-producer
      - ios-producer
      - watchos-producer
      - docs-producer
      - trusted-builder
      - protected-decision
    # Runs on the same labeled persistent staging host as stage-deploy.
    runs-on: [self-hosted, astral-staging]
    timeout-minutes: 20
    env:
      ASTRAL_STAGING_RUNNER_TRUSTED: "true"
      ASTRAL_STAGING_EXPECTED_RUNNER_NAME: ${{ needs.stage-deploy.outputs.runner_name }}
      STAGING_ENVIRONMENT_ID: rr-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TRUSTED_BUILDER_SHA: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
    steps:
      - name: Check out the owner-reviewed cleanup policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ vars.RELEASE_TRUSTED_BUILDER_SHA }}
          path: protected-policy
          persist-credentials: false
      - name: Bind cleanup to the protected checkpoint
        run: |
          set -euo pipefail
          runner_name_pattern='^[A-Za-z0-9][A-Za-z0-9._ -]{0,199}$'
          test "$GITHUB_WORKFLOW_SHA" = "$RELEASE_TRUSTED_BUILDER_SHA"
          test -n "$ASTRAL_STAGING_EXPECTED_RUNNER_NAME"
          if [[ ! "$RUNNER_NAME" =~ $runner_name_pattern ]]; then
            echo "::error::cleanup runner name is not canonical" >&2
            exit 1
          fi
          test "$RUNNER_NAME" = "$ASTRAL_STAGING_EXPECTED_RUNNER_NAME"
          test "$(git -C protected-policy rev-parse HEAD)" = "$RELEASE_TRUSTED_BUILDER_SHA"
      - name: Tear down the staging namespace
        run: >-
          python3 protected-policy/scripts/run_candidate_staging.py cleanup
          --environment-id "$STAGING_ENVIRONMENT_ID"
