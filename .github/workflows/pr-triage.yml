# Reconciles missing PR context and exact-head maintainer decisions using trusted metadata.
name: PR triage
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview triage without changing pull requests or comments
        required: true
        type: boolean
        default: true
permissions: {}
concurrency:
  group: pr-triage
  cancel-in-progress: false
jobs:
  triage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: AstralDeep/astraldeep.github.io/actions/pr-triage@9c83bac26fe9c5d594388afb70b30ed9076c90f1
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
