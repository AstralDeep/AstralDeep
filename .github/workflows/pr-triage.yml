# Reconciles missing PR context and exact-head maintainer decisions using trusted metadata.
name: PR triage
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview triage without changing pull requests or comments
        required: true
        type: boolean
        default: true
permissions: {}
jobs:
  triage:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, '/astral-triage close '))))
    concurrency:
      group: pr-triage
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: AstralDeep/astraldeep.github.io/actions/pr-triage@9c83bac26fe9c5d594388afb70b30ed9076c90f1
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
