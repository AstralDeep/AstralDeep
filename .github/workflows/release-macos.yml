# Publishes a notarized macOS DMG as an immutable macos-v<version>-<build> release after CI succeeds for a push to main, or stages one when dispatched from main.
# The RELEASE_MACOS_HOLD repository variable set to true stops the automatic path and never blocks a dispatch, and the DMG ships the signed macOS node pack with the two Linux packs.
# scripts/next_macos_release.py decides the version, scripts/macos_release_notes.py writes the notes and scripts/release_macos.py builds, notarizes and publishes.
# Framework-only dry runs build the same source-bound Apple artifacts without Mac packaging or signing.
name: Release macOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, notarize and stage without publishing
        type: boolean
        default: true
      framework_only:
        description: Build only the source-bound Apple framework (requires dry_run)
        type: boolean
        default: false
      emergency_skip_ci:
        description: Publish from main without the exact-head CI gate (manual emergency release only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && 'dry-run' || 'publish' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  decide:
    name: Decide the next Mac release
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || (vars.RELEASE_MACOS_HOLD != 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      head: ${{ steps.decide.outputs.head }}
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      skip: ${{ steps.decide.outputs.skip }}
      previous_target: ${{ steps.decide.outputs.previous_target }}
    steps:
      - name: Reject framework-only publication
        if: ${{ inputs.framework_only == true && inputs.dry_run != true }}
        run: |
          echo "::error::framework_only requires dry_run=true."
          exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Require green CI before a dispatched publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.emergency_skip_ci != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=push&branch=main&status=success&per_page=1" --jq '.total_count')"
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful CI push run on main for $head; dispatch a dry run instead."
            exit 1
          fi
      - name: Record manual emergency CI override
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.emergency_skip_ci == true }}
        run: echo "::warning::Publishing from main with the exact-head CI gate waived by the manual dispatcher."
      - name: Decide the next release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
          FRAMEWORK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.framework_only == true }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$EXPECTED_HEAD"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [[ "$FRAMEWORK_ONLY" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/next_macos_release.py --repo "$GITHUB_REPOSITORY" --head "$head" --pbxproj components/AstralProjection/apple-clients/AstralApp/AstralApp.xcodeproj/project.pbxproj --github-output "$GITHUB_OUTPUT"
          fi
      - name: Confirm framework-only source decision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.framework_only == true && inputs.dry_run == true }}
        env:
          DECIDED_HEAD: ${{ steps.decide.outputs.head }}
          EXPECTED_HEAD: ${{ github.sha }}
          DECIDED_SKIP: ${{ steps.decide.outputs.skip }}
        run: |
          set -euo pipefail
          test "$DECIDED_HEAD" = "$EXPECTED_HEAD"
          test "$DECIDED_SKIP" = "false"

  native-check:
    name: Require exact pinned Projection Apple CI
    needs: [decide]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (needs.decide.outputs.skip != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          persist-credentials: false
      - name: Wait for pinned Projection Apple CI
        env:
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
          projection="$(git ls-tree HEAD -- components/AstralProjection | awk '$1 == "160000" && $2 == "commit" && $4 == "components/AstralProjection" { print $3 }')"
          [[ "$projection" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Missing exact Projection gitlink"; exit 1; }
          repo=AstralDeep/AstralProjection
          workflow=.github/workflows/apple-ci.yml
          for attempt in {1..26}; do
            response="$(curl --fail --silent --show-error --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$repo/actions/workflows/apple-ci.yml/runs?head_sha=$projection&event=push&branch=main&per_page=100")"
            decision="$(python3 -c '
          import json
          import sys

          sha, repo, workflow = sys.argv[1:]
          try:
              payload = json.load(sys.stdin)
              runs = payload["workflow_runs"]
              if not isinstance(runs, list):
                  raise ValueError("workflow_runs is not an array")
              matches = []
              for run in runs:
                  if not isinstance(run, dict) or not isinstance(run.get("repository"), dict) or not isinstance(run.get("head_repository"), dict):
                      raise ValueError("workflow run identity is malformed")
                  if (run.get("head_sha") == sha and run.get("head_branch") == "main"
                          and run.get("event") == "push" and run.get("path") == workflow
                          and run["repository"].get("full_name") == repo
                          and run["head_repository"].get("full_name") == repo):
                      matches.append(run)
              if any(run.get("status") not in {"requested", "queued", "pending", "in_progress", "waiting", "completed"} for run in matches):
                  raise ValueError("workflow run status is malformed")
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
              sys.exit(f"Malformed Projection Apple CI response: {error}")
          if any(run["status"] == "completed" and run.get("conclusion") == "success" for run in matches):
              print("success")
          elif any(run["status"] == "completed" for run in matches):
              print("failure")
          else:
              print("pending")
          ' "$projection" "$repo" "$workflow" <<< "$response")"
            if [[ "$decision" == success ]]; then
              echo "Pinned Projection Apple CI succeeded for $projection"
              exit 0
            fi
            if [[ "$decision" == failure ]]; then
              echo "::error::Pinned Projection Apple CI completed without success for $projection"
              exit 1
            fi
            if (( attempt < 26 )); then sleep 60; fi
          done
          echo "::error::No successful pinned Projection Apple CI within 25 minutes for $projection"
          exit 1

  apple-artifacts:
    name: Build source-bound Apple framework
    needs: [decide]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (needs.decide.outputs.skip != 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          submodules: recursive
          persist-credentials: false
      - name: Select exact Xcode for source-bound artifacts
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
      - name: Build and verify the pinned Apple Kernel framework
        env:
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          components/AstralKernel/scripts/build-apple.sh
          python3 components/AstralKernel/scripts/artifact_manifest.py verify \
            --root components/AstralProjection/apple-clients/AstralKernel/Artifacts \
            --kind apple --expected-source "$(git -C components/AstralKernel rev-parse HEAD)"
          tar -czf "$RUNNER_TEMP/apple-artifacts.tar.gz" -C components/AstralProjection/apple-clients/AstralKernel Artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-apple-artifacts-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/apple-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 1

  node-pack:
    name: Build and qualify source-bound node pack
    needs: [decide, apple-artifacts]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (inputs.framework_only != true && needs.decide.outputs.skip != 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact Xcode for pack qualification
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-apple-artifacts-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/apple-input
      - name: Restore and verify the pinned Apple framework
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/apple-input/apple-artifacts.tar.gz" -C components/AstralProjection/apple-clients/AstralKernel
          python3 components/AstralKernel/scripts/artifact_manifest.py verify \
            --root components/AstralProjection/apple-clients/AstralKernel/Artifacts \
            --kind apple --expected-source "$(git -C components/AstralKernel rev-parse HEAD)"
      - name: Build, check and seal the unsigned Mac node pack
        env:
          RUSTUP_TOOLCHAIN: "1.99.1"
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 aarch64-apple-darwin
          bash components/AstralKernel/scripts/build-python-macos.sh --out "$RUNNER_TEMP/kernel-macos"
          mkdir -p "$RUNNER_TEMP/bundle"
          python3 scripts/node_bundle/assemble.py --platform macos-arm64 --kernel-dir "$RUNNER_TEMP/kernel-macos" \
            --out "$RUNNER_TEMP/bundle/macos-arm64" --work "$RUNNER_TEMP/nodepack-work"
          digest="$(shasum -a 256 "$RUNNER_TEMP/bundle/macos-arm64/node-pack.json" | cut -d' ' -f1)"
          python3 scripts/node_bundle/verify.py "$RUNNER_TEMP/bundle/macos-arm64/node-pack.json" --sha256 "$digest" --into "$RUNNER_TEMP/pack-check"
          tar -czf "$RUNNER_TEMP/node-pack.tar.gz" -C "$RUNNER_TEMP/bundle" macos-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-node-pack-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/node-pack.tar.gz
          if-no-files-found: error
          retention-days: 1

  node-pack-linux-aarch64:
    name: Build and check the linux-aarch64 node pack
    needs: [decide]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (inputs.framework_only != true && needs.decide.outputs.skip != 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build the pinned Kernel artifacts and the node pack
        env:
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
          python scripts/build_kernel_binding.py --root . --output "$RUNNER_TEMP/kernel-binding" --platform linux-aarch64
          python scripts/install_kernel_binding.py verify --artifacts "$RUNNER_TEMP/kernel-binding" --platform linux-aarch64
          mkdir -p "$RUNNER_TEMP/bundle"
          python scripts/node_bundle/linux/build_linux.py --platform linux-aarch64 --kernel-dir "$RUNNER_TEMP/kernel-binding" \
            --out "$RUNNER_TEMP/bundle/linux-aarch64"
          tar -czf "$RUNNER_TEMP/node-pack.tar.gz" -C "$RUNNER_TEMP/bundle" linux-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-aarch64-node-pack-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/node-pack.tar.gz
          if-no-files-found: error
          retention-days: 1

  node-pack-linux-x86-64:
    name: Build and check the linux-x86_64 node pack
    needs: [decide]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (inputs.framework_only != true && needs.decide.outputs.skip != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build the pinned Kernel artifacts and the node pack
        env:
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
          python scripts/build_kernel_binding.py --root . --output "$RUNNER_TEMP/kernel-binding" --platform linux-x86_64
          python scripts/install_kernel_binding.py verify --artifacts "$RUNNER_TEMP/kernel-binding" --platform linux-x86_64
          mkdir -p "$RUNNER_TEMP/bundle"
          python scripts/node_bundle/linux/build_linux.py --platform linux-x86_64 --kernel-dir "$RUNNER_TEMP/kernel-binding" \
            --out "$RUNNER_TEMP/bundle/linux-x86_64"
          tar -czf "$RUNNER_TEMP/node-pack.tar.gz" -C "$RUNNER_TEMP/bundle" linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64-node-pack-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/node-pack.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build, notarize and publish the Mac DMG
    needs: [decide, native-check, apple-artifacts, node-pack, node-pack-linux-aarch64, node-pack-linux-x86-64]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (inputs.framework_only != true && needs.decide.outputs.skip != 'true' && needs.native-check.result == 'success' && (github.event_name == 'workflow_dispatch' || (vars.RELEASE_MACOS_HOLD != 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))) }}
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-macos
    permissions:
      contents: write
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
      VERSION: ${{ needs.decide.outputs.version }}
      BUILD: ${{ needs.decide.outputs.build }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Require the decided commit
        env:
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-apple-artifacts-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/apple-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-node-pack-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/node-pack-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-aarch64-node-pack-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/node-pack-input-linux-aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-x86_64-node-pack-${{ needs.decide.outputs.head }}
          path: ${{ runner.temp }}/node-pack-input-linux-x86_64
      - name: Restore and verify source-bound release inputs
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/apple-input/apple-artifacts.tar.gz" -C components/AstralProjection/apple-clients/AstralKernel
          mkdir -p "$RUNNER_TEMP/bundle-unsigned" "$RUNNER_TEMP/bundle"
          tar -xzf "$RUNNER_TEMP/node-pack-input/node-pack.tar.gz" -C "$RUNNER_TEMP/bundle-unsigned"
          tar -xzf "$RUNNER_TEMP/node-pack-input-linux-aarch64/node-pack.tar.gz" -C "$RUNNER_TEMP/bundle"
          tar -xzf "$RUNNER_TEMP/node-pack-input-linux-x86_64/node-pack.tar.gz" -C "$RUNNER_TEMP/bundle"
          python3 components/AstralKernel/scripts/artifact_manifest.py verify \
            --root components/AstralProjection/apple-clients/AstralKernel/Artifacts \
            --kind apple --expected-source "$(git -C components/AstralKernel rev-parse HEAD)"
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Require release secrets
        env:
          APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 SPARKLE_ED25519_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi
          echo "All release secrets are present."
      - name: Import the Developer ID identity into an ephemeral keychain
        env:
          APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/astral-release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application: Personalized AI Labs LLC (593LGH35GS)"; then
            echo "::error::The .p12 holds no Developer ID Application identity with its private key."
            exit 1
          fi
      - name: Write the notary and Sparkle keys
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
      - name: Sign the Mac node pack with the hardened runtime and try notarizing it
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 scripts/node_bundle/sign_macos.py "$RUNNER_TEMP/bundle-unsigned/macos-arm64/node-pack.json" \
            --identity "Developer ID Application: Personalized AI Labs LLC (593LGH35GS)" --hardened \
            --out "$RUNNER_TEMP/bundle/macos-arm64"
          digest="$(shasum -a 256 "$RUNNER_TEMP/bundle/macos-arm64/node-pack.json" | cut -d' ' -f1)"
          python3 scripts/node_bundle/verify.py "$RUNNER_TEMP/bundle/macos-arm64/node-pack.json" --sha256 "$digest" --into "$RUNNER_TEMP/pack-signed"
          ditto -c -k --keepParent "$RUNNER_TEMP/pack-signed" "$RUNNER_TEMP/pack-trial.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/pack-trial.zip" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json)"
          printf '%s' "$result" | python3 -c 'import json,sys; status=json.load(sys.stdin).get("status"); sys.exit(0 if status == "Accepted" else "notarization trial of the signed node pack ended " + str(status))'
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TARGET: ${{ needs.decide.outputs.previous_target }}
        run: |
          set -euo pipefail
          python scripts/macos_release_notes.py --repo "$GITHUB_REPOSITORY" --base "$PREVIOUS_TARGET" --head "$(git rev-parse HEAD)" --version "$VERSION" --build "$BUILD" --output "$RUNNER_TEMP/notes.md"
      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          args=(
            --projection-commit "$(git -C components/AstralProjection rev-parse HEAD)"
            --version "$VERSION" --build "$BUILD" --channel stable --notes "$RUNNER_TEMP/notes.md"
            --ed-key-file "$RUNNER_TEMP/sparkle.key"
            --notary-key "$RUNNER_TEMP/AuthKey.p8" --notary-key-id "$ASC_KEY_ID" --notary-issuer "$ASC_ISSUER_ID"
            --staging-dir "$RUNNER_TEMP/stage" --work-dir "$RUNNER_TEMP/work"
            --node-bundle-dir "$RUNNER_TEMP/bundle" --node-team-id 593LGH35GS
          )
          if [ "$DRY_RUN" != "true" ]; then
            args+=(--publish)
          fi
          python scripts/release_macos.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ needs.decide.outputs.version }}-${{ needs.decide.outputs.build }}
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/developer-id.p12"
          if [ -f "$RUNNER_TEMP/astral-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/astral-release.keychain-db"
          fi
