# Publishes a notarized macOS DMG as an immutable macos-v<version>-<build> release after CI succeeds for a push to main, or stages one when dispatched from main.
# scripts/next_macos_release.py decides the version, scripts/macos_release_notes.py writes the notes and scripts/release_macos.py builds, notarizes and publishes.
name: Release macOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, notarize and stage without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && 'dry-run' || 'publish' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  decide:
    name: Decide the next Mac release
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      head: ${{ steps.decide.outputs.head }}
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      skip: ${{ steps.decide.outputs.skip }}
      previous_target: ${{ steps.decide.outputs.previous_target }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Require green CI before a dispatched publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=push&branch=main&status=success&per_page=1" --jq '.total_count')"
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful CI push run on main for $head; dispatch a dry run instead."
            exit 1
          fi
      - name: Decide the next release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$EXPECTED_HEAD"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          python scripts/next_macos_release.py --repo "$GITHUB_REPOSITORY" --head "$head" --pbxproj components/AstralProjection/apple-clients/AstralApp/AstralApp.xcodeproj/project.pbxproj --github-output "$GITHUB_OUTPUT"

  release:
    name: Build, notarize and publish the Mac DMG
    needs: [decide]
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (needs.decide.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))) }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release-macos
    permissions:
      contents: write
    env:
      XCODE_VERSION: "26.6"
      XCODE_BUILD: "17F113"
      VERSION: ${{ needs.decide.outputs.version }}
      BUILD: ${{ needs.decide.outputs.build }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.decide.outputs.head }}
          submodules: recursive
          persist-credentials: false
      - name: Require the decided commit
        env:
          DECIDED_HEAD: ${{ needs.decide.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$DECIDED_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Require release secrets
        env:
          APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 SPARKLE_ED25519_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi
          echo "All release secrets are present."
      - name: Import the Developer ID identity into an ephemeral keychain
        env:
          APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/astral-release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_APP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application: Personalized AI Labs LLC (593LGH35GS)"; then
            echo "::error::The .p12 holds no Developer ID Application identity with its private key."
            exit 1
          fi
      - name: Write the notary and Sparkle keys
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TARGET: ${{ needs.decide.outputs.previous_target }}
        run: |
          set -euo pipefail
          python scripts/macos_release_notes.py --repo "$GITHUB_REPOSITORY" --base "$PREVIOUS_TARGET" --head "$(git rev-parse HEAD)" --version "$VERSION" --build "$BUILD" --output "$RUNNER_TEMP/notes.md"
      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          args=(
            --projection-commit "$(git -C components/AstralProjection rev-parse HEAD)"
            --version "$VERSION" --build "$BUILD" --channel stable --notes "$RUNNER_TEMP/notes.md"
            --ed-key-file "$RUNNER_TEMP/sparkle.key"
            --notary-key "$RUNNER_TEMP/AuthKey.p8" --notary-key-id "$ASC_KEY_ID" --notary-issuer "$ASC_ISSUER_ID"
            --staging-dir "$RUNNER_TEMP/stage" --work-dir "$RUNNER_TEMP/work"
          )
          if [ "$DRY_RUN" != "true" ]; then
            args+=(--publish)
          fi
          python scripts/release_macos.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ needs.decide.outputs.version }}-${{ needs.decide.outputs.build }}
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: ${{ !cancelled() }}
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/developer-id.p12"
          if [ -f "$RUNNER_TEMP/astral-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/astral-release.keychain-db"
          fi
