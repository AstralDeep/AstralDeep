# Publishes the exact backend image from a successful same-repository main-branch CI run.
# The default-branch controller verifies its source and image identity before applying the immutable SHA tag and latest pointer.
name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish the qualified ghcr image
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/python-ci/requirements.lock.txt
      - name: Install hash-locked CI-only Python tooling
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Composition preflight (exact pins, contracts, gitlinks)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          python scripts/verify_composition.py --root .
          python scripts/install_local_components.py validate --root . --require-gitlinks
      - name: Resolve image references
        id: refs
        run: |
          set -euo pipefail
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.event.workflow_run.head_sha }}"
          {
            echo "image=ghcr.io/${REPO_LC}"
            echo "sha_tag=ghcr.io/${REPO_LC}:sha-${SHA}"
            echo "latest_tag=ghcr.io/${REPO_LC}:latest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: build/backend-web
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and tag the exact qualified backend image
        run: |
          set -euo pipefail
          image="$(cat build/backend-web/image-id.txt)"
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker load --input build/backend-web/image.tar.gz
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.event.workflow_run.head_sha }}"
          docker tag "$image" "${{ steps.refs.outputs.sha_tag }}"
          docker tag "$image" "${{ steps.refs.outputs.latest_tag }}"
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the immutable sha tag and the latest pointer
        run: |
          set -euo pipefail
          docker push "${{ steps.refs.outputs.sha_tag }}"
          docker push "${{ steps.refs.outputs.latest_tag }}"
          DIGEST=$(docker buildx imagetools inspect "${{ steps.refs.outputs.sha_tag }}" --format '{{.Manifest.Digest}}')
          echo "::notice::published ${{ steps.refs.outputs.sha_tag }} (${DIGEST}) and ${{ steps.refs.outputs.latest_tag }}"
          {
            echo "## Published image"
            echo
            echo "- \`${{ steps.refs.outputs.sha_tag }}\`"
            echo "- \`${{ steps.refs.outputs.image }}@${DIGEST}\`"
            echo "- \`${{ steps.refs.outputs.latest_tag }}\` (convenience pointer)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
