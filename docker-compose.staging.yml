name: ${STAGING_PROJECT_NAME:?set a request-scoped staging project name}

x-staging-ownership: &staging-ownership
  com.astraldeep.staging.managed: "true"
  com.astraldeep.staging.project: ${STAGING_PROJECT_NAME:?set a request-scoped staging project name}
  com.astraldeep.staging.environment-id: ${STAGING_ENVIRONMENT_ID:?set the exact protected environment id}
  com.astraldeep.staging.run-id: ${STAGING_RUN_ID:?set the exact protected workflow run id}
  com.astraldeep.staging.run-attempt: ${STAGING_RUN_ATTEMPT:?set the exact protected workflow run attempt}

services:
  postgres:
    image: ${STAGING_POSTGRES_IMAGE:?set a digest-qualified PostgreSQL image}
    labels: *staging-ownership
    environment:
      POSTGRES_USER: ${STAGING_DB_USER:?set the staging database user}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?set the staging database password}
      POSTGRES_DB: ${STAGING_DB_NAME:?set the staging database name}
    volumes:
      - product-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"

  keycloak-postgres:
    image: ${STAGING_POSTGRES_IMAGE:?set a digest-qualified PostgreSQL image}
    labels: *staging-ownership
    environment:
      POSTGRES_USER: ${STAGING_KEYCLOAK_DB_USER:?set the Keycloak database user}
      POSTGRES_PASSWORD: ${STAGING_KEYCLOAK_DB_PASSWORD:?set the Keycloak database password}
      POSTGRES_DB: ${STAGING_KEYCLOAK_DB_NAME:?set the Keycloak database name}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"

  keycloak:
    image: ${STAGING_KEYCLOAK_IMAGE:?set a digest-qualified Keycloak image}
    labels: *staging-ownership
    command:
      - start
      - --http-enabled=true
      - --hostname-strict=false
      - --import-realm
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${STAGING_KEYCLOAK_DB_NAME:?set the Keycloak database name}
      KC_DB_USERNAME: ${STAGING_KEYCLOAK_DB_USER:?set the Keycloak database user}
      KC_DB_PASSWORD: ${STAGING_KEYCLOAK_DB_PASSWORD:?set the Keycloak database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${STAGING_KEYCLOAK_ADMIN_USER:?set the Keycloak bootstrap user}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${STAGING_KEYCLOAK_ADMIN_PASSWORD:?set the Keycloak bootstrap password}
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./backend/tests/fixtures/runtime_reliability_060/staging/keycloak-realm.json:/opt/keycloak/data/import/astral-060-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: "no"

  livekit:
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    labels: *staging-ownership
    command:
      - --config
      - /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set the protected LiveKit API key}: ${LIVEKIT_API_SECRET:?set the protected LiveKit API secret}"
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:?set the public TURN certificate domain}
    ports:
      # Signaling is reachable only by the host's trusted HTTPS/WSS terminator.
      - "127.0.0.1:7880:7880/tcp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      # LiveKit v1.13.5 advertises turns:<domain>:443. The same-host L4
      # terminator owns that public port and forwards plaintext to loopback
      # 15349, which maps to the container's external_tls listener on 5349.
      - "127.0.0.1:15349:5349/tcp"
      - "50000-50099:50000-50099/udp"
      - "51000-51099:51000-51099/udp"
    volumes:
      - ./deploy/livekit/livekit.staging.yaml:/etc/livekit.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  astraldeep:
    image: ${ASTRAL_CANDIDATE_IMAGE:?set the digest-qualified candidate image}
    labels: *staging-ownership
    env_file:
      - ${STAGING_RUNTIME_ENV_FILE:?set the protected runtime environment file}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${STAGING_DB_USER:?set the staging database user}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?set the staging database password}
      DB_NAME: ${STAGING_DB_NAME:?set the staging database name}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      FF_BG_CONTINUITY: "true"
      FF_SCHEDULER_EXECUTION: "true"
      OPENAI_BASE_URL: ""
      OPENAI_API_KEY: ""
      # Overridable: production/staging posture refuses the plaintext-derived
      # worker RTC URL (invalid_livekit_url) — point at the LiveKit TLS vhost.
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?set the public staging WSS URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set the protected LiveKit API key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set the protected LiveKit API secret}
      VOICE_CONTROL_SECRET: ${VOICE_CONTROL_SECRET:?set the protected voice-control secret}
      VOICE_WATCH_BRIDGE_PUBLIC_URL: ${VOICE_WATCH_BRIDGE_PUBLIC_URL:?set the public staging Watch bridge WSS URL}
      VOICE_UI_BINDING_SECRET: ${VOICE_UI_BINDING_SECRET:?set the protected UI voice-binding secret}
    ports:
      - 127.0.0.1:${STAGING_BIND_PORT:?set the request-scoped host port}:8001
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      livekit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; r=urllib.request.urlopen('http://localhost:8001/readyz', timeout=5); raise SystemExit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: "no"

  voice-worker:
    image: ${ASTRAL_VOICE_WORKER_IMAGE:?set the digest-qualified candidate voice-worker image}
    labels: *staging-ownership
    environment:
      ASTRAL_ENV: staging
      VOICE_WORKER_IDENTITY: ${VOICE_WORKER_IDENTITY:?set the protected worker identity}
      VOICE_WORKER_MAX_SESSIONS: ${VOICE_WORKER_MAX_SESSIONS:?set the bounded worker capacity}
      VOICE_WATCH_BRIDGE_LISTEN_HOST: 0.0.0.0
      VOICE_WATCH_BRIDGE_LISTEN_PORT: 7890
      VOICE_WORKER_CLOSURE_SHA256: ${VOICE_WORKER_CLOSURE_SHA256:?set the verified CLOSURE.json digest}
      VOICE_SPEECH_BASE_URL: ${OPENAI_BASE_URL:?set the protected operator speech base URL}
      VOICE_SPEECH_API_KEY: ${OPENAI_API_KEY:?set the protected operator speech API key}
      OPENAI_BASE_URL: ""
      OPENAI_API_KEY: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: livekit,astraldeep,localhost,127.0.0.1
      ASTRAL_VOICE_CONTROL_URL: ${ASTRAL_VOICE_CONTROL_URL:?set the protected worker-control WSS URL}
      VOICE_CONTROL_SECRET: ${VOICE_CONTROL_SECRET:?set the protected voice-control secret}
    ports:
      # Plaintext is loopback-only; the protected host ingress terminates TLS
      # and advertises VOICE_WATCH_BRIDGE_PUBLIC_URL as wss://.
      - 127.0.0.1:${STAGING_WATCH_BRIDGE_BIND_PORT:?set the request-scoped Watch bridge port}:7890
    depends_on:
      livekit:
        condition: service_started
      astraldeep:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  product-postgres:
    labels: *staging-ownership
  keycloak-postgres:
    labels: *staging-ownership

networks:
  default:
    labels: *staging-ownership
